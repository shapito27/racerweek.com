 greatEasternMall: {
  "w": 416.7,
  "h": 260,
  "note": "Great Eastern Mall, Jalan Ampang, lit as seen at night, from the Jalan Ampang street view (the drum hides the far wing). Left to right: a dark-blue-glass slab with grey-blue spill-lit ledges and a rounded left end; a front balcony-grid frame (straight sides, fine per-floor sawtooth nubs, dim frame over dark glass, sunshade louvres); a warm-floodlit pale stone core with amber-lit floor ledges, a stepped roof, a ladder-slot, a plain red glowing crown plate and an antenna with a beacon. The podium is the brightest mass, floodlit cream-yellow: a rooftop pergola, a mesh window row, jointed wall panels, dark-blue accent lines that stop at the yellow panel's notches, a slim muted yellow vertical accent with three notches and pale tabs at the blue lines, a blue-framed ribbon window strip to its right, a dark-glass bay column with lit ledges, and a ground floor of a lit canopy and shopfronts. A pale rooftop box and a small service box sit behind the drum's crown. The drum is a reflective blue-green glass barrel with a straight level cap, projecting ledges lit along their top edge, cylinder-foreshortened mullions, lower floors still glazed with warm interior light, and a lit colonnade base. No logo or lettering anywhere.",

/* Bake one landmark into an offscreen canvas.
   heightPx  - target height in LOGICAL px (the landmark's viewBox height maps to this)
   opts.bake - resolution multiplier (2 recommended), opts.skipGroups - e.g. ['statue'], opts.haze - css colour or null
   layer.grad - optional per-layer vertical gradient fill [bottomColor, topColor, yBottom, yTop] in viewBox units; a strict no-op when absent, so it never changes any other landmark's bake.
   Returns { canvas, w, h, pad } in logical px: draw with
     ctx.drawImage(r.canvas, cx - r.w / 2 - r.pad, baseY - r.h - r.pad, r.w + 2 * r.pad, r.h + 2 * r.pad)  */
function bakeLandmark(id, heightPx, opts, makeCanvas) {
  opts = opts || {};
  const lm = KL_LANDMARKS[id], pal = opts.palette || KL_PALETTES[id] || {};
  const bake = opts.bake || 2, pad = 10;
  const k = heightPx / lm.h;
  const w = lm.w * k, h = heightPx;
  const c = makeCanvas(Math.ceil((w + 2 * pad) * bake), Math.ceil((h + 2 * pad) * bake));
  const g = c.getContext('2d');
  g.scale(bake, bake);
  g.translate(pad, pad);
  g.scale(k, k);                                   // from here on we draw in viewBox units
  const skip = opts.skipGroups || [];
  if (id === 'twinTowers') {
    drawTwinTowersRefined(g, skip);
    return { canvas: c, w: w, h: h, pad: pad };
  }
  let bodyPath = null;

  for (let i = 0; i < lm.layers.length; i++) {
    const L = lm.layers[i];
    if (L.group && skip.indexOf(L.group) !== -1) continue;
    const col = L.color || pal[L.role] || '#ff00ff';
    let p;
    if (L.circles) {                                   // compact layer type: [[x, y, r], ...] in viewBox units
      p = new Path2D();
      for (let q = 0; q < L.circles.length; q++) { const ci = L.circles[q]; p.moveTo(ci[0] + ci[2], ci[1]); p.arc(ci[0], ci[1], ci[2], 0, 6.2832); }
    } else p = new Path2D(L.d);
    if (L.role === 'body' && !bodyPath) bodyPath = p;
    const glow = KL_GLOW_ROLES[L.role];
    g.save();
    if (glow) { g.shadowColor = col; g.shadowBlur = glow * bake * (opts.glowScale || 1); }
    if (L.mode === 'stroke') { g.strokeStyle = col; g.lineWidth = L.lw || 1; g.lineCap = 'round'; g.stroke(p); }
    else {
      if (L.grad) {
        const lg = g.createLinearGradient(0, L.grad[2], 0, L.grad[3]);
        lg.addColorStop(0, L.grad[0]); lg.addColorStop(1, L.grad[1]);
        g.fillStyle = lg;
      } else if (L.role === 'body' && pal.bodyGrad) {
        const bg = g.createLinearGradient(0, lm.h, 0, 0);
        const at = pal.bodyGradAt || [0, 0.45];
        bg.addColorStop(at[0], pal.bodyGrad[0]); bg.addColorStop(at[1], pal.bodyGrad[1]); bg.addColorStop(1, pal.bodyGrad[1]);
        g.fillStyle = bg;
      } else g.fillStyle = col;
      g.fill(p, 'nonzero');
    }
    g.restore();

    // windows go right after the first body layer so lit accents still draw on top
    if (L.role === 'body' && p === bodyPath && KL_WINDOWS[id]) {
      const W = KL_WINDOWS[id], rnd = klLcg(W.seed);
      g.save(); g.clip(p); g.fillStyle = W.color;
      const cw = lm.w / W.cols, ch = lm.h / W.rows;
      for (let r = 0; r < W.rows; r++) {
        let pr = W.prob; const f = r / W.rows;
        if (W.bands) for (let b = 0; b < W.bands.length; b++) if (f >= W.bands[b][0] && f <= W.bands[b][1]) pr = W.bands[b][2];
        for (let q = 0; q < W.cols; q++) {
          if (rnd() < pr) {
            g.globalAlpha = 0.35 + rnd() * 0.5;
            if (W.dash) g.fillRect(q * cw + cw * 0.08, r * ch + ch * 0.2, cw * 0.84, ch * 0.5);
            else g.fillRect(q * cw + cw * 0.25, r * ch + ch * 0.3, cw * 0.5, ch * 0.4);
          }
        }
      }
      g.restore();
    }
  }

  // lettering: drawn at bake time. Latin text is set character by character (identical spacing on every platform);
  // complex scripts (Tamil) are set as ONE string so the shaper can reorder vowel signs, and are skipped entirely when
  // the device has no font for them - never draw missing-glyph boxes.
  if (lm.texts) for (let i = 0; i < lm.texts.length; i++) {
    const T = lm.texts[i]; if (T.group && skip.indexOf(T.group) !== -1) continue;
    const fam = T.script === 'tamil' ? KL_LM_FONT_TAMIL : KL_LM_FONT;
    if (T.script && !klCanRenderText(makeCanvas, T.text, (T.weight || '700'), fam)) continue;
    g.save(); g.font = (T.weight || '700') + ' ' + T.size + 'px ' + fam; g.textBaseline = 'middle'; g.fillStyle = T.color;
    if (T.glow) { g.shadowColor = T.glow; g.shadowBlur = 5 * bake; }
    if (T.script) { g.textAlign = 'center'; g.fillText(T.text, T.x, T.y); }
    else {
      g.textAlign = 'left';
      let tw = 0; for (let q = 0; q < T.text.length; q++) tw += g.measureText(T.text[q]).width + (q ? T.spacing : 0);
      let x = T.x - tw / 2; for (let q = 0; q < T.text.length; q++) { g.fillText(T.text[q], x, T.y); x += g.measureText(T.text[q]).width + T.spacing; }
    }
    g.restore();
  }

  // atmospheric haze: the bottom quarter melts into the horizon colour
  if (opts.haze) {
    g.save();
    g.globalCompositeOperation = 'source-atop';
    const grd = g.createLinearGradient(0, lm.h * 0.72, 0, lm.h);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, opts.haze);
    g.fillStyle = grd;
    g.fillRect(-pad / k, lm.h * 0.72, lm.w + 2 * pad / k, lm.h * 0.28 + pad / k);
    g.restore();
  }
  return { canvas: c, w: w, h: h, pad: pad };
}

function drawBaked(ctx, r, cx, baseY, alpha) {
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.drawImage(r.canvas, cx - r.w / 2 - r.pad, baseY - r.h - r.pad, r.w + 2 * r.pad, r.h + 2 * r.pad);
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------
   Zone table (data-driven). x values are fractions of the 360-wide view.

   hero   - { id, x, h } near-layer landmark, or null
   hideInTrio - trio member replaced by the hero in this zone
   ads    - may sponsor boards appear in this zone
   ------------------------------------------------------------ */
const KL_ZONES = [

  { key: 'brickfields',    name: 'LITTLE INDIA',    sky: ['#0b0716', '#1d1036', '#3a1c58'], trio: 0.9,  hero: { id: 'sentralTowers', x: 0.655, h: 118, lift: 0 }, hideInTrio: 'exchange106', gate: 'littleIndiaGate', ads: true },

    extras: [{ id: 'ilhamTower', x: 0.74, h: 100, a: 0.95, skip: ['hatch', 'neighbour'] }], ads: false },
  /* silent zone: scenery only, like the Ilham stretch. Jalan Ampang east of KLCC; the mall simply passes by. */
  { key: 'ampang',         name: '',                silent: true, sky: ['#060914', '#101a2c', '#22304a'], trio: 1.0,  hero: { id: 'greatEasternMall', x: 0.5, h: 140, lift: 6 }, foreground: 'ampang', nextGateFade: { start: 90, full: 40 }, ads: false },
  { key: 'batuCaves',      name: 'BATU CAVES',      sky: ['#050b0c', '#0e1f1c', '#173a2e'], trio: 0.0,  hero: { id: 'batuCaves', x: 0.5, h: 165, lift: 8 }, foreground: 'batu', ads: false }
];

/* persistent far skyline: drawn ONCE (never tiled), order = back to front */
const KL_TRIO = [
  { id: 'exchange106', x: 0.655, h: 70,  a: 0.75 },
  { id: 'merdeka118',  x: 0.86,  h: 168, a: 0.92 },
  { id: 'klTower',     x: 0.15,  h: 96,  a: 0.92, onHill: 22 },
  { id: 'ilhamTower',  x: 0.515, h: 72,  a: 0.92, skip: ['podium', 'hatch', 'neighbour'] },                 // 274 m, just east of the twin towers
  { id: 'twinTowers',  x: 0.40,  h: 108, a: 0.97, skip: ['mall', 'mallSign'] }   // from afar the mall is hidden by the city
];

/* Build every baked canvas once at boot (and again on resize if the bake scale changes). */
function klHides(zone, id) { const h = zone.hideInTrio; return !!h && (h === id || (h.indexOf && typeof h !== 'string' && h.indexOf(id) !== -1)); }
function buildKLSkyline(makeCanvas, bake, skyScale, opts) {
  const k = skyScale || 1;
  opts = opts || {};
  const out = { trio: {}, hero: {}, hill: null, gate: null, k: k };
  KL_TRIO.forEach(function (t) { out.trio[t.id] = bakeLandmark(t.id, t.h * k, { bake: bake, skipGroups: t.skip }, makeCanvas); });
  out.hill = bakeLandmark('hill', 22 * k, { bake: bake }, makeCanvas);
  out.extra = {};
  KL_ZONES.forEach(function (z) {
    if (z.hero) out.hero[z.key] = bakeLandmark(z.hero.id, z.hero.h * k, { bake: bake, skipGroups: opts.skipGroups }, makeCanvas);
    if (z.extras) out.extra[z.key] = z.extras.map(function (e) { return bakeLandmark(e.id, e.h * k, { bake: bake, skipGroups: e.skip }, makeCanvas); });
  });
  out.palm = bakeLandmark('royalPalm', 31 * k, { bake: bake }, makeCanvas);
  out.tree = bakeLandmark('parkTree', 26 * k, { bake: bake }, makeCanvas);
  out.gate = bakeLandmark('petalingGate', 260, { bake: bake }, makeCanvas);
  out.gates = { petalingGate: out.gate, kasturiGate: bakeLandmark('kasturiGate', 250, { bake: bake }, makeCanvas), littleIndiaGate: bakeLandmark('littleIndiaGate', 190, { bake: bake, skipGroups: opts.skipGroups }, makeCanvas) };   // use KL_LANDMARKS[id].gateWLanes for the world width   // world objects below are baked once at a reference size
  out.rail = {
    train: bakeLandmark('monorailTrain', 56, { bake: bake }, makeCanvas),
    trainSky: bakeLandmark('monorailTrain', 9 * k, { bake: bake, glowScale: 0.5 }, makeCanvas),
    station: bakeLandmark('monorailStation', 130, { bake: bake }, makeCanvas),
    pier: bakeLandmark('monorailPier', 170, { bake: bake }, makeCanvas)
  };
  return out;
}

/* Draw sky + far filler + trio + hero for one zone. horizonY = screen y of the road's far end.
   drift = small lateral offset in px (e.g. sin(distance * 0.0006) * 10) so the skyline is not dead static. */
function drawKLSkyline(ctx, baked, zone, horizonY, drift, alpha, t) {
  const a = alpha === undefined ? 1 : alpha;
  if (zone.trio > 0) {
    for (let i = 0; i < KL_TRIO.length; i++) {
      const t = KL_TRIO[i];
      if (klHides(zone, t.id)) continue;
      const cx = 360 * t.x + drift * 0.5;
      let base = horizonY;
      if (t.onHill) { drawBaked(ctx, baked.hill, cx, horizonY, a * zone.trio); base = horizonY - t.onHill * baked.k * KL_LANDMARKS.hill.crestFrac; }
      drawBaked(ctx, baked.trio[t.id], cx, base, a * zone.trio * t.a);
    }
  }
  klDrawExtras(ctx, baked, zone, horizonY, drift, a);
  if (zone.hero) drawBaked(ctx, baked.hero[zone.key], 360 * zone.hero.x + drift, horizonY - (zone.hero.lift || 0) * baked.k, a);
  drawZoneForeground(ctx, baked, zone, horizonY, drift, a, t || 0);
}

/* Zone-to-zone transition WITHOUT the washed-out middle.
   The trio is the same artwork in every zone, so it is never crossfaded - only its alpha is interpolated.
   Heroes hand over in sequence: old hero fades out during the first half, new hero fades in during the second.
   A trio member that a hero replaces (hideInTrio) fades opposite to that hero.
   blend: 0 = fully prevZone, 1 = fully curZone. */
function drawKLSkylineBlend(ctx, baked, prevZone, curZone, blend, horizonY, drift, t) {
  const outA = 1 - Math.min(1, blend * 2);          // old hero alpha
  const inA = Math.max(0, blend * 2 - 1);           // new hero alpha
  const trioA = prevZone.trio + (curZone.trio - prevZone.trio) * blend;
  if (trioA > 0.01) {
    for (let i = 0; i < KL_TRIO.length; i++) {
      const t = KL_TRIO[i];
      let m = 1;
      if (klHides(prevZone, t.id)) m = Math.min(m, 1 - outA);
      if (klHides(curZone, t.id)) m = Math.min(m, 1 - inA);
      if (m <= 0.01) continue;
      const cx = 360 * t.x + drift * 0.5;
      let base = horizonY;
      if (t.onHill) { drawBaked(ctx, baked.hill, cx, horizonY, trioA * m); base = horizonY - t.onHill * baked.k * KL_LANDMARKS.hill.crestFrac; }
      drawBaked(ctx, baked.trio[t.id], cx, base, trioA * t.a * m);
    }
  }
  if (prevZone.hero && prevZone !== curZone && outA > 0.01) {
    klDrawExtras(ctx, baked, prevZone, horizonY, drift, outA);
    drawBaked(ctx, baked.hero[prevZone.key], 360 * prevZone.hero.x + drift, horizonY - (prevZone.hero.lift || 0) * baked.k, outA);
    drawZoneForeground(ctx, baked, prevZone, horizonY, drift, outA, t || 0);
  }
  if (curZone.hero) {
    const ca = prevZone === curZone ? 1 : inA;
    klDrawExtras(ctx, baked, curZone, horizonY, drift, ca);
    drawBaked(ctx, baked.hero[curZone.key], 360 * curZone.hero.x + drift, horizonY - (curZone.hero.lift || 0) * baked.k, ca);
    if (ca > 0.01) drawZoneForeground(ctx, baked, curZone, horizonY, drift, ca, t || 0);
  }
}

/* ============================================================
   MONORAIL
   Two depictions, both side-on (the recognisable view):
   1. drawSkyRail      - thin elevated line with a small train sliding in front of the skyline (zones with skyRail: true)
   2. drawMonorailViaduct - a world object the road passes UNDER: full-width beam, piers beside the road,
                            train sliding across, optional station box with the zone name.
   All motion is time-based (pass runTime). Nothing here touches the gameplay RNG.
   ============================================================ */
const KL_MONORAIL = {
  BEAM_H: 2.3,        // lane units, road surface to beam underside
  BEAM_D: 0.30,       // beam depth, lane units
  TRAIN_LEN: 8,       // lane units
  TRAIN_SPEED: 1.3,   // lane units per second along the beam
  TRACK_SPAN: 26,     // lane units the train travels before wrapping
  STATION_W: 5.2,     // lane units
  PIER_X: [2.2, 4.7, 7.2, 9.7]   // lateral pier positions, lane units, mirrored left and right
};

function drawBakedScaled(ctx, r, cx, baseY, targetH, alpha) {
  const f = targetH / r.h;
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.drawImage(r.canvas, cx - (r.w / 2 + r.pad) * f, baseY - (r.h + r.pad) * f, (r.w + 2 * r.pad) * f, (r.h + 2 * r.pad) * f);
  ctx.globalAlpha = 1;
}

/* cx, baseY = screen position of the road centre at the viaduct's depth; lanePx = LANE_W * sOf(z).
   opts: { station: bool, name: string, dir: 1|-1, phase: number, alpha: number } */
function drawMonorailViaduct(ctx, baked, cx, baseY, lanePx, t, opts) {
  opts = opts || {};
  const M = KL_MONORAIL, a = opts.alpha === undefined ? 1 : opts.alpha;
  const beamBot = baseY - M.BEAM_H * lanePx, beamD = Math.max(1.5, M.BEAM_D * lanePx), beamTop = beamBot - beamD;
  ctx.globalAlpha = a;
  // piers (skip any that are fully off screen)
  for (let i = 0; i < M.PIER_X.length; i++) for (let sgn = -1; sgn <= 1; sgn += 2) {
    const px = cx + sgn * M.PIER_X[i] * lanePx;
    if (px < -40 || px > 400) continue;
    drawBakedScaled(ctx, baked.rail.pier, px, baseY, (M.BEAM_H + 0.02) * lanePx, a);
  }
  // beam: always spans the whole view so its ends are never visible
  ctx.globalAlpha = a;
  ctx.fillStyle = '#5d6675'; ctx.fillRect(0, beamTop, 360, beamD);
  ctx.fillStyle = '#3b4250'; ctx.fillRect(0, beamTop + beamD * 0.62, 360, beamD * 0.38);
  ctx.fillStyle = '#8a93a6'; ctx.fillRect(0, beamTop, 360, Math.max(0.6, beamD * 0.12));
  // train
  const tr = baked.rail.train, lm = KL_LANDMARKS.monorailTrain;
  const lenPx = M.TRAIN_LEN * lanePx, hPx = lenPx * lm.h / lm.w;
  const dir = opts.dir || 1;
  const u = (((t * M.TRAIN_SPEED + (opts.phase || 0)) % M.TRACK_SPAN) + M.TRACK_SPAN) % M.TRACK_SPAN - M.TRACK_SPAN / 2;
  const tx = cx + dir * u * lanePx;
  if (tx + lenPx / 2 > -20 && tx - lenPx / 2 < 380) {
    const sink = hPx * lm.beamTopFromBottom / lm.h;        // the skirt hangs over the beam
    if (dir < 0) { ctx.save(); ctx.translate(tx, 0); ctx.scale(-1, 1); drawBakedScaled(ctx, tr, 0, beamTop + sink, hPx, a); ctx.restore(); }
    else drawBakedScaled(ctx, tr, tx, beamTop + sink, hPx, a);
  }
  // station with the zone name
  if (opts.station) {
    const st = baked.rail.station, sl = KL_LANDMARKS.monorailStation;
    const wPx = M.STATION_W * lanePx, shPx = wPx * sl.h / sl.w, k = shPx / sl.h, tb = sl.textBox;
    drawBakedScaled(ctx, st, cx, beamTop, shPx, a);
    if (opts.name && tb.h * k > 5) {
      ctx.globalAlpha = a; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + (tb.h * k * 0.6).toFixed(1) + 'px system-ui, sans-serif';
      ctx.fillText(opts.name, cx + (tb.x + tb.w / 2 - sl.w / 2) * k, beamTop - (sl.h - tb.y - tb.h / 2) * k);
    }
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

/* Far depiction, drawn after the trio and before the horizon haze. k = skyScale, scrollPx = distance * rate. */
function drawSkyRail(ctx, baked, horizonY, k, t, scrollPx, alpha) {
  const a = alpha === undefined ? 1 : alpha;
  if (a <= 0.01) return;
  const yTop = horizonY - 19 * k, d = 2.4 * k, gap = 46 * k;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#2b3347';
  const off = ((scrollPx % gap) + gap) % gap;
  for (let x = -off; x < 360; x += gap) ctx.fillRect(x - 0.9 * k, yTop + d, 1.8 * k, horizonY - yTop - d);
  ctx.fillStyle = '#3a445c'; ctx.fillRect(0, yTop, 360, d);
  ctx.fillStyle = '#56627e'; ctx.fillRect(0, yTop, 360, Math.max(0.5, d * 0.25));
  const tr = baked.rail.trainSky, lm = KL_LANDMARKS.monorailTrain, span = 360 + tr.w + 80;
  const x = ((t * 11 * k) % span) - tr.w / 2 - 40;
  drawBaked(ctx, tr, x, yTop + tr.h * lm.beamTopFromBottom / lm.h, a);
  ctx.globalAlpha = 1;
}

/* ============================================================
   DATARAN MERDEKA FOREGROUND
   The street that runs along the facade (a cross street at the horizon - the game road meets it as a T-junction),
   a pavement, a row of royal palms in front of the building and a few street lamps.
   The hero is lifted by zone.hero.lift so it stands behind this strip. Spans the full view width.
   ============================================================ */
function drawDataranForeground(ctx, baked, horizonY, drift, alpha) {
  const k = baked.k, a = alpha === undefined ? 1 : alpha;
  const roadH = 7 * k, paveH = 2 * k, top = horizonY - roadH - paveH;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#4a4f5c'; ctx.fillRect(0, top, 360, paveH);                       // pavement
  ctx.fillStyle = '#1b2029'; ctx.fillRect(0, top + paveH, 360, roadH);                // asphalt
  ctx.fillStyle = '#6d7484'; ctx.fillRect(0, top + paveH, 360, Math.max(0.5, 0.5 * k)); // far kerb
  ctx.fillStyle = '#a9b1c2';
  const dash = 7 * k, gap = 9 * k, y = top + paveH + roadH * 0.5;
  for (let x = ((drift % (dash + gap)) - (dash + gap)); x < 360; x += dash + gap) ctx.fillRect(x, y, dash, Math.max(0.6, 0.7 * k));
  // street lamps (behind the palms)
  const lampH = 17 * k;
  for (let i = 0; i < 6; i++) {
    const x = 22 + i * 63.2 + drift;                                                  // 22, 85, 148, 212, 275, 338 - none on the road axis
    ctx.globalAlpha = a; ctx.fillStyle = '#2a2f3a'; ctx.fillRect(x - 0.5 * k, top - lampH, 1 * k, lampH);
    ctx.globalAlpha = a * 0.14; ctx.fillStyle = '#ffd08a'; ctx.beginPath(); ctx.arc(x, top - lampH, 2.8 * k, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = a; ctx.fillStyle = '#fff1cf'; ctx.beginPath(); ctx.arc(x, top - lampH, 1.2 * k, 0, 6.2832); ctx.fill();
  }
  // palms: evenly spaced, none in front of the porch / road axis
  const step = 25 * k, clear = 24 * k;
  let n = 0;
  for (let x = 10 * k; x < 360; x += step, n++) {
    const px = x + drift;
    if (Math.abs(px - 180 - drift) < clear) continue;
    const f = (n % 3 === 1) ? 0.86 : 1;                                               // slight height variety, deterministic
    drawBakedScaled(ctx, baked.palm, px, top + paveH * 0.5, baked.palm.h * f, a);
  }
  ctx.globalAlpha = 1;
}

/* secondary landmarks of a zone (zone.extras), drawn behind the hero with the hero's alpha */
function klDrawExtras(ctx, baked, zone, horizonY, drift, alpha) {
  if (!zone.extras || !baked.extra || !baked.extra[zone.key] || alpha <= 0.01) return;
  for (let i = 0; i < zone.extras.length; i++) { const e = zone.extras[i]; drawBaked(ctx, baked.extra[zone.key][i], 360 * e.x + drift * 0.8, horizonY - (e.lift || 0) * baked.k, alpha * (e.a === undefined ? 1 : e.a)); }
}

/* foreground dispatch - called by drawKLSkyline / drawKLSkylineBlend, t = runTime in seconds */
function drawZoneForeground(ctx, baked, zone, horizonY, drift, alpha, t) {
  if (zone.foreground === 'dataran') drawDataranForeground(ctx, baked, horizonY, drift, alpha);
  else if (zone.foreground === 'klcc') drawKLCCForeground(ctx, baked, horizonY, drift, alpha, t);
  else if (zone.foreground === 'batu') drawBatuForeground(ctx, baked, horizonY, drift, alpha);
  else if (zone.foreground === 'pasar') drawPasarForeground(ctx, baked, horizonY, drift, alpha);
  else if (zone.foreground === 'ilham') drawIlhamForeground(ctx, baked, horizonY, drift, alpha, t);
  else if (zone.foreground === 'ampang') drawAmpangForeground(ctx, baked, horizonY, drift, alpha);
}

/* ============================================================
   KLCC FOREGROUND (park side)
   Park ground, the lake in front of the mall with animated fountain jets and coloured underlighting,
   park trees framing both sides, low shrubs and path lights. Full view width. The hero is lifted by
   zone.hero.lift so the mall stands behind the lake. Animation is time-based only.
   ============================================================ */
const KLCC_JET_COLORS = ['#ff5fd2', '#6fb4ff', '#b07bff', '#5ff0e0'];
function drawKLCCForeground(ctx, baked, horizonY, drift, alpha, t) {
  const k = baked.k, a = alpha === undefined ? 1 : alpha, cx = 180 + drift;
  const bandH = 10 * k, top = horizonY - bandH;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#0c1d15'; ctx.fillRect(0, top, 360, bandH);                                   // park ground
  ctx.fillStyle = '#16301f'; ctx.fillRect(0, top, 360, Math.max(0.6, 0.8 * k));                 // far lawn edge
  // lake
  const ly = top + 4.6 * k, rx = 74 * k, ry = 3.4 * k;
  ctx.fillStyle = '#0d2238'; ctx.beginPath(); ctx.ellipse(cx, ly, rx, ry, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#1b3f63'; ctx.beginPath(); ctx.ellipse(cx, ly - 0.5 * k, rx * 0.93, ry * 0.62, 0, 0, 6.2832); ctx.fill();
  // fountain jets: a symmetric fan, tallest in the middle, heights breathe with time
  const N = 15;
  for (let i = 0; i < N; i++) {
    const u = (i - (N - 1) / 2) / ((N - 1) / 2);                                                // -1 .. 1
    const env = 1 - u * u * 0.72;
    const h = (5 + 16 * env * (0.55 + 0.45 * Math.sin(t * 1.7 + i * 0.9))) * k;               // centre jets reach about mall height
    const x = cx + u * rx * 0.78, col = KLCC_JET_COLORS[i % KLCC_JET_COLORS.length];
    ctx.globalAlpha = a * 0.30; ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, ly, 3.2 * k, 1.3 * k, 0, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = a * 0.5; ctx.fillStyle = col; ctx.fillRect(x - 1.1 * k, ly - h * 0.6, 2.2 * k, h * 0.6);
    ctx.globalAlpha = a * 0.92; ctx.fillStyle = '#f2f8ff'; ctx.fillRect(x - 0.55 * k, ly - h, 1.1 * k, h);
  }
  // park trees on both sides (deterministic layout), none in front of the lake centre
  const xs = [4, 21, 39, 55, 73, 90], fs = [1.0, 0.8, 1.1, 0.85, 1.0, 0.75];
  for (let i = 0; i < xs.length; i++) for (let sgn = -1; sgn <= 1; sgn += 2) {
    const px = cx + sgn * (180 - xs[i]) * 1.0;
    drawBakedScaled(ctx, baked.tree, px, horizonY - (i % 2) * 1.5 * k, baked.tree.h * fs[i], a);
  }
  // low shrubs + path lights in the middle
  ctx.globalAlpha = a; ctx.fillStyle = '#123121';
  for (let i = -5; i <= 5; i++) { ctx.beginPath(); ctx.ellipse(cx + i * 15 * k, horizonY - 0.6 * k, 6.5 * k, 2.1 * k, 0, 0, 6.2832); ctx.fill(); }
  ctx.fillStyle = '#ffe2a0';
  for (let i = -4; i <= 4; i++) { if (i === 0) continue; ctx.globalAlpha = a * 0.9; ctx.beginPath(); ctx.arc(cx + i * 19 * k, horizonY - 2.6 * k, 0.8 * k, 0, 6.2832); ctx.fill(); }
  ctx.globalAlpha = 1;
}

/* ============================================================
   BATU CAVES FOREGROUND
   Brick plaza in front of the hill, two tall floodlight masts and a few palms at the sides.
   Nothing stands in front of the stairs or the statue. No signs, no boards, no text.
   ============================================================ */
function drawBatuForeground(ctx, baked, horizonY, drift, alpha) {
  const k = baked.k, a = alpha === undefined ? 1 : alpha, cx = 180 + drift;
  const bandH = 8 * k, top = horizonY - bandH;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#3b2622'; ctx.fillRect(0, top, 360, bandH);                                  // brick plaza
  ctx.fillStyle = '#54362f'; ctx.fillRect(0, top, 360, Math.max(0.6, 0.9 * k));
  ctx.fillStyle = '#2c1c19';
  for (let y = top + 2.4 * k; y < horizonY; y += 2.4 * k) ctx.fillRect(0, y, 360, Math.max(0.4, 0.35 * k));   // paving courses
  // floodlight masts (left and right of the stairs / statue group)
  const mastH = 46 * k;
  for (let sgn = -1; sgn <= 1; sgn += 2) {
    const x = cx + sgn * 62 * k;
    ctx.globalAlpha = a; ctx.fillStyle = '#39404d'; ctx.fillRect(x - 0.6 * k, top - mastH, 1.2 * k, mastH);
    ctx.fillRect(x - 3.2 * k, top - mastH, 6.4 * k, 1.1 * k);
    ctx.globalAlpha = a * 0.16; ctx.fillStyle = '#fff1cf'; ctx.beginPath(); ctx.arc(x, top - mastH, 5 * k, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = a; ctx.fillStyle = '#fff6dc';
    for (let j = -1; j <= 1; j++) { ctx.beginPath(); ctx.arc(x + j * 2.3 * k, top - mastH + 0.2 * k, 0.95 * k, 0, 6.2832); ctx.fill(); }
  }
  // palms at the sides only
  const xs = [-164, -128, 118, 156], fs = [1.0, 0.85, 0.9, 1.05];
  for (let i = 0; i < xs.length; i++) drawBakedScaled(ctx, baked.palm, cx + xs[i] * k, top + bandH * 0.45, baked.palm.h * fs[i], a);
  ctx.globalAlpha = 1;
}

/* ============================================================
   PASAR SENI FOREGROUND
   Red-brick forecourt in front of the market hall, palms at the far sides. Nothing in front of the portal.
   ============================================================ */
function drawPasarForeground(ctx, baked, horizonY, drift, alpha) {
  const k = baked.k, a = alpha === undefined ? 1 : alpha, cx = 180 + drift;
  const bandH = 8 * k, top = horizonY - bandH;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#4a2c26'; ctx.fillRect(0, top, 360, bandH);
  ctx.fillStyle = '#5e3a31'; ctx.fillRect(0, top, 360, Math.max(0.6, 0.9 * k));
  ctx.fillStyle = '#3a221d';
  for (let y = top + 2.2 * k; y < horizonY; y += 2.2 * k) ctx.fillRect(0, y, 360, Math.max(0.4, 0.35 * k));
  ctx.fillStyle = '#3b3f48'; ctx.fillRect(cx - 34 * k, top + 2 * k, 68 * k, bandH - 2 * k);           // darker paved apron on the road axis
  const xs = [-166, -140, 140, 166], fs = [0.95, 0.8, 0.8, 0.95];
  for (let i = 0; i < xs.length; i++) drawBakedScaled(ctx, baked.palm, cx + xs[i] * k, top + bandH * 0.4, baked.palm.h * fs[i], a);
  ctx.globalAlpha = 1;
}

/* ============================================================
   SILENT TOWER ZONE FOREGROUND
   Granite forecourt with a long dark reflecting pool that mirrors the lit frame (a few shimmering streaks), low lit
   bollards, clipped hedges and rain trees at the far sides. Nothing stands in front of the tower.
   ============================================================ */
function drawIlhamForeground(ctx, baked, horizonY, drift, alpha, t) {
  const k = baked.k, a = alpha === undefined ? 1 : alpha, cx = 180 + drift, bandH = 8 * k, top = horizonY - bandH;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#2a2f3a'; ctx.fillRect(0, top, 360, bandH);
  ctx.fillStyle = '#3d4452'; ctx.fillRect(0, top, 360, Math.max(0.6, 0.8 * k));
  ctx.fillStyle = '#070b14'; ctx.fillRect(cx - 62 * k, top + 2.4 * k, 124 * k, 4.2 * k);                 // reflecting pool
  for (let i = 0; i < 7; i++) {                                                                          // reflection streaks of the frame, shimmering
    const w = (10 + 7 * Math.sin((t || 0) * 1.3 + i * 2.1)) * k;
    ctx.globalAlpha = a * (0.35 + 0.25 * Math.sin((t || 0) * 2.1 + i)); ctx.fillStyle = i === 3 ? '#ffe2a8' : '#f4f1e8';
    ctx.fillRect(cx - 40 * k + i * 13 * k - w / 2, top + (2.9 + (i % 3) * 1.1) * k, w, Math.max(0.5, 0.5 * k));
  }
  ctx.globalAlpha = a; ctx.fillStyle = '#16301f';
  for (let sgn = -1; sgn <= 1; sgn += 2) ctx.fillRect(cx + sgn * 118 * k - 34 * k, top - 2.2 * k, 68 * k, 2.6 * k);   // hedges
  ctx.fillStyle = '#fff1cf'; for (let i = -5; i <= 5; i++) { if (Math.abs(i) < 1) continue; ctx.fillRect(cx + i * 15 * k - 0.5 * k, top + 0.2 * k, 1 * k, 1.6 * k); }   // bollard lights
  const xs = [-168, -140, 140, 168], fs = [1.0, 0.82, 0.82, 1.0];
  for (let i = 0; i < xs.length; i++) drawBakedScaled(ctx, baked.tree, cx + xs[i] * k, top + bandH * 0.3, baked.tree.h * fs[i], a);
  ctx.globalAlpha = 1;
}

/* ============================================================
   SILENT MALL ZONE FOREGROUND (Jalan Ampang)
   Pale paved forecourt with a planted verge and a row of kerb lights, a row of royal palms in front of the glass
   drum's lowest floors (right of the axis, as in the street view) and rain trees under the tower on the left.
   Heights are tuned against the hero's baked geometry (h 140, lift 6) so palm crowns stay at/below the ledge
   between the drum's two lowest lit floors - never the ribbons or rim above - and the trees stay well clear of
   the podium's lit yellow panel (screen x roughly cx-20 to cx+10).
   ============================================================ */
const AMPANG_PALM_X = [26, 44, 63, 82, 100];
const AMPANG_PALM_F = [0.68, 0.80, 0.90, 0.80, 0.68];
const AMPANG_TREE_X = [-108, -84, -60];
const AMPANG_TREE_F = [0.82, 1.0, 0.90];
function drawAmpangForeground(ctx, baked, horizonY, drift, alpha) {
  const k = baked.k, a = alpha === undefined ? 1 : alpha, cx = 180 + drift, bandH = 7 * k, top = horizonY - bandH;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#34383f'; ctx.fillRect(0, top, 360, bandH);                                            // forecourt paving
  ctx.fillStyle = '#4a4f58'; ctx.fillRect(0, top, 360, Math.max(0.6, 0.8 * k));                            // far paving highlight
  ctx.fillStyle = '#16301f'; ctx.fillRect(0, horizonY - 2 * k, 360, 2 * k);                                // planted verge before the road
  ctx.fillStyle = '#fff1cf';
  for (let i = -6; i <= 6; i++) { if (i === 0) continue; ctx.fillRect(cx + i * 14 * k - 0.4 * k, top + 0.3 * k, 0.8 * k, 1.2 * k); }   // kerb lights, none on the road axis
  for (let i = 0; i < AMPANG_PALM_X.length; i++) drawBakedScaled(ctx, baked.palm, cx + AMPANG_PALM_X[i] * k, top + bandH * 0.5, baked.palm.h * AMPANG_PALM_F[i], a);
  for (let i = 0; i < AMPANG_TREE_X.length; i++) drawBakedScaled(ctx, baked.tree, cx + AMPANG_TREE_X[i] * k, top + bandH * 0.3, baked.tree.h * AMPANG_TREE_F[i], a);
  ctx.globalAlpha = 1;
}

<script>
/* ============================================================
   KL STREET PACK v2 - per-district streets for the roadside
   Everything beside the road is drawn from projected geometry that matches the game's camera:
     - facades are planes PARALLEL to the road; every facade element is one projected quad / polygon
     - roofs, canopies and hedge tops are horizontal planes at a height
     - things that really face the driver (blade signs, lamp posts, palms, bollards) are upright billboards
   Each district has its own buildings, pavement, kerb, road-edge lines, lamps and street furniture (KL_DISTRICTS).
   No textures on walls, no closures or allocations in the draw loops. Blade-sign canvases are baked once.
   P = { K, LANE_W, HORIZON_Y, PLAYER_Y, Z_FAR, Z_NEAR }   (same meaning as in the game)
   Needs from the landmark pack: drawBakedScaled(). Sprites (palm, tree) are passed in through `assets`.
   ============================================================ */
const KL_STREET = {
  WALL_X: 2.9,            // lane units, road centre to facade plane
  PAVE_IN: 1.63,          // lane units, inner pavement edge (outer kerb edge)
  KERB_IN: 1.5, KERB_LEN: 8,
  BLDG_LEN: 18,           // metres per building (three shop lots)
  ROOF_D: 7,              // lane units, roofs run off screen
  GROUND_OUT: 14,         // lane units, ground plane runs off screen
  CHUNK: 24,              // metres, base strips are drawn in chunks so districts can change along the road
  SLOT: 2,                // metres, street-furniture grid
  ZONE_LEN: 400,          // metres - MUST equal the game's CONFIG.ZONE_DIST (used for the once-per-district boards)
  BOARD_EVERY: 27,        // furniture slots between hanging boards on one side (54 m)
  LOD_NEAR: 55, LOD_MID: 95, LOD_FAR: 150
};

const KL_KERB_BW = ['#8f9299', '#15171c'], KL_KERB_STONE = ['#8b8478', '#746e63'];
const KL_DISTRICTS = {
  bukitBintang:   { wall: 'modern',   pave: '#3a3d46', ground: '#12141b', groundL: null, kerb: KL_KERB_BW,    edge: '#c9a21a', lamp: 'arm',      tree: 'palm', treeEvery: 10, treeX: 2.12, treeH: 1.7, blade: 'modern',   stalls: false, hedge: false, fence: false },
  petalingStreet: { wall: 'heritage', pave: '#423c36', ground: '#14110e', groundL: null, kerb: KL_KERB_BW,    edge: '#c9a21a', lamp: 'arm',      tree: null,   treeEvery: 0,  treeX: 0,    treeH: 0,   blade: 'heritage', stalls: true,  hedge: false, fence: false, onceBoards: 'kopitiamChinese' },
  pasarSeni:      { wall: 'kasturi',  pave: '#4a2f29', ground: '#15100e', groundL: null, kerb: KL_KERB_BW,    edge: null,      lamp: 'kasturi',  tree: 'palm', treeEvery: 13, treeX: 2.12, treeH: 1.45, blade: 'heritage', stalls: true,  hedge: false, fence: false, treeMaxZ: 150, stallCols: ['#f2b51e', '#e88a1a', '#f2b51e', '#f6f0e0'] },
  brickfields:    { wall: 'brickfields', pave: '#4a2f33', ground: '#140d1a', groundL: null, kerb: KL_KERB_BW, edge: '#c9a21a', lamp: 'spiral', lampX: 1.69, tree: null, treeEvery: 0, treeX: 0, treeH: 0, blade: 'indian', stalls: true, stallKind: 'flowers', hedge: false, fence: false,
                    arches: true, garlands: true, onceBoards: 'bananaLeafTamil', stallCols: ['#d6409f', '#f2b51e', '#7a3fb0', '#e8862a'] },

function buildKLStreetAssets(makeCanvas, bake) {
  const b = bake || 2, out = { blade: { heritage: [], modern: [], indian: [] }, flag: klsBakeFlagBanner(makeCanvas, b), board: { heritage: [], modern: [], indian: [], once: {} }, sign: klsBakeRoadSigns(makeCanvas, b) };
  KL_BOARDS.heritage.forEach(function (B) { out.board.heritage.push(klsBakeBoard(makeCanvas, b, B)); });
  KL_BOARDS.modern.forEach(function (B) { out.board.modern.push(klsBakeBoard(makeCanvas, b, B)); });
  KL_BOARDS.indian.forEach(function (B) { out.board.indian.push(klsBakeBoard(makeCanvas, b, B)); });
  out.pillar = klsBakePillars(makeCanvas, b); out.lampSpiral = klsBakeSpiralLamp(makeCanvas, b);
  for (const k in KL_BOARDS.once) out.board.once[k] = klsBakeBoard(makeCanvas, b, KL_BOARDS.once[k]);
  const W = 40, H = 132;
  for (const key in KL_BLADE_WORDS) {
    const list = KL_BLADE_WORDS[key];
    for (let i = 0; i < list.length; i++) {
      const c = makeCanvas(W * b, H * b), g = c.getContext('2d'); g.scale(b, b);
      const word = list[i][0].replace(' ', ''), bg = list[i][1], fg = list[i][2];
      g.fillStyle = '#0a0b0f'; g.fillRect(0, 0, W, H);
      g.fillStyle = bg; g.fillRect(2, 2, W - 4, H - 4);
      g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(2, 2, W - 4, 3);
      g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
      const n = word.length, ch = (H - 14) / n, fs = Math.min(ch * 0.92, W * 0.78);
      g.font = '900 ' + fs + 'px system-ui, sans-serif';
      for (let k = 0; k < n; k++) g.fillText(word[k], W / 2, 7 + ch * (k + 0.5) + 1);
      out.blade[key].push({ canvas: c, w: W, h: H });
    }
  }
  return out;
}

function loadPersisted() {
  try { const b = localStorage.getItem(K_BEST); if (b !== null) bestScore = Number(b) || 0; } catch (e) {}
  try { const m = localStorage.getItem(K_MUTE); if (m !== null) muted = m === '1'; } catch (e) {}

function saveMute() { try { localStorage.setItem(K_MUTE, muted ? '1' : '0'); } catch (e) {} }
function persistSession() {
  try {
    let arr = [];
    const raw = localStorage.getItem(K_SESS);
    if (raw) arr = JSON.parse(raw);
    if (!Array.isArray(arr)) arr = [];
    let idx = -1;
    for (let i = 0; i < arr.length; i++) { if (arr[i] && arr[i].sessionId === session.sessionId) { idx = i; break; } }
    const snapshot = JSON.parse(JSON.stringify(session));
    if (idx >= 0) arr[idx] = snapshot; else arr.push(snapshot);
    if (arr.length > 50) arr = arr.slice(arr.length - 50);
    localStorage.setItem(K_SESS, JSON.stringify(arr));
  } catch (e) {}
}
function sendRemoteLog() {
  if (!logUrl) return;
  try {
    const blob = new Blob([JSON.stringify(session)], { type: 'text/plain' });
    navigator.sendBeacon(logUrl, blob);
  } catch (e) {}
}

/* Landing skyline: [KL_LANDMARKS id, x, height in skyline units, alpha, skipGroups].
   Narrow screens spread it across the full width under the centred copy (x = fraction of width).
   Wide screens keep the copy column clear: x is a fraction of the side gutter, measured
   from the left edge (L) or the right edge (R); C sits centred below the copy. Order = back to front. */
const LANDING_SKYLINE_NARROW = [
  ['exchange106', 0.58, 70, 0.55], ['sentralTowers', 0.74, 64, 0.8], ['merdeka118', 0.88, 168, 0.8],
  ['hill', 0.10, 22, 1], ['klTower', 0.10, 96, 0.9],
  ['ilhamTower', 0.62, 90, 0.9, ['podium', 'hatch', 'neighbour']], ['twinTowers', 0.40, 150, 1],
  ['greatEasternMall', 0.66, 42, 1], ['sultanAbdulSamad', 0.19, 42, 1], ['batuCaves', 0.95, 44, 0.9]
];
const LANDING_SKYLINE_WIDE = [
  ['exchange106', 'R', 0.58, 70, 0.55], ['sentralTowers', 'R', 0.80, 64, 0.8], ['merdeka118', 'R', 0.36, 168, 0.8],
  ['hill', 'L', 0.14, 22, 1], ['klTower', 'L', 0.14, 96, 0.9],
  ['ilhamTower', 'L', 0.70, 90, 0.9, ['podium', 'hatch', 'neighbour']], ['twinTowers', 'L', 0.44, 150, 1],
  ['greatEasternMall', 'L', 0.84, 42, 1],
  ['sultanAbdulSamad', 'C', 0, 36, 1], ['batuCaves', 'R', 0.08, 60, 0.9]
];

/* Background art, drawn once (and again on resize) while the landing page is up:
   a quiet gradient, deterministic stars and, once the assets are baked, a night
   skyline of baked KL_LANDMARKS. Nothing here runs per frame. */
function renderLandingArt() {
  if (!landingVisible || !landingArt) return;
  const w = landingArt.clientWidth || window.innerWidth;
  const h = landingArt.clientHeight || window.innerHeight;
  const artDpr = Math.min(window.devicePixelRatio || 1, 2);
  landingArt.width = Math.round(w * artDpr);
  landingArt.height = Math.round(h * artDpr);
  const g = landingArt.getContext('2d');
  g.setTransform(artDpr, 0, 0, artDpr, 0, 0);

  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#070811');
  sky.addColorStop(0.68, '#090a14');
  sky.addColorStop(1, '#100b19');
  g.fillStyle = sky;
  g.fillRect(0, 0, w, h);

  // Deterministic stars: no gameplay RNG and no per-frame work.
  for (let i = 0; i < 36; i++) {
    const x = ((i * 83 + 37) % 557) / 557 * w;
    const y = ((i * 47 + 19) % 211) / 211 * h * 0.9;
    const a = 0.07 + (i % 4) * 0.035;
    g.fillStyle = 'rgba(210,225,255,' + a + ')';
    g.fillRect(x, y, 1, 1);
  }
  if (assetsReady) drawLandingSkyline(g, w, h, artDpr);
}

function drawLandingSkyline(g, w, h, bake) {
  const gutter = (w - Math.min(440, w - 40)) / 2;       // .landing-shell width
  const wide = w > 560 && gutter >= 280;
  const u = wide ? Math.min(h * 0.42, 300, gutter * 1.6) / 160 : Math.min(h * 0.30, 230) / 160;
  const base = h + 2;
  const glow = g.createLinearGradient(0, base - 170 * u, 0, base);
  glow.addColorStop(0, 'rgba(90,40,120,0)');
  glow.addColorStop(1, 'rgba(120,50,110,.35)');
  g.fillStyle = glow;
  g.fillRect(0, base - 170 * u, w, 170 * u);

  const items = wide ? LANDING_SKYLINE_WIDE : LANDING_SKYLINE_NARROW;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const o = wide ? 1 : 0;                              // wide rows carry an extra side column
    const x = !wide ? it[1] * w : it[1] === 'L' ? it[2] * gutter : it[1] === 'R' ? w - it[2] * gutter : w / 2;
    const skip = (it[4 + o] || []).slice();
    if (!CONFIG.BATU_STATUE) skip.push('statue');
    const r = bakeLandmark(it[0], it[2 + o] * u, { bake: bake, skipGroups: skip }, makeCanvas);
    const lift = it[0] === 'klTower' ? 22 * u * 0.8 : 0;   // stands on the hill
    g.globalAlpha = it[3 + o];
    g.drawImage(r.canvas, x - r.w / 2 - r.pad, base - lift - r.h - r.pad, r.w + 2 * r.pad, r.h + 2 * r.pad);
  }
  g.globalAlpha = 1;

  // Dark foot so the skyline settles into the page edge.
  const fade = g.createLinearGradient(0, base - 40 * u, 0, base);
  fade.addColorStop(0, 'rgba(9,11,20,0)');
  fade.addColorStop(1, 'rgba(9,11,20,.9)');
  g.fillStyle = fade;
  g.fillRect(0, base - 40 * u, w, 40 * u);
}

// v0.3 (R3): hoisted out of screenY so doResize can derive Z_NEAR from them.
// Values themselves are unchanged (VIEW_H*0.22 / VIEW_H-130).
let HORIZON_Y = 0, PLAYER_Y = 0;
// Derived near-clip plane, replacing the old hardcoded z = -8 everywhere.
// Recomputed on resize so the road/billboards always reach the bottom of
// the screen regardless of viewport height, instead of stopping short (or
// popping objects while still visible) the way a fixed constant did.
let Z_NEAR = -8;

// v0.3 (KL rework, 3.5): skyline bake state. skyScale keeps every pack
// landmark's on-screen size consistent with the horizon's actual position
// (varies by viewport); bakeFactor is the offscreen-canvas resolution
// multiplier. Both only trigger a rebake when they move more than 5% -
// baking five landmarks plus the trio isn't free, and doResize can fire
// repeatedly (orientation change, on-screen keyboard, etc).
let klBaked = null, klSkyScale = 1, klBakeFactor = 1;
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
// v0.4: district lookup for the street pack - a plain top-level function
// (not a per-frame closure), per the integration spec.
function districtAt(worldZ) { return zoneKeyFor(Math.floor(worldZ / CONFIG.ZONE_DIST)); }
// v0.4: camera params + reused stats object for kl-street.js. streetP is
// rebuilt in doResize (needs HORIZON_Y/PLAYER_Y/Z_NEAR, set at the end of
// that function); streetAssets is built once at boot, then has its
// palm/tree entries refreshed here whenever klBaked itself rebuilds.
let streetP = null;
let streetAssets = null;
const streetStats = { quads: 0, buildings: 0, blits: 0 };
function maybeRebuildKLSkyline() {
  const horizonY = screenY(CONFIG.Z_FAR);
  const skyScale = clamp((horizonY - 60) / 175, 0.8, 1.3);
  const bakeFactor = Math.min(lowResourceDevice ? 1 : 2, Math.ceil(scale * dpr));
  if (klBaked && Math.abs(skyScale - klSkyScale) / klSkyScale <= 0.05 && bakeFactor === klBakeFactor) return;
  klSkyScale = skyScale;
  klBakeFactor = bakeFactor;
  const landmarkSkips = [];
  if (!CONFIG.BATU_STATUE) landmarkSkips.push('statue');
  if (!CONFIG.LI_TAMIL) landmarkSkips.push('tamil');
  klBaked = buildKLSkyline(makeCanvas, bakeFactor, skyScale, { skipGroups: landmarkSkips });
  if (streetAssets) { streetAssets.palm = klBaked.palm; streetAssets.tree = klBaked.tree; }
}

// v0.4.4 (audit P1 #5): actual safe-area pixel values, read from the
// probe element's computed padding (env() resolves to 0 with no notch, so
// this is a no-op on ordinary phones/desktop).
function getSafeInsets() {
  const probe = document.getElementById('safeAreaProbe');
  if (!probe) return { top: 0, right: 0, bottom: 0, left: 0 };
  const cs = getComputedStyle(probe);
  return {
    top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0,
    bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0
  };
}

function doResize() {
  const insets = getSafeInsets();
  const w = window.innerWidth - insets.left - insets.right;
  const h = window.innerHeight - insets.top - insets.bottom;
  if (h / w >= 560 / 360) {
    scale = w / 360;
    VIEW_H = Math.min(800, h / scale);
  } else {
    VIEW_H = 640;
    scale = h / 640;
  }
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = (360 * scale) + 'px';
  canvas.style.height = (VIEW_H * scale) + 'px';
  canvas.width = Math.round(360 * scale * dpr);
  canvas.height = Math.round(VIEW_H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

  HORIZON_Y = VIEW_H * 0.22;
  PLAYER_Y = VIEW_H - 130;
  const sNeed = (VIEW_H + 60 - HORIZON_Y) / (PLAYER_Y - HORIZON_Y);
  let zNear = (1 / sNeed - 1) / CONFIG.PERSP_K;
  const asymptote = -1 / CONFIG.PERSP_K;
  if (zNear <= asymptote) zNear = asymptote + 1; // stay clear of the perspective singularity
  Z_NEAR = zNear;
  streetP = { K: CONFIG.PERSP_K, LANE_W: CONFIG.LANE_W, HORIZON_Y: HORIZON_Y, PLAYER_Y: PLAYER_Y, Z_FAR: CONFIG.Z_FAR, Z_NEAR: Z_NEAR };
  if (assetsReady) { maybeRebuildKLSkyline(); renderLandingArt(); }
}
window.addEventListener('resize', doResize);
window.addEventListener('orientationchange', doResize);
doResize();

function sOf(z) { return 1 / (1 + z * CONFIG.PERSP_K); }
function screenY(z) { return HORIZON_Y + (PLAYER_Y - HORIZON_Y) * sOf(z); }
function screenX(x, z) { return 180 + x * CONFIG.LANE_W * sOf(z); }
function widthPx(w, z) { return w * CONFIG.LANE_W * sOf(z); }

let swipeActive = false, swipeStartX = 0, swipeConsumed = false, swipePointerId = null;

const muteRect = { x: 360 - 44 - 8, y: 8, w: 44, h: 44 };
const debugCornerRect = { x: 0, y: 0, w: 44, h: 44 };
let debugTapTimes = [];
let debugOn = params.has('debug');
let debugCopyBtn = null;

function inRect(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }

function logicalPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function toggleMute() { muted = !muted; saveMute(); }

function registerDebugTap(nowMs) {
  debugTapTimes.push(nowMs);
  while (debugTapTimes.length && nowMs - debugTapTimes[0] > 2000) debugTapTimes.shift();
  if (debugTapTimes.length >= 5) { debugOn = !debugOn; debugTapTimes = []; }
}

function moveLane(dir) {
  const target = clamp(player.targetLane + dir, -1, 1);
  if (target === player.targetLane) return;
  player.tweenFrom = player.x;
  player.tweenStart = runTime;
  player.tweenTo = target;
  player.targetLane = target;
}
function applyTapInput(pos) {
  if (pos.x < 180) moveLane(-1); else moveLane(1);
}

function onPointerDown(e) {
  e.preventDefault();
  const pos = logicalPos(e);
  const nowMs = performance.now();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

  if (debugOn && debugCopyBtn && inRect(pos.x, pos.y, debugCopyBtn)) { copyStats(); return; }
  if (inRect(pos.x, pos.y, muteRect)) { toggleMute(); return; }
  if (inRect(pos.x, pos.y, debugCornerRect)) registerDebugTap(nowMs);
  if (!assetsReady) return;

  ensureAudio();

  if (state === 'READY') { beginRun(true); return; }
  if (state === 'PAUSED') { state = 'PLAYING'; lastFrameTs = null; accumulator = 0; return; }
  if (state === 'DEAD') {
    if (nowMs - lastDeathMs < 250) return;
    beginRun(false);
    // falls through: this same press also drives the new run's input
  }
  if (state === 'PLAYING') {
    if (CONFIG.INPUT_MODE === 'swipe') {
      swipeActive = true; swipeStartX = pos.x; swipeConsumed = false; swipePointerId = e.pointerId;
    } else {
      applyTapInput(pos);
    }
  }
}
function onPointerMove(e) {
  if (CONFIG.INPUT_MODE !== 'swipe' || !swipeActive || e.pointerId !== swipePointerId || swipeConsumed) return;
  const pos = logicalPos(e);
  const dx = pos.x - swipeStartX;
  if (Math.abs(dx) > 18) { moveLane(dx > 0 ? 1 : -1); swipeConsumed = true; }
}
function onPointerUp(e) {
  if (e.pointerId === swipePointerId) { swipeActive = false; swipePointerId = null; }
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
canvas.addEventListener('dblclick', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

window.addEventListener('keydown', function (e) {
  // The launch form owns keyboard input until the player explicitly starts.
  if (landingVisible) return;
  const nowMs = performance.now();
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (!assetsReady) return;
    ensureAudio();
    if (state === 'READY') { beginRun(true); return; }
    if (state === 'PAUSED') { state = 'PLAYING'; lastFrameTs = null; accumulator = 0; return; }
    if (state === 'DEAD') { if (nowMs - lastDeathMs < 250) return; beginRun(false); }
    return;
  }
  if (state !== 'PLAYING' || e.repeat) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); moveLane(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); moveLane(1); }
});

document.addEventListener('visibilitychange', function () {
  if (document.hidden && state === 'PLAYING') state = 'PAUSED';
});

/* ============================================================
   LEVEL GENERATION
   ============================================================ */
function layoutForType(type) {
  const i = Math.floor(rng() * 3);
  if (type === 'DOUBLE') {
    const openLane = LANES[i];
    const blocked = LANES.filter(function (l) { return l !== openLane; });
    return { blocked: blocked, open: [openLane] };
  }
  const blockedLane = LANES[i];
  const open = LANES.filter(function (l) { return l !== blockedLane; });
  return { blocked: [blockedLane], open: open };
}
function pickRowType(dist, k) {
  if (dist >= CONFIG.CUTTER_FROM_DIST && rng() < CONFIG.CUTTER_CHANCE) return 'CUTTER';
  if (dist >= CONFIG.DOUBLE_FROM_DIST) {
    const chance = lerp(CONFIG.DOUBLE_CHANCE_START, CONFIG.DOUBLE_CHANCE_END, k);
    if (rng() < chance) return 'DOUBLE';
  }
  return 'SINGLE';
}
function reachable(open, prevOpen) {
  for (let i = 0; i < open.length; i++) {
    for (let j = 0; j < prevOpen.length; j++) {
      if (Math.abs(open[i] - prevOpen[j]) <= 1) return true;
    }
  }
  return false;
}
function rollRow(dist, k, prevOpen) {
  for (let attempt = 0; attempt < 10; attempt++) {
    const type = pickRowType(dist, k);
    const layout = layoutForType(type);
    if (reachable(layout.open, prevOpen)) return { type: type, blocked: layout.blocked, open: layout.open };
  }
  for (let i = 0; i < LANES.length; i++) {
    const blockedLane = LANES[i];
    const open = LANES.filter(function (l) { return l !== blockedLane; });
    if (reachable(open, prevOpen)) return { type: 'SINGLE', blocked: [blockedLane], open: open };
  }
  return { type: 'SINGLE', blocked: [0], open: [-1, 1] };
}

function spawnObstacle(kind, lane, z, visual) {
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (!o.active) {
      o.active = true; o.kind = kind; o.visual = visual; o.lane = lane; o.x = lane; o.z = z; o.len = CONFIG.OBST_LEN;
      o.threat = false; o.minTTI = Infinity; o.nearMissCounted = false;
      o.phase = 'idle'; o.telegraphElapsed = 0; o.moveElapsed = 0; o.fromX = lane; o.toX = lane; o.targetLane = lane;
      return o;
    }
  }
  return null;
}
function spawnPickup(lane, z) {
  for (let i = 0; i < pickups.length; i++) {
    const p = pickups[i];
    if (!p.active) { p.active = true; p.lane = lane; p.x = lane; p.z = z; return p; }
  }
  return null;
}

// v0.4.3: minimum gap between roadworks-sign REQUESTS, tracked here on the
// game side regardless of side or kind. The pack's own 140m rule only
// dedupes the SAME side against itself - it has no way to know a sign is
// about to land next to a permanent sign or a blade sign on the OTHER
// side (that placement is the pack's own internal slot grid, which this
// game deliberately doesn't reach into). Spacing out our own requests
// further is the lever actually available here, and it directly cuts the
// "two signs in the same spot" and "one on each side at the same line"
// clutter reported from actual play.
let lastRoadworksReqDist = -1e9;

function spawnRow() {
  const rowZ = nextRowDist - distance;
  const result = rollRow(distance, curK, prevOpenLanes);
  prevOpenLanes = result.open;
  if (result.type === 'CUTTER') {
    spawnObstacle('cutter', result.blocked[0], rowZ, 'hatchback');
  } else {
    let hasRoadworksTrigger = false;
    for (let i = 0; i < result.blocked.length; i++) {
      let visual = STATIC_VISUALS[Math.floor(rng() * STATIC_VISUALS.length)];
      // v0.4.1: kapcai livery is picked deterministically from the
      // obstacle's fixed world position (kapcaiKeyFor), not the seeded
      // rng() - it's cosmetic only, so the level LAYOUT (lane, timing,
      // obstacle category) stays fully deterministic per seed; only the
      // paint job is resolved separately, and the same way on every device.
      if (visual === 'kapcai') visual = kapcaiKeyFor(distance + rowZ, result.blocked[i]);
      if (visual === 'barrier' || visual === 'coneRow') hasRoadworksTrigger = true;
      spawnObstacle('static', result.blocked[i], rowZ, visual);
    }
    // v0.4.2 (2.2): temporary roadworks signs tied to real barrier/coneRow
    // rows - picked with the existing non-gameplay hash (propHash), never
    // the seeded rng(), so this can't affect the obstacle sequence for a
    // given seed. The pack itself enforces the 140m minimum spacing and
    // reports back whether it actually placed the warning sign, which is
    // why "TAMAT" is only requested when that placement succeeded.
    if (hasRoadworksTrigger) {
      const wz = distance + rowZ;
      if (wz - lastRoadworksReqDist >= 160) {
        const side = result.blocked.some(function (l) { return l <= 0; }) ? -1 : 1;
        const kind = propHash(Math.floor(wz)) < 0.6 ? 'awas' : 'roadworks';
        const placed = klsAddRoadworksSign(wz - 45, side, kind, distance);
        if (placed) { klsAddRoadworksSign(wz + 25, side, 'tamat', distance); lastRoadworksReqDist = wz; }
      }
    }
  }
  if (CONFIG.PICKUPS && rng() < CONFIG.PICKUP_CHANCE) {
    const lane = LANES[Math.floor(rng() * 3)];
    const pz = rowZ + curSpeed * curRowGapT / 2;
    spawnPickup(lane, pz);
  }
}

function runSelfTest() {
  const savedRng = rng;
  rng = mulberry32(20260919);
  let prevOpen = [-1, 0, 1];
  let dist = 0, violations = 0;
  for (let i = 0; i < 5000; i++) {
    const k = clamp(dist / CONFIG.RAMP_TIME, 0, 1);
    const result = rollRow(dist, k, prevOpen);
    if (!reachable(result.open, prevOpen)) violations++;
    prevOpen = result.open;
    dist += 40 + (i % 30);
  }
  rng = savedRng;
  console.log('[selftest] rows=5000 fairness violations=' + violations);

  // v0.4: Banner Malaysia self-test - reads the baked banner's own pixels
  // back, so it's only ever called here, never per frame.
  if (streetAssets && streetAssets.flag) {
    const flagBad = klsFlagSelfTest(streetAssets.flag);
    console.log('[selftest] klsFlagSelfTest: ' + (flagBad.length === 0 ? 'OK (0 violations)' : JSON.stringify(flagBad)));
  }

  // v0.4.2 (2.4): whether this device actually has a font for the two
  // once-per-lap non-Latin boards - should be false on a normal phone.
  if (streetAssets && streetAssets.board && streetAssets.board.once) {
    const o = streetAssets.board.once;
    console.log('[selftest] kopitiamChinese.usedFallback=' + (o.kopitiamChinese && o.kopitiamChinese.usedFallback));
    console.log('[selftest] bananaLeafTamil.usedFallback=' + (o.bananaLeafTamil && o.bananaLeafTamil.usedFallback));
  }

  // v0.4.1: kapcai livery distribution - target 20/20/20/20/20 (percent)
  // for kapcai/kapcaiPlain/kapcaiJade/kapcaiMagenta/kapcaiMelon.
  const counts = {};
  const N = 2000;
  for (let i = 0; i < N; i++) {
    const key = kapcaiKeyFor(i * 7.3, (i % 3) - 1);
    counts[key] = (counts[key] || 0) + 1;
  }
  const shares = {};
  Object.keys(counts).forEach(function (k) { shares[k] = Math.round(counts[k] / N * 1000) / 10; });
  console.log('[selftest] kapcaiKeyFor shares (%) over ' + N + ': ' + JSON.stringify(shares));
}

/* ============================================================
   UPDATE
   ============================================================ */
function deactivateWorld() {
  for (let i = 0; i < obstacles.length; i++) obstacles[i].active = false;
  for (let i = 0; i < pickups.length; i++) pickups[i].active = false;
  for (let i = 0; i < gates.length; i++) gates[i].active = false;
  for (let i = 0; i < viaducts.length; i++) viaducts[i].active = false;
}

function beginRun(isFirst) {
  runCount += 1;
  const nowMs = performance.now();
  const retryLatencyMs = isFirst ? null : Math.round(nowMs - lastDeathMs);
  currentSeed = pickSeedForRun();
  rng = mulberry32(currentSeed);
  distance = 0; nextRowDist = 90; runTime = 0; bonusTotal = 0; combo = 0; timeSinceLastNearMiss = 0;
  zoneIndex = -1; lastAnnouncedZoneIndex = -1; prevZoneKey = 'neutral';
  bannerZoneName = ''; bannerStartMs = -1e9; zoneTransitionStartMs = -1e9;
  prevOpenLanes = [-1, 0, 1];
  player.x = 0; player.targetLane = 0; player.tweenFrom = 0; player.tweenTo = 0; player.tweenStart = 0;
  deactivateWorld();
  // v0.3 (KL rework, section 4): zone 0's boundary is at distance 0, already
  // "past" before any lookahead spawn could fire, so its gate is placed
  // directly here instead of through the normal boundary check below.
  // v0.4 (fix #6): z=60 put the station roof across the screen for the
  // opening ~2s of every run; z=120 lets the skyline read first, station
  // still clearly approaching.
  spawnGate(0, 120);
  nextGateZoneIndex = 1;
  nextViaductDist = CONFIG.ZONE_DIST * 0.5;
  klsResetRoadworksSigns();
  lastRoadworksReqDist = -1e9;
  currentRun = { n: runCount, seed: currentSeed, retryLatencyMs: retryLatencyMs };
  isNewBest = false;
  state = 'PLAYING';
  accumulator = 0;
  lastFrameTs = null;
}

function spawnPopup(x, y, text, color) {
  let slot = null;
  for (let i = 0; i < popups.length; i++) { if (!popups[i].active) { slot = popups[i]; break; } }
  if (!slot) { slot = popups[popupCursor]; popupCursor = (popupCursor + 1) % popups.length; }
  slot.active = true; slot.x = x; slot.y = y; slot.text = text; slot.color = color; slot.t = 0; slot.life = 0.6;
}

function awardNearMiss(minTTI) {
  const insane = minTTI <= CONFIG.NEAR_TTI_INSANE;
  const base = insane ? CONFIG.NEAR_BONUS * 2 : CONFIG.NEAR_BONUS;
  combo += 1;
  timeSinceLastNearMiss = 0;
  const awarded = base * combo;
  bonusTotal += awarded;
  const label = insane ? 'CLOSE!!' : 'CLOSE';
  const text = combo > 1 ? (label + ' x' + combo + ' +' + awarded) : (label + ' +' + awarded);
  spawnPopup(screenX(player.x, 0), screenY(0) - 30, text, '#3dff8b');
  flashAmp = 1; flashStartMs = performance.now();
  playBonusBlip(combo);
  if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
}
function collectPickup(p) {
  p.active = false;
  bonusTotal += CONFIG.PICKUP_VALUE;
  spawnPopup(screenX(player.x, 0), screenY(0) - 30, '+' + CONFIG.PICKUP_VALUE, '#3dff8b');
  flashAmp = 1; flashStartMs = performance.now();
  playBonusBlip(combo);
  if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
}

function triggerDeath(cause) {
  state = 'DEAD';
  lastDeathMs = performance.now();
  deathCause = cause;
  finalScore = Math.floor(distance) + bonusTotal;
  deathCauseCounts[cause] = (deathCauseCounts[cause] || 0) + 1;
  currentRun.durationS = Math.round(runTime * 100) / 100;
  currentRun.score = finalScore;
  currentRun.deathCause = cause;
  session.runs.push(Object.assign({}, currentRun));
  if (session.runs.length > 200) session.runs.shift();
  session.lastActivityAt = Date.now();
  runDurations.push(currentRun.durationS);
  if (currentRun.retryLatencyMs != null) retryLatencies.push(currentRun.retryLatencyMs);
  recomputeDebugStats();
  isNewBest = finalScore > bestScore;
  if (isNewBest) { bestScore = finalScore; saveBest(); }
  shakeAmp = 8; shakeStartMs = performance.now();
  playDeathSound();
  if (isNewBest) setTimeout(playNewBestSound, 260);
  if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
  persistSession();
  sendRemoteLog();
}

function updatePlayerTween() {
  if (player.x !== player.tweenTo) {
    const t = clamp((runTime - player.tweenStart) / CONFIG.LANE_CHANGE_T, 0, 1);
    const eased = 1 - (1 - t) * (1 - t);
    player.x = player.tweenFrom + (player.tweenTo - player.tweenFrom) * eased;
    if (t >= 1) player.x = player.tweenTo;
  }
}

function updateObstacles(dt) {
  let killedThisStep = false;
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (!o.active) continue;
    o.z -= curSpeed * dt;

    if (o.kind === 'cutter') {
      if (o.phase === 'idle') {
        // v0.3 (R9): time-to-impact trigger instead of a fixed distance, so
        // warning time stays constant as speed ramps up (previously it
        // halved from 1.9s to 0.97s right when rows also got densest).
        const triggerZ = curSpeed > 0 ? Math.min(curSpeed * CONFIG.CUTTER_TRIGGER_TTI, CONFIG.Z_SPAWN - 10) : CONFIG.Z_SPAWN - 10;
        if (o.z < triggerZ) {
          // Always consume the same two RNG draws regardless of player state,
          // so the rest of the level sequence stays deterministic for a given
          // seed even though this cutter's own target reacts to the player.
          const aimRoll = rng() < CONFIG.CUTTER_AIM;
          const adj = adjacentLanes(o.lane);
          const fallbackPick = adj[Math.floor(rng() * adj.length)];
          const target = (aimRoll && adj.indexOf(player.targetLane) !== -1) ? player.targetLane : fallbackPick;
          o.targetLane = target;
          o.phase = 'telegraph';
          o.telegraphElapsed = 0;
        }
      } else if (o.phase === 'telegraph') {
        o.telegraphElapsed += dt;
        if (o.telegraphElapsed >= CONFIG.CUTTER_TELEGRAPH) {
          o.phase = 'moving'; o.moveElapsed = 0; o.fromX = o.lane; o.toX = o.targetLane;
        }
      } else if (o.phase === 'moving') {
        o.moveElapsed += dt;
        const frac = Math.min(1, o.moveElapsed / CONFIG.CUTTER_MOVE_T);
        o.x = o.fromX + (o.toX - o.fromX) * frac;
        if (frac >= 1) { o.phase = 'done'; o.lane = o.targetLane; o.x = o.toX; }
      }
    }

    let hit = false;
    if (!killedThisStep) {
      const dx = Math.abs(player.x - o.x);
      hit = dx < 2 * CONFIG.HITBOX_X && o.z < CONFIG.CAR_LEN && (o.z + o.len) > 0;
      if (hit) {
        killedThisStep = true;
        triggerDeath(o.kind === 'cutter' ? 'cutter' : 'static');
      } else if (curSpeed > 0) {
        const tti = o.z / curSpeed;
        if (tti > 0 && tti <= CONFIG.NEAR_TTI && dx < 2 * CONFIG.HITBOX_X) {
          o.threat = true;
          if (tti < o.minTTI) o.minTTI = tti;
        }
      }
    }

    if (!hit && o.threat && !o.nearMissCounted && (o.z + o.len) < 0) {
      awardNearMiss(o.minTTI);
      o.nearMissCounted = true;
    }
    // v0.3 (R3): recycle on the derived near plane, then also check whether
    // the billboard's own top edge has scrolled below the screen - a tall
    // billboard can still have part of itself on screen even once its base
    // (o.z) has passed Z_NEAR, so the fixed -8 was recycling objects that
    // were, in the old flat-decal render, already invisible anyway, but
    // would pop under the new upright billboards without this check.
    if (o.z < Z_NEAR) {
      o.active = false;
    } else {
      const vk = o.kind === 'cutter' ? 'hatchback' : o.visual;
      if (billboardTopY(o.z, vk) > VIEW_H) o.active = false;
    }
    if (killedThisStep) break;
  }
  return killedThisStep;
}

function updatePickups(dt) {
  for (let i = 0; i < pickups.length; i++) {
    const p = pickups[i];
    if (!p.active) continue;
    p.z -= curSpeed * dt;
    if (Math.abs(player.x - p.x) < 0.5 && p.z > 0 && p.z < CONFIG.CAR_LEN) { collectPickup(p); continue; }
    if (p.z < Z_NEAR) p.active = false;
  }
}

function fixedUpdate(dt) {
  runTime += dt;
  curSpeed = Math.min(CONFIG.SPEED_MAX, CONFIG.SPEED_START + CONFIG.SPEED_RAMP * runTime);
  curK = clamp(runTime / CONFIG.RAMP_TIME, 0, 1);
  curRowGapT = lerp(CONFIG.ROW_GAP_T_START, CONFIG.ROW_GAP_T_MIN, curK);
  distance += curSpeed * dt;

  // v0.3 (G1): dropped the "- 1" offset, so zone 0 (Bukit Bintang) begins at
  // distance 0 instead of at ZONE_DIST. zoneIndex starts at -1 (see beginRun),
  // so the very first fixedUpdate tick still fires the normal zone-enter path
  // (crossfade + chime + banner) straight into Bukit Bintang instead of a
  // silent generic skyline for the first ~15s of every run.
  const newZoneIndex = Math.floor(distance / CONFIG.ZONE_DIST);
  if (newZoneIndex > zoneIndex) {
    prevZoneKey = zoneKeyFor(zoneIndex);
    zoneIndex = newZoneIndex;
    const enteredZone = zoneAtIndex(zoneIndex);
    zoneTransitionStartMs = performance.now();
    if (!enteredZone.silent) {
      lastAnnouncedZoneIndex = zoneIndex;
      bannerZoneName = enteredZone.name;
      bannerStartMs = zoneTransitionStartMs;
      playZoneChime();
    } else {
      bannerZoneName = '';
      bannerStartMs = -1e9;
    }
  }

  // v0.3 (KL rework, section 4): gate spawns by distance lookahead, not by
  // the gameplay RNG, so it scrolls in like any other billboard well before
  // the player actually crosses the boundary.
  while (distance + CONFIG.Z_SPAWN >= nextGateZoneIndex * CONFIG.ZONE_DIST) {
    spawnGate(nextGateZoneIndex, CONFIG.Z_SPAWN);
    nextGateZoneIndex++;
  }
  // v0.3 (5A): plain viaduct, once per Bukit Bintang occurrence. Jumps a
  // full loop (every zone in KL_ZONES) ahead after spawning, since Bukit
  // Bintang only recurs every KL_ZONES.length * ZONE_DIST.
  if (distance + CONFIG.Z_SPAWN >= nextViaductDist) {
    spawnViaduct(CONFIG.Z_SPAWN, 1, 7);
    nextViaductDist += KL_ZONES.length * CONFIG.ZONE_DIST;
  }

  let guard = 0;
  while (distance + CONFIG.Z_SPAWN >= nextRowDist && guard < 10) {
    spawnRow();
    nextRowDist += curSpeed * curRowGapT;
    guard++;
  }

  updatePlayerTween();
  const died = updateObstacles(dt);
  if (died) return;
  updatePickups(dt);
  updateGates(dt);
  updateViaducts(dt);

  if (combo > 0) {
    timeSinceLastNearMiss += dt;
    if (timeSinceLastNearMiss >= CONFIG.COMBO_WINDOW) combo = 0;
  }
}

function cosmeticUpdate(dt) {
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    if (!p.active) continue;
    p.t += dt;
    if (p.t >= p.life) p.active = false;
  }
  if (shakeAmp > 0) {
    const el = performance.now() - shakeStartMs;
    shakeAmp = Math.max(0, 8 * (1 - el / 250));
  }
  if (flashAmp > 0) {
    const el = performance.now() - flashStartMs;
    flashAmp = Math.max(0, 1 - el / 120);
  }
}

/* ============================================================
   RENDER
   ============================================================ */
const PALETTE = {
  bg: '#0b0d12', road: '#262b36', mark: '#8a93a6', player: '#e8f1ff',
  danger: '#ff4d4d', cutter: '#ff8a4d', pickup: '#6ff2e6', bonus: '#3dff8b', text: '#ffffff'
};

// v0.3 (R1): per-visual billboard size, in lane units (w/h), replacing the
// single shared OBST_VISUAL_HALF_W. Distinct silhouettes (wide-low vs
// narrow-tall vs striped board) are the point - they're what has to read at
// 16px, not surface detail. `color` is now the far-distance LOD fallback
// fill (drawBillboard drops to it under ~12px, where the real sprite would
// just be blurred mush) rather than the placeholder art itself - R2 shipped
// the real rear-view sprites, drawn via drawImage above that threshold.
const VISUAL_SIZE = {
  playerCar: { w: 0.80, h: 0.62, color: '#dfe7f2' },
  hatchback: { w: 0.74, h: 0.70, color: PALETTE.cutter },
  kapcai:    { w: 0.42, h: 0.86, color: '#2e6cff' },
  barrier:   { w: 0.86, h: 0.52, color: '#d97a35' },
  coneRow:   { w: 0.80, h: 0.42, color: '#ff8a3d' }
};

// top edge (screen y) of a billboard at world depth z, used to recycle
// objects once they've fully scrolled past the bottom of the screen (R3) -
// checking the top edge rather than a fixed z, since a tall billboard can
// still show part of itself on screen after its base (o.z) passes Z_NEAR.
function billboardTopY(z, visualKey) {
  const sz = VISUAL_SIZE[visualKey] || VISUAL_SIZE.hatchback;
  return screenY(z) - sz.h * CONFIG.LANE_W * sOf(z);
}

function drawSpanRect(xCenter, halfW, z0, len, color) {
  const zFar = z0 + len, zNear = z0;
  const yTop = screenY(zFar), yBot = screenY(zNear);
  if (yBot <= yTop) return;
  const wPx = widthPx(halfW * 2, zNear);
  const cx = screenX(xCenter, zNear);
  ctx.fillStyle = color;
  ctx.fillRect(cx - wPx / 2, yTop, Math.max(1, wPx), yBot - yTop);
}

// v0.4 (fix #2): a TRUE perspective quad - width computed independently at
// the near and far edge, not a single width stretched over the whole span.
// drawSpanRect drew every dash/strip as an axis-aligned rectangle sized
// from the near edge alone, which is why the danger strip read as a flat
// carpet and dashes stair-stepped close to the camera.
function drawSpanQuad(xCenter, halfW, z0, len, color) {
  const zFar = z0 + len, zNear = z0;
  const yTop = screenY(zFar), yBot = screenY(zNear);
  if (yBot <= yTop) return;
  const wTop = widthPx(halfW * 2, zFar), wBot = widthPx(halfW * 2, zNear);
  const cxTop = screenX(xCenter, zFar), cxBot = screenX(xCenter, zNear);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cxBot - wBot / 2, yBot);
  ctx.lineTo(cxBot + wBot / 2, yBot);
  ctx.lineTo(cxTop + wTop / 2, yTop);
  ctx.lineTo(cxTop - wTop / 2, yTop);
  ctx.closePath();
  ctx.fill();
}

function drawScrollMarks(xUnit, spacing, len, halfW, color) {
  const phase = ((distance % spacing) + spacing) % spacing;
  const iStart = Math.floor((Z_NEAR + phase) / spacing) - 1;
  const iEnd = Math.ceil((CONFIG.Z_FAR + phase) / spacing) + 1;
  for (let i = iStart; i <= iEnd; i++) {
    const z0 = i * spacing - phase;
    if (z0 + len < Z_NEAR || z0 > CONFIG.Z_FAR) continue;
    drawSpanQuad(xUnit, halfW, z0, len, color);
  }
}

function drawRoad() {
  ctx.fillStyle = PALETTE.road;
  ctx.beginPath();
  ctx.moveTo(screenX(-1.5, CONFIG.Z_FAR), screenY(CONFIG.Z_FAR));
  ctx.lineTo(screenX(1.5, CONFIG.Z_FAR), screenY(CONFIG.Z_FAR));
  ctx.lineTo(screenX(1.5, Z_NEAR), screenY(Z_NEAR));
  ctx.lineTo(screenX(-1.5, Z_NEAR), screenY(Z_NEAR));
  ctx.closePath();
  ctx.fill();
}

// v0.4 (2.2/section 3): kerb, lamp posts and shop-block cards are gone -
// the street pack (kl-street.js, drawKLStreetBase/drawKLStreetSides) now
// owns the kerb, pavement, lamps and buildings, per district. Drawing
// camera-facing building cards in depth was the root cause of the
// "staircase" artifact fixed last pass; the real fix was always going to
// be replacing the geometry, not re-skinning the cards - see v0.4 spec
// section 1.

// v0.3 (7.6): parody ad text - generic words only, no real business names
// (hard content rule #5). One board in ten is left as the plain
// "advertise here" placeholder. `propHash` is a stable, non-gameplay
// pseudo-random pick keyed to the sign's fixed world position (not the
// seeded RNG, and not per-frame - the same physical sign keeps the same
// text as it scrolls from the horizon to the player).
function propHash(n) { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
const AD_WORDS = ['SALE 50%', 'NOW OPEN', 'GRAND OPENING', 'BEST DEALS', 'PROMOSI HEBAT', 'DISKAUN BESAR', 'MENU BARU', 'JOM MAKAN'];
function adTextFor(worldSlot) {
  const h = propHash(worldSlot);
  if (h < 0.1) return 'IKLAN DI SINI';
  return AD_WORDS[Math.floor(h * 733) % AD_WORDS.length];
}

function drawSignBillboard(xLane, z) {
  const s = sOf(z);
  const baseX = screenX(xLane, z), baseY = screenY(z);
  const poleH = 1.05 * CONFIG.LANE_W * s, poleW = Math.max(1, 0.05 * CONFIG.LANE_W * s);
  ctx.fillStyle = '#20242c';
  ctx.fillRect(baseX - poleW / 2, baseY - poleH, poleW, poleH);
  const panelW = 1.5 * CONFIG.LANE_W * s, panelH = 0.55 * CONFIG.LANE_W * s;
  const panelCY = baseY - poleH - panelH * 0.52;
  const glow = zoneDataFor(zoneKeyFor(zoneIndex)).glow;
  ctx.fillStyle = '#12141a';
  drawRoundedRect(ctx, baseX - panelW / 2, panelCY - panelH / 2, panelW, panelH, Math.min(3, panelW * 0.05));
  ctx.fill();
  ctx.strokeStyle = rgba(glow, 0.55);
  ctx.lineWidth = Math.max(1, panelW * 0.025);
  ctx.stroke();
  if (panelH > 6) {
    const text = adTextFor(Math.round((distance + z) / 168));
    ctx.fillStyle = rgba(glow, 0.9);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (panelH * 0.26).toFixed(1) + 'px system-ui, sans-serif';
    wrapText(text, baseX, panelCY, panelW * 0.86, panelH * 0.30);
  }
}

let roadsideBlitCount = 0; // v0.3 (KL rework, debug overlay): roadside blits this frame
// v0.3 (KL rework, section 4): zone gates. All three types are billboards
// centred on x = 0, faded in like any other billboard (CONFIG.Z_SPAWN
// lookahead), drawn as part of the normal far-to-near z-sort - see
// drawGate() / collectAndSort. No collision, no danger strip.
// v0.4.4 (audit P1 #2): size no longer tracks z past s=1 (the player's own
// depth) - previously the panel/arch kept scaling up as the player passed
// underneath (z<0 briefly pushes s above 1), so for a few frames it filled
// most of the screen and read as a wall rather than an overhead sign. Size
// now clamps at the player's own scale; position still tracks the real z
// so the gate keeps moving correctly. A fast fade once z<0 additionally
// dissolves it out instead of leaving a large flat shape hanging overhead.
function gateCloseFade(z) { return z < 0 ? clamp(1 + z / 15, 0.12, 1) : 1; }

function drawPetalingGate(z, name, alpha) {
  const s = sOf(z), sSize = Math.min(s, 1.05), cx = screenX(0, z), baseY = screenY(z);
  const a = alpha * gateCloseFade(z);
  const sl = KL_LANDMARKS.petalingGate;
  const wPx = (sl.gateWLanes || CONFIG.GATE_W_LANES) * CONFIG.LANE_W * sSize;
  const hPx = wPx * sl.h / sl.w;
  drawBakedScaled(ctx, klBaked.gate, cx, baseY, hPx, a);
  const tb = sl.textBox, k = hPx / sl.h;
  if (tb && tb.h * k > 5) {
    ctx.globalAlpha = a; ctx.fillStyle = '#e8c56a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (tb.h * k * 0.55).toFixed(1) + 'px system-ui, sans-serif';
    ctx.fillText(name.toUpperCase(), cx + (tb.x + tb.w / 2 - sl.w / 2) * k, baseY - (sl.h - tb.y - tb.h / 2) * k);
    ctx.globalAlpha = 1;
  }
  return hPx / (CONFIG.LANE_W * sSize) + 0.35;
}

// Pack-defined drive-through landmarks (Kasturi Walk and Little India).
// Their authored gateWLanes value controls road clearance and preserves the
// proportions of each supplied illustration at every perspective depth.
function drawPackGate(gateType, z, alpha) {
  const sprite = klBaked.gates && klBaked.gates[gateType];
  const lm = KL_LANDMARKS[gateType];
  if (!sprite || !lm) return 3.0;
  const sSize = Math.min(sOf(z), 1.05), cx = screenX(0, z), baseY = screenY(z);
  const a = alpha * gateCloseFade(z);
  const widthLanes = lm.gateWLanes || CONFIG.GATE_W_LANES;
  const wPx = widthLanes * CONFIG.LANE_W * sSize;
  const hPx = wPx * lm.h / lm.w;
  drawBakedScaled(ctx, sprite, cx, baseY, hPx, a);
  return hPx / (CONFIG.LANE_W * sSize) + 0.35;
}

// generic overhead road-sign gantry, used by every zone that isn't Bukit
// Bintang (monorail station) or Jalan Petaling (its own arch). Panel colour
// is a placeholder (CONFIG.GANTRY_COLOR) - project owner to confirm the
// correct local signage colour, per the spec's own note not to invent one.
// v0.4.2 (2.3): panel colour follows the Malaysian road-sign convention -
// blue for ordinary roads, maroon for tourist places (green would read as
// an expressway, which none of these zones are). Bukit Bintang and Jalan
// Petaling never reach here - they use their own station/arch gates.
const GANTRY_COLOR_BY_ZONE = { klcc: '#1b3d8f', dataranMerdeka: '#7a2a16', batuCaves: '#7a2a16' };
function drawGantryGate(z, name, alpha, zoneKey) {
  const s = sOf(z), sSize = Math.min(s, 1.05), cx = screenX(0, z), baseY = screenY(z);
  const a = alpha * gateCloseFade(z);
  // v0.4.4 (audit P1 #2): postH raised 2.6 -> 3.1 lane units for a clearer
  // gap between the panel and the road, and every size below now uses the
  // clamped sSize instead of the raw (unbounded past z=0) s.
  const wPx = CONFIG.GATE_W_LANES * CONFIG.LANE_W * sSize;
  const postW = Math.max(1, 0.06 * CONFIG.LANE_W * sSize);
  const postH = 3.1 * CONFIG.LANE_W * sSize;
  const trussH = Math.max(1, 0.14 * CONFIG.LANE_W * sSize);
  const panelH = 0.55 * CONFIG.LANE_W * sSize;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#6b7280';
  ctx.fillRect(cx - wPx / 2 - postW, baseY - postH, postW, postH);
  ctx.fillRect(cx + wPx / 2, baseY - postH, postW, postH);
  ctx.fillRect(cx - wPx / 2 - postW, baseY - postH - trussH, wPx + 2 * postW, trussH);
  const panelY = baseY - postH - trussH - panelH * 0.5;
  ctx.fillStyle = GANTRY_COLOR_BY_ZONE[zoneKey] || CONFIG.GANTRY_COLOR;
  drawRoundedRect(ctx, cx - wPx / 2, panelY - panelH / 2, wPx, panelH, Math.min(3, wPx * 0.02));
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, wPx * 0.01);
  ctx.stroke();
  if (panelH > 5) {
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (panelH * 0.5).toFixed(1) + 'px system-ui, sans-serif';
    ctx.fillText(name.toUpperCase(), cx, panelY);
  }
  ctx.globalAlpha = 1;
}

// v0.4.4 (audit P1 #3): a small "NEXT" tag above every approaching gate -
// the gate itself already shows the destination's name, which previously
// looked identical to a current-location label and could contradict the
// HUD (e.g. HUD says "JALAN PETALING" while the biggest object on screen
// says "DATARAN MERDEKA"). Disappears just before the player reaches the
// gate, since at that point it stops being "next" and becomes "here".
function drawNextBadge(z, alpha, topOffset) {
  if (z <= 2) return;
  const s = Math.min(sOf(z), 1.05);
  const cx = screenX(0, z), baseY = screenY(z);
  const topY = baseY - topOffset * CONFIG.LANE_W * s;
  const w = Math.max(16, 0.85 * CONFIG.LANE_W * s), h = Math.max(7, 0.26 * CONFIG.LANE_W * s);
  if (h < 5) return;
  const a = alpha * clamp((z - 2) / 20, 0, 1);
  if (a <= 0) return;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#e0b21c';
  drawRoundedRect(ctx, cx - w / 2, topY - h / 2, w, h, Math.min(3, h * 0.22));
  ctx.fill();
  ctx.strokeStyle = '#15120c'; ctx.lineWidth = Math.max(1, h * 0.08); ctx.stroke();
  ctx.fillStyle = '#15120c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + (h * 0.58).toFixed(1) + 'px system-ui, sans-serif';
  ctx.fillText('NEXT \u25B8', cx, topY + h * 0.05);
  ctx.globalAlpha = 1;
}

function drawGate(g) {
  let alpha = clamp((CONFIG.Z_SPAWN - g.z) / 30, 0, 1);
