  rimLight(g, cx - w * 0.100, cx + w * 0.100, h * 0.540, h * 0.640, 0.24);
}


/* ------------------- player car, variant B: aggressive ----------------
   Same signature and same VISUAL_SIZE box as drawF1Sprite, so it is a
   straight swap in buildSprites. Differences from variant A:
     - cambered rear tyres (tops leaning in) on a wider stance
     - raked, louvred endplates and a spoon-section wing with a Gurney lip
     - swan-neck pylons visible under the main plane
     - graphite bodywork with an accent chevron instead of a centre stripe
     - deeper diffuser, glowing throat, T-wing on the engine cover
   opts: accent2, carbon, rainLight, camber (radians, default 0.075)    */
function drawF1SpriteB(g, w, h, bodyColor, accentColor, opts) {
  opts = opts || {};
  const accent = accentColor || PLAYER_ACCENT_RED;
  const carbon = opts.carbon || '#0f141c';
  const rain = opts.rainLight || '#ff2d2d';
  const camber = opts.camber === undefined ? 0 : opts.camber;   // 0.075 = cambered
  const cx = w * 0.5;
  const RW = w * 0.315;             // rear wing half span
  const TX = w * 0.382;             // rear tyre centre offset
  const TW = w * 0.215;             // rear tyre width
  // v0.3 (7.1): compress the darkening range instead of applying it
  // straight - the review called for "the brightest, most saturated object
  // on screen, light body... do not reuse the dark carbon scheme", but the
  // panel-shading pattern below (dark-light-dark, reading as curved
  // bodywork) is worth keeping. Scaling every darken fraction down by the
  // same factor keeps that contrast pattern while landing on a light body
  // instead of dark graphite regardless of how light bodyColor itself is.
  function bshade(t) { return shade(bodyColor, t * 0.38); }
  const graphite = bshade(0.72);

  /* panel shading, compressed light (see bshade) - the accent and the lit
     edges still carry most of the shape read */
  function plate(x0, x1) {
    return linGrad(g, x0, 0, x1, 0, [
      [0.00, bshade(0.88)], [0.20, bshade(0.66)],
      [0.46, bshade(0.48)], [0.74, bshade(0.62)],
      [1.00, bshade(0.90)]
    ]);
  }
  function edgeLight(x1, y1, x2, y2, a, lw) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = rgba('#dfe9fb', a);
    g.lineWidth = Math.max(1, lw);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.restore();
  }

  /* ---- cambered rear tyres, pivoting on the contact patch ---- */
  [-1, 1].forEach(function (s) {
    g.save();
    g.translate(cx + s * TX, h);
    g.rotate(-s * camber);
    g.translate(-(cx + s * TX), -h);
    drawRearTyre(g, cx + s * TX, h, TW, h * 0.680);
    /* wheel cover sliver on the outboard face */
    g.fillStyle = rgba('#2b323f', 0.9);
    drawRoundedRect(g, cx + s * (TX + TW * 0.5) - (s > 0 ? w * 0.024 : 0),
                    h * 0.400, w * 0.024, h * 0.440, w * 0.008);
    g.fill();
    g.restore();
  });
  /* rotor heat in the gap between tyre and bodywork */
  [-1, 1].forEach(function (s) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = rgba('#ff8a2b', 0.26);
    drawRoundedRect(g, cx + s * (TX - TW * 0.52) - (s > 0 ? w * 0.015 : 0), h * 0.600,
                    w * 0.015, h * 0.220, w * 0.006);
    g.fill();
    g.restore();
  });

  /* ---- engine cover: hard chamfer, shark fin, angular airbox ---- */
  g.beginPath();
  g.moveTo(cx - w * 0.098, h * 0.118);
  g.lineTo(cx + w * 0.098, h * 0.118);
  g.lineTo(cx + w * 0.172, h * 0.336);
  g.lineTo(cx - w * 0.172, h * 0.336);
  g.closePath();
  g.fillStyle = plate(cx - w * 0.172, cx + w * 0.172); g.fill();
  /* chamfer planes either side of the spine */
  [-1, 1].forEach(function (s) {
    g.beginPath();
    g.moveTo(cx + s * w * 0.098, h * 0.118);
    g.lineTo(cx + s * w * 0.172, h * 0.336);
    g.lineTo(cx + s * w * 0.104, h * 0.336);
    g.lineTo(cx + s * w * 0.044, h * 0.120);
    g.closePath();
    g.fillStyle = rgba('#000000', 0.32); g.fill();
    edgeLight(cx + s * w * 0.098, h * 0.120, cx + s * w * 0.172, h * 0.334, 0.22, w * 0.008);
  });
  /* accent chevron down the cover */
  g.fillStyle = rgba(accent, 0.90);
  g.beginPath();
  g.moveTo(cx, h * 0.150);
  g.lineTo(cx + w * 0.066, h * 0.336);
  g.lineTo(cx + w * 0.030, h * 0.336);
  g.lineTo(cx, h * 0.232);
  g.lineTo(cx - w * 0.030, h * 0.336);
  g.lineTo(cx - w * 0.066, h * 0.336);
  g.closePath(); g.fill();
  /* shark fin ridge */
  g.fillStyle = rgba('#dfe9fb', 0.16);
  g.fillRect(cx - w * 0.006, h * 0.126, w * 0.012, h * 0.210);

  /* halo, sharper and lower over an angular helmet */
  g.strokeStyle = '#46516a';
  g.lineWidth = Math.max(1.5, w * 0.024);
  g.lineJoin = 'miter'; g.lineCap = 'butt';
  g.beginPath();
  g.moveTo(cx - w * 0.100, h * 0.142);
  g.lineTo(cx - w * 0.042, h * 0.052);
  g.lineTo(cx + w * 0.042, h * 0.052);
  g.lineTo(cx + w * 0.100, h * 0.142);
  g.stroke();
  edgeLight(cx - w * 0.040, h * 0.054, cx + w * 0.040, h * 0.054, 0.45, w * 0.008);
  g.fillStyle = '#080b10';
  drawRoundedRect(g, cx - w * 0.050, h * 0.058, w * 0.100, h * 0.074, w * 0.018); g.fill();
  const hm = g.createLinearGradient(cx - w * 0.042, 0, cx + w * 0.042, 0);
  hm.addColorStop(0.00, '#66748c');
  hm.addColorStop(0.35, '#e6edf8');
  hm.addColorStop(1.00, '#586479');
  g.fillStyle = hm;
  drawRoundedRect(g, cx - w * 0.042, h * 0.062, w * 0.084, h * 0.060, w * 0.014); g.fill();
  g.fillStyle = rgba(accent, 0.90);
  g.beginPath();
  g.moveTo(cx - w * 0.042, h * 0.086);
  g.lineTo(cx + w * 0.042, h * 0.086);
  g.lineTo(cx + w * 0.042, h * 0.098);
  g.lineTo(cx - w * 0.042, h * 0.104);
  g.closePath(); g.fill();

  /* T-wing ahead of the rear wing */
  g.fillStyle = carbon;
  drawRoundedRect(g, cx - w * 0.115, h * 0.196, w * 0.230, h * 0.026, w * 0.006); g.fill();
  edgeLight(cx - w * 0.113, h * 0.198, cx + w * 0.113, h * 0.198, 0.30, w * 0.006);
  [-1, 1].forEach(function (s) {
    g.fillStyle = carbon;
    g.fillRect(cx + s * w * 0.115 - (s > 0 ? w * 0.014 : 0), h * 0.182, w * 0.014, h * 0.046);
  });

  /* ---- gearbox + swan-neck pylons, under the wing ---- */
  g.beginPath();
  g.moveTo(cx - w * 0.070, h * 0.380);
  g.lineTo(cx + w * 0.070, h * 0.380);
  g.lineTo(cx + w * 0.044, h * 0.670);
  g.lineTo(cx - w * 0.044, h * 0.670);
  g.closePath();
  g.fillStyle = linGrad(g, cx - w * 0.070, 0, cx + w * 0.070, 0, [
    [0.00, '#0a0e14'], [0.38, '#2a3342'], [0.66, '#1d2431'], [1.00, '#080b10']
  ]);
  g.fill();
  [-1, 1].forEach(function (s) {
    g.fillStyle = '#1b2230';
    g.beginPath();
    g.moveTo(cx + s * w * 0.046, h * 0.560);
    g.lineTo(cx + s * w * 0.072, h * 0.560);
    g.lineTo(cx + s * w * 0.060, h * 0.452);
    g.lineTo(cx + s * w * 0.038, h * 0.452);
    g.closePath(); g.fill();
    edgeLight(cx + s * w * 0.046, h * 0.558, cx + s * w * 0.038, h * 0.454, 0.20, w * 0.006);
  });

  /* suspension: sharper, more visible */
  [-1, 1].forEach(function (s) {
    g.strokeStyle = '#0b1017';
    g.lineWidth = Math.max(1.2, w * 0.020);
    g.beginPath();
    g.moveTo(cx + s * w * 0.062, h * 0.585);
    g.lineTo(cx + s * (TX - TW * 0.40), h * 0.640);
    g.moveTo(cx + s * w * 0.056, h * 0.660);
    g.lineTo(cx + s * (TX - TW * 0.40), h * 0.700);
    g.stroke();
    g.strokeStyle = rgba('#dfe9fb', 0.16);
    g.lineWidth = Math.max(1, w * 0.006);
    g.beginPath();
    g.moveTo(cx + s * w * 0.062, h * 0.585);
    g.lineTo(cx + s * (TX - TW * 0.40), h * 0.640);
    g.stroke();
  });

  /* ---- rear wing: raked louvred endplates, spoon planes, Gurney ---- */
  [-1, 1].forEach(function (s) {
    g.beginPath();
    g.moveTo(cx + s * (RW + w * 0.030), h * 0.196);
    g.lineTo(cx + s * (RW - w * 0.006), h * 0.208);
    g.lineTo(cx + s * (RW - w * 0.030), h * 0.545);
    g.lineTo(cx + s * (RW + w * 0.014), h * 0.545);
    g.closePath();
    g.fillStyle = carbon; g.fill();
    edgeLight(cx + s * (RW + w * 0.030), h * 0.198, cx + s * (RW + w * 0.014), h * 0.543, 0.30, w * 0.007);
    /* louvre slots, angled */
    for (let i = 0; i < 3; i++) {
      g.strokeStyle = rgba('#7d879b', 0.35);
      g.lineWidth = Math.max(1, w * 0.007);
      g.beginPath();
      g.moveTo(cx + s * (RW + w * 0.024), h * (0.240 + i * 0.040));
      g.lineTo(cx + s * (RW - w * 0.004), h * (0.262 + i * 0.040));
      g.stroke();
    }
    /* accent slash near the foot */
    g.fillStyle = rgba(accent, 0.85);
    g.beginPath();
    g.moveTo(cx + s * (RW + w * 0.020), h * 0.430);
    g.lineTo(cx + s * (RW - w * 0.014), h * 0.440);
    g.lineTo(cx + s * (RW - w * 0.018), h * 0.500);
    g.lineTo(cx + s * (RW + w * 0.016), h * 0.492);
    g.closePath(); g.fill();
  });

  /* spoon section: centre of the wing sits higher than the tips */
  function spoon(y0, y1, sag) {
    g.beginPath();
    g.moveTo(cx - RW, y0 + sag);
    g.quadraticCurveTo(cx, y0 - sag * 0.9, cx + RW, y0 + sag);
    g.lineTo(cx + RW, y1 + sag);
    g.quadraticCurveTo(cx, y1 - sag * 0.9, cx - RW, y1 + sag);
    g.closePath();
  }
  /* flap top surface */
  spoon(h * 0.238, h * 0.318, h * 0.030);
  g.fillStyle = linGrad(g, cx - RW, 0, cx + RW, 0, [
    [0.00, bshade(0.52)], [0.24, bshade(0.20)],
    [0.52, bshade(0.04)], [1.00, bshade(0.56)]
  ]);
  g.fill();
  /* accent V across the flap */
  g.save();
  spoon(h * 0.238, h * 0.318, h * 0.030); g.clip();
  g.fillStyle = rgba(accent, 0.95);
  g.beginPath();
  g.moveTo(cx - RW, h * 0.238);
  g.lineTo(cx, h * 0.300);
  g.lineTo(cx + RW, h * 0.238);
  g.lineTo(cx + RW, h * 0.262);
  g.lineTo(cx, h * 0.324);
  g.lineTo(cx - RW, h * 0.262);
  g.closePath(); g.fill();
  g.restore();
  /* flap trailing face */
  spoon(h * 0.318, h * 0.392, h * 0.030);
  g.fillStyle = linGrad(g, cx - RW, 0, cx + RW, 0, [
    [0.00, bshade(0.90)], [0.30, bshade(0.62)],
    [0.55, bshade(0.48)], [1.00, bshade(0.92)]
  ]);
  g.fill();
  /* DRS slot */
  spoon(h * 0.392, h * 0.414, h * 0.030);
  g.fillStyle = rgba('#000000', 0.80); g.fill();
  /* main plane */
  spoon(h * 0.414, h * 0.512, h * 0.030);
  g.fillStyle = linGrad(g, cx - RW, 0, cx + RW, 0, [
    [0.00, bshade(0.92)], [0.32, bshade(0.70)],
    [0.58, bshade(0.58)], [1.00, bshade(0.94)]
  ]);
  g.fill();
  /* Gurney flap along the trailing edge */
  spoon(h * 0.506, h * 0.524, h * 0.030);
  g.fillStyle = rgba('#dfe9fb', 0.45); g.fill();
  edgeLight(cx - RW * 0.98, h * 0.243, cx, h * 0.214, 0.34, w * 0.007);
  edgeLight(cx, h * 0.214, cx + RW * 0.98, h * 0.243, 0.34, w * 0.007);

  /* ---- exhaust, rain light, deep diffuser ---- */
  g.fillStyle = '#2b323f';
  g.beginPath(); g.arc(cx, h * 0.598, w * 0.040, 0, TAU); g.fill();
  g.fillStyle = '#ff6a10';
  g.beginPath(); g.arc(cx, h * 0.598, w * 0.023, 0, TAU); g.fill();
  g.fillStyle = '#12161d';
  drawRoundedRect(g, cx - w * 0.052, h * 0.630, w * 0.104, h * 0.088, w * 0.016); g.fill();
  g.fillStyle = linGrad(g, 0, h * 0.640, 0, h * 0.710, [
    [0.00, tint(rain, 0.50)], [1.00, shade(rain, 0.28)]
  ]);
  // v0.3 (7.1): rain light enlarged (was 0.064 x 0.052 of w/h) - the review
  // wanted it more prominent as part of making the player the brightest,
  // most legible object on screen.
  drawRoundedRect(g, cx - w * 0.042, h * 0.644, w * 0.084, h * 0.068, w * 0.012); g.fill();

  g.beginPath();
  g.moveTo(cx - w * 0.250, h * 0.700);
  g.lineTo(cx + w * 0.250, h * 0.700);
  g.lineTo(cx + w * 0.272, h * 0.990);
  g.lineTo(cx - w * 0.272, h * 0.990);
  g.closePath();
  g.fillStyle = '#05080d'; g.fill();
  /* throat glow: extraction heat under the car */
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = linGrad(g, 0, h * 0.700, 0, h * 0.870, [
    [0.00, rgba('#ff7a1a', 0.22)], [1.00, rgba('#ff7a1a', 0)]
  ]);
  g.fillRect(cx - w * 0.250, h * 0.700, w * 0.500, h * 0.170);
  g.restore();
  for (let i = -3; i <= 3; i++) {
    g.strokeStyle = rgba('#8a93a6', 0.20);
    g.lineWidth = Math.max(1, w * 0.008);
    g.beginPath();

    g.lineTo(cx + i * w * 0.068, h * 0.982);
    g.stroke();
  }
  edgeLight(cx - w * 0.248, h * 0.702, cx + w * 0.248, h * 0.702, 0.20, w * 0.009);
  /* beam wing, swept */
  g.fillStyle = carbon;
  g.beginPath();

  g.lineTo(cx + w * 0.170, h * 0.668);
  g.lineTo(cx + w * 0.150, h * 0.702);

  g.closePath(); g.fill();
  edgeLight(cx - w * 0.168, h * 0.670, cx + w * 0.168, h * 0.670, 0.24, w * 0.006);

/* --------------------- baking: 3x, per-visual aspect ----------------- */
/* Logical density: 150px per lane unit, so every VISUAL_SIZE lands on a
   whole number and all five sprites share one texel density. */
const SPRITE_PX_PER_LANE = 150;
const SPRITE_DPR = 3;

const sprites = {};
function makeSprite(key, drawFn) {
  const sz = VISUAL_SIZE[key];
  const c = document.createElement('canvas');
  c.width = Math.round(sz.w * SPRITE_PX_PER_LANE) * SPRITE_DPR;
  c.height = Math.round(sz.h * SPRITE_PX_PER_LANE) * SPRITE_DPR;
  drawFn(c.getContext('2d'), c.width, c.height);
  sprites[key] = c;
}
function buildSprites() {
  makeSprite('playerCar', function (g, w, h) { drawF1SpriteB(g, w, h, PALETTE.player, PLAYER_ACCENT_RED, {}); });
  makeSprite('hatchback', function (g, w, h) { drawCarSprite(g, w, h, PALETTE.cutter, '#16202e', { rearLight: '#ff4a2e' }); });
  registerKapcaiLiveries();
  makeSprite('coneRow', drawConeRowSprite);
  makeSprite('barrier', drawBarrierSprite);
}

// v0.3 (R2 shipped): drawSpriteSpan (flat ground-plane decal) was retired
// from the obstacle/player path in favour of drawBillboard below - the old
// sprites were plan-view art stretched into the road span, so they had no
// height on screen and collapsed to a few px at any real distance. R1 first
// shipped this as placeholder flat-colour boxes to validate the projection;
// the sprite functions above are now the real rear-view art (R2), baked at
// 3x for phone DPI (V2), consumed via drawImage in drawBillboard below.

// R4 (lane-occupancy cue): flat span in the obstacle's lane, drawn before
// the billboard so the blocked lane reads even if the box above it doesn't.
// v0.4 (fix #2): true quad instead of a flat rect, and alpha now fades with
// distance - a strip at full 0.22 alpha read as an opaque carpet once the
// dashes/kerb around it stopped competing with it for attention.
// v0.4.4 (audit P1 #1): stronger "reserved danger language" - a
// lane-occupancy strip that's more assertive as the hazard approaches, so
// a blocked lane reads clearly even against bright shopfronts and signage.
function drawDangerStrip(lane, z, len, color) {
  const a = 0.32 * clamp(1.3 - z / 130, 0.42, 1);
  drawSpanQuad(lane, 0.48, z, len, rgba(color, a));
}

function drawBillboard(visualKey, xLane, z, alpha) {
  const sz = VISUAL_SIZE[visualKey] || VISUAL_SIZE.hatchback;
  const s = sOf(z);
  const wPx = sz.w * CONFIG.LANE_W * s;
  const hPx = sz.h * CONFIG.LANE_W * s;
  const baseX = screenX(xLane, z), baseY = screenY(z);

  // contact shadow, anchored at the same ground point the collision uses
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.beginPath();
  ctx.ellipse(baseX, baseY, Math.max(2, wPx * 0.52), Math.max(1, wPx * 0.16), 0, 0, TAU);
  ctx.fill();

  // v0.4.4 (audit P1 #1): below ~12px wide, a real sprite is sub-pixel
  // mush - but drawing NOTHING (the previous fix) meant distant hazards
  // could vanish into the road entirely except for two tiny light dots. A
  // small flat marker in the type's own colour keeps something visible at
  // every distance without the noise a blurred sprite would add.
  if (wPx >= 12) {
    ctx.drawImage(sprites[visualKey], baseX - wPx / 2, baseY - hPx, wPx, hPx);
  } else {
    const mw = Math.max(3, wPx * 1.15), mh = Math.max(3, hPx * 0.7);
    ctx.fillStyle = sz.color;
    ctx.beginPath();
    ctx.moveTo(baseX, baseY - mh);
    ctx.lineTo(baseX + mw / 2, baseY - mh / 2);
    ctx.lineTo(baseX, baseY);
    ctx.lineTo(baseX - mw / 2, baseY - mh / 2);
    ctx.closePath();
    ctx.fill();
  }
  return { baseX: baseX, baseY: baseY, wPx: wPx, hPx: hPx, s: s };
}


/* Bake one sprite per livery. Each variant key aliases the kapcai entry in
   VISUAL_SIZE and LIGHT_ANCHOR, so the spawner can pick a key at random and
   every rider keeps identical size, collision and lamp placement - nothing
   in the renderer needs to know these exist. */
const KAPCAI_KEYS = {
  kapcai:        { livery: 'slate',   box: true  },   // generic, with a case
  kapcaiPlain:   { livery: 'slate',   box: false },   // generic, no case
  kapcaiPillion: { livery: 'slate',   box: false, pillion: true },  // kid on the back
  kapcaiJade:    { livery: 'jade',    box: true  },
  kapcaiMelon:   { livery: 'melon',   box: true  },
  kapcaiMagenta: { livery: 'magenta', box: true  }
};
function registerKapcaiLiveries() {
  Object.keys(KAPCAI_KEYS).forEach(function (key) {
    if (key !== 'kapcai') {
      VISUAL_SIZE[key] = VISUAL_SIZE.kapcai;
      LIGHT_ANCHOR[key] = LIGHT_ANCHOR.kapcai;
    }
    const cfg = KAPCAI_KEYS[key];
    makeSprite(key, function (g, w, h) {
      drawKapcaiSprite(g, w, h, null, '#242a36',
                       { livery: cfg.livery, box: cfg.box, pillion: cfg.pillion });
    });
  });
}
// v0.4.1: weighted, deterministic pick keyed to the obstacle's fixed world
// position via the existing non-gameplay hash (propHash) - not Math.random(),
// so the same seed shows the same livery on the same obstacle on every
// device, and this never touches the seeded gameplay RNG. Weights: generic
// 40% (20% case / 12% plain / 8% pillion), each delivery livery 20%.
const KAPCAI_PICK = [['kapcai', 0.20], ['kapcaiPlain', 0.32], ['kapcaiPillion', 0.40], ['kapcaiJade', 0.60], ['kapcaiMagenta', 0.80], ['kapcaiMelon', 1.00]];
function kapcaiKeyFor(worldZ, lane) {
  const h = propHash(Math.floor(worldZ) * 3 + (lane + 1) * 17 + 5);
  for (let i = 0; i < KAPCAI_PICK.length; i++) if (h < KAPCAI_PICK[i][1]) return KAPCAI_PICK[i][0];
  return 'kapcai';
}

/* ---- light anchors, matched to where the lenses actually sit -------- */
const LIGHT_ANCHOR = {
  hatchback: { pairs: [[-0.335, 0.430], [0.335, 0.430]], color: null },
  playerCar: { pairs: [[0.000, 0.325]], color: null },
  kapcai:    { pairs: [[0.000, 0.300]], color: null },
  barrier:   { pairs: [[-0.350, 0.935], [0.350, 0.935]], color: SODIUM, blink: true },
  coneRow:   { pairs: [[0.000, 0.550]], color: '#ffffff', scale: 0.8 }
};

function drawBillboardLights(visualKey, geo) {
  const a = LIGHT_ANCHOR[visualKey];
  if (!a) return;
  if (a.blink && Math.floor(performance.now() / 250) % 2 !== 0) return;
  const r = Math.max(1.5, 2.4 * geo.s) * (a.scale || 1);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = a.color || LIGHT_REAR;
  for (let i = 0; i < a.pairs.length; i++) {
    ctx.beginPath();
    ctx.arc(geo.baseX + a.pairs[i][0] * geo.wPx, geo.baseY - a.pairs[i][1] * geo.hPx, r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawObstacle(o) {
  // R7: fade obstacles in as they cross the spawn line instead of popping
  // in fully-formed at Z_SPAWN.
  const alpha = clamp((CONFIG.Z_SPAWN - o.z) / 30, 0, 1);
  if (alpha <= 0) return;
  ctx.globalAlpha = alpha;

  const isTelegraph = o.kind === 'cutter' && o.phase === 'telegraph';
  const visualKey = o.kind === 'cutter' ? 'hatchback' : o.visual;

  // v0.3 (R9): the cutter used to vanish on alternate 50ms slices during
  // telegraph - exactly the state a player most needs to track. It now
  // stays fully visible; only a small blinking indicator + a wobble toward
  // the target lane signal the turn, plus a solid (non-blinking) arrow.
  let dir = 1, visLane = o.lane, visX = o.x;
  if (isTelegraph) {
    dir = o.targetLane > o.lane ? 1 : -1;
    visX = o.x + dir * 0.08;
    drawDangerStrip(o.lane, o.z, o.len, PALETTE.cutter);
    drawDangerStrip(o.targetLane, o.z, o.len, PALETTE.cutter);
  } else {
    drawDangerStrip(o.lane, o.z, o.len, o.kind === 'cutter' ? PALETTE.cutter : PALETTE.danger);
  }

  const geo = drawBillboard(visualKey, visX, o.z);
  drawBillboardLights(visualKey, geo);

  if (isTelegraph) {
    if (Math.floor(performance.now() / 250) % 2 === 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = SODIUM;
      ctx.beginPath();
      ctx.arc(geo.baseX + dir * geo.wPx * 0.42, geo.baseY - geo.hPx * 0.5, Math.max(1.5, 2 * geo.s), 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    const arrowSize = Math.max(10, 14 * geo.s);
    const ay = geo.baseY - geo.hPx - arrowSize * 0.7;
    ctx.fillStyle = PALETTE.cutter;
    ctx.beginPath();
    ctx.moveTo(geo.baseX + dir * arrowSize * 0.6, ay);
    ctx.lineTo(geo.baseX - dir * arrowSize * 0.4, ay - arrowSize * 0.5);
    ctx.lineTo(geo.baseX - dir * arrowSize * 0.4, ay + arrowSize * 0.5);
    ctx.closePath();
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

// R10: pickups now hover as a small glowing billboard above the road with a
// ground shadow and a gentle time-based bob, instead of a flat 2px-at-100m
// circle drawn straight onto the road plane.
// v0.4 (fix #3): ring + highlight instead of a plain filled disc, now that
// lamps (the other former disc-look offender) are fixed by the street pack.
// v0.4.4 (audit P2 #8): unique cyan-white hue (was gold, which overlapped
// lamps/crossings/shop signage), a rotating segmented ring instead of a
// plain solid one, a bigger minimum size, and a faint vertical light
// column so it reads as a collectible before the ring itself resolves.
function drawPickup(p) {
  const alpha = clamp((CONFIG.Z_SPAWN - p.z) / 30, 0, 1);
  if (alpha <= 0) return;
  const s = sOf(p.z);
  const groundX = screenX(p.x, p.z), groundY = screenY(p.z);
  const bob = Math.sin(runTime * 4 + p.z * 0.05) * 3 * s;
  const hoverPx = 0.25 * CONFIG.LANE_W * s;
  const cy = groundY - hoverPx + bob;
  const r = Math.max(4, 9 * s);

  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(groundX, groundY, r * 0.9, r * 0.3, 0, 0, TAU); ctx.fill();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // faint light column, visible before the ring itself is legible at range
  ctx.fillStyle = 'rgba(111,242,230,0.16)';
  ctx.fillRect(groundX - Math.max(1, r * 0.12), cy - r * 3.2, Math.max(2, r * 0.24), r * 3.2);
  // rotating segmented ring - 5 short arcs instead of one solid stroke
  const segN = 5, spin = runTime * 2.4;
  ctx.strokeStyle = PALETTE.pickup;
  ctx.lineWidth = Math.max(1.5, r * 0.34);
  ctx.lineCap = 'round';
  for (let i = 0; i < segN; i++) {
    const a0 = spin + (i / segN) * TAU, a1 = a0 + (TAU / segN) * 0.55;
    ctx.beginPath(); ctx.arc(groundX, cy, r * 0.72, a0, a1); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(groundX - r * 0.25, cy - r * 0.25, Math.max(1, r * 0.22), 0, TAU); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const flashHit = state === 'DEAD' && (performance.now() - lastDeathMs) < 150;
  const s = sOf(0), baseX = screenX(player.x, 0), baseY = screenY(0);
  // v0.3 (7.1): additive underglow on the road - part of making the player
  // read as the brightest, most saturated object on screen. Flat ellipse,
  // no gradient, so it stays free of the per-frame-gradient guard rail.
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rgba(PLAYER_ACCENT_RED, 0.16);
  ctx.beginPath();
  ctx.ellipse(baseX, baseY + 2 * s, CONFIG.LANE_W * s * 0.62, CONFIG.LANE_W * s * 0.16, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  const geo = drawBillboard('playerCar', player.x, 0);
  if (flashHit) {
    ctx.fillStyle = '#ffffff';
    drawRoundedRect(ctx, geo.baseX - geo.wPx / 2, geo.baseY - geo.hPx, geo.wPx, geo.hPx, Math.min(4, geo.wPx * 0.12));
    ctx.fill();
  }
  drawBillboardLights('playerCar', geo);
}

// R7: horizon fog band, tinted with the current zone's colour, fading from
// opaque near Z_FAR down to clear by FOG_NEAR. Six stacked flat rects
// (never a gradient) so this stays allocation-free every frame.
// v0.4 (fix #1): fog band. Previously drawn as a special case right before
// the player - which, since the player is always the last (nearest) entry
// in the far-to-near sort, meant EVERY object still approaching (z > 0)
// got drawn before it and was veiled, including near traffic about to
// collide. It's now one entry in that same sort at depth CONFIG.FOG_NEAR:
// objects farther than that draw before it (veiled, correctly - they're
// meant to look hazy), everything nearer draws after it (stays clean).
// The 28 rgba() strings only get rebuilt when the zone's fog colour
// actually changes, not every frame.
let cachedFogColor = null, cachedFogRgba = null;
function fogRgbaSteps(fogColor, steps) {
  if (cachedFogColor === fogColor && cachedFogRgba) return cachedFogRgba;
  const arr = new Array(steps);
  for (let i = 0; i < steps; i++) arr[i] = rgba(fogColor, (1 - i / steps) * 0.8);
  cachedFogColor = fogColor; cachedFogRgba = arr;
  return arr;
}
// v0.4 (fix #8): limited to the road+pavement width (x = +-KL_STREET.WALL_X)
// instead of the full screen - the street walls now carry their own
// distance haze (baked into klsBuilding), so a full-width band on top of
// that showed as a hard purple stripe across the buildings and the gate.
// Each of the 28 steps is its own small perspective trapezoid (four
// projected corners), not an axis-aligned rect, so the whole band still
// narrows correctly toward the horizon.
function drawFogBand() {
  const yTop = screenY(CONFIG.Z_FAR), yBot = screenY(CONFIG.FOG_NEAR);
  if (yBot <= yTop) return;
  const fogColor = zoneDataFor(zoneKeyFor(zoneIndex)).sky[2];
  const steps = 28;
  const cols = fogRgbaSteps(fogColor, steps);
  const halfW = KL_STREET.WALL_X;
  for (let i = 0; i < steps; i++) {
    const a = (1 - i / steps) * 0.8;
    if (a <= 0.01) continue;
    const t0 = i / steps, t1 = (i + 1) / steps;
    const z0 = CONFIG.Z_FAR + (CONFIG.FOG_NEAR - CONFIG.Z_FAR) * t0;
    const z1 = CONFIG.Z_FAR + (CONFIG.FOG_NEAR - CONFIG.Z_FAR) * t1;
    const y0 = screenY(z0), y1 = screenY(z1);
    const xL0 = screenX(-halfW, z0), xR0 = screenX(halfW, z0);
    const xL1 = screenX(-halfW, z1), xR1 = screenX(halfW, z1);
    ctx.fillStyle = cols[i];
    ctx.beginPath();
    ctx.moveTo(xL1, y1 - 1);
    ctx.lineTo(xR1, y1 - 1);
    ctx.lineTo(xR0, y0 + 1);
    ctx.lineTo(xL0, y0 + 1);
    ctx.closePath();
    ctx.fill();
  }
}

function drawPopups() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px system-ui, sans-serif';
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    if (!p.active) continue;
    const frac = p.t / p.life;
    const y = p.y - 40 * frac;
    ctx.globalAlpha = Math.max(0, 1 - frac);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, y);
  }
  ctx.globalAlpha = 1;
}

// reusable scratch slots for far-to-near draw ordering (no per-frame allocation)
// v0.3 (R8): +1 slot so the player can be merged into the same z-sort - a
// billboard obstacle at z < 0 is now nearer the camera than the player and
// must draw on top of it, which the old "player always drawn last" order
// couldn't express.
const drawScratch = [];
for (let i = 0; i < MAX_OBST + MAX_PICKUP + MAX_GATES + MAX_VIADUCTS + 2; i++) drawScratch.push({ z: 0, kind: 'o', ref: null });
function collectAndSort() {
  let n = 0;
  for (let i = 0; i < obstacles.length; i++) {
    if (obstacles[i].active) { const s = drawScratch[n++]; s.z = obstacles[i].z; s.kind = 'o'; s.ref = obstacles[i]; }
  }
  for (let i = 0; i < pickups.length; i++) {
    if (pickups[i].active) { const s = drawScratch[n++]; s.z = pickups[i].z; s.kind = 'p'; s.ref = pickups[i]; }
  }
  for (let i = 0; i < gates.length; i++) {
    if (gates[i].active) { const s = drawScratch[n++]; s.z = gates[i].z; s.kind = 'g'; s.ref = gates[i]; }
  }
  for (let i = 0; i < viaducts.length; i++) {
    if (viaducts[i].active) { const s = drawScratch[n++]; s.z = viaducts[i].z; s.kind = 'v'; s.ref = viaducts[i]; }
  }
  // v0.4 (fix #1): fog band as a depth entry, not a special case tucked in
  // right before the player - see the note above drawFogBand.
  { const s = drawScratch[n++]; s.z = CONFIG.FOG_NEAR; s.kind = 'fog'; s.ref = null; }
  if (state === 'PLAYING' || state === 'PAUSED' || state === 'DEAD') {
    const s = drawScratch[n++]; s.z = 0; s.kind = 'pl'; s.ref = null;
  }
  for (let i = 1; i < n; i++) {
    const kz = drawScratch[i].z, kk = drawScratch[i].kind, kr = drawScratch[i].ref;
    let j = i - 1;
    while (j >= 0 && drawScratch[j].z < kz) {
      drawScratch[j + 1].z = drawScratch[j].z; drawScratch[j + 1].kind = drawScratch[j].kind; drawScratch[j + 1].ref = drawScratch[j].ref;
      j--;
    }
    drawScratch[j + 1].z = kz; drawScratch[j + 1].kind = kk; drawScratch[j + 1].ref = kr;
  }
  return n;
}

function render() {
  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, 360, VIEW_H);

  let sx = 0, sy = 0;
  if (shakeAmp > 0) { sx = (Math.random() * 2 - 1) * shakeAmp; sy = (Math.random() * 2 - 1) * shakeAmp; }

  ctx.save();
  ctx.translate(sx, sy);

  streetStats.quads = 0; streetStats.buildings = 0; streetStats.blits = 0;
  const fogColorNow = zoneDataFor(zoneKeyFor(zoneIndex)).sky[2];

  drawSkyAndSkyline();
  drawRoad();
  // v0.4 (2.2): street base (ground/pavement/kerb/road-edge lines) comes
  // right after the road - the yellow edge lines have to sit on the
  // asphalt, which they can't do if drawn first.
  drawKLStreetBase(ctx, streetP, distance, districtAt, streetStats);
  drawScrollMarks(-0.5, 9, 3, 0.035, PALETTE.mark);
  drawScrollMarks(0.5, 9, 3, 0.035, PALETTE.mark);
  // pedestrian crossings under every active gate/viaduct in a walkable district
  for (let i = 0; i < gates.length; i++) {
    if (!gates[i].active) continue;
    const dk = districtAt(distance + gates[i].z);
    if (dk === 'bukitBintang' || dk === 'petalingStreet') drawKLCrossing(ctx, streetP, gates[i].z, '#d8b21e');
  }
  for (let i = 0; i < viaducts.length; i++) {
    if (!viaducts[i].active) continue;
    const dk = districtAt(distance + viaducts[i].z);
    if (dk === 'bukitBintang' || dk === 'petalingStreet') drawKLCrossing(ctx, streetP, viaducts[i].z, '#d8b21e');
  }
  drawEsplanadePools();
  drawKLStreetSides(ctx, streetP, distance, districtAt, fogColorNow, streetAssets, streetStats, runTime);

  const n = collectAndSort();
  for (let i = 0; i < n; i++) {
    const s = drawScratch[i];
    if (s.kind === 'o') drawObstacle(s.ref);
    else if (s.kind === 'p') drawPickup(s.ref);
    else if (s.kind === 'g') drawGate(s.ref);
    else if (s.kind === 'v') drawViaduct(s.ref);
    else if (s.kind === 'fog') drawFogBand();
    else drawPlayer();
  }

  drawPopups();
  ctx.restore();

  if (flashAmp > 0) {
    ctx.fillStyle = PALETTE.bonus;
    ctx.globalAlpha = flashAmp * 0.25;
    ctx.fillRect(0, 0, 360, VIEW_H);
    ctx.globalAlpha = 1;
  }

  drawHUD();
  drawZoneBanner();
  drawScreens();
  if (debugOn) drawDebug();
}

/* ============================================================
   HUD / SCREENS
   ============================================================ */
function drawMuteButton() {
  const r = muteRect;
  ctx.strokeStyle = PALETTE.text;
  ctx.lineWidth = 1.5;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.beginPath();
  ctx.moveTo(cx - 10, cy - 5); ctx.lineTo(cx - 4, cy - 5); ctx.lineTo(cx + 4, cy - 11);
  ctx.lineTo(cx + 4, cy + 11); ctx.lineTo(cx - 4, cy + 5); ctx.lineTo(cx - 10, cy + 5);
  ctx.closePath(); ctx.stroke();
  if (!muted) {
    ctx.beginPath(); ctx.arc(cx + 8, cy, 6, -0.6, 0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 8, cy, 10, -0.7, 0.7); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx + 14, cy + 12); ctx.stroke();
  }
}

// v0.3 (KL rework, section 4): full-width banner retired - it covered the
// skyline exactly when a new landmark appeared, the one moment it should be
// showing off. Replaced with a single small line under the score, no
// background, fading in and out over the zone's whole ZONE_BANNER_DUR.
function drawZoneBanner() {
  if (state !== 'PLAYING') return;
  if (zoneAtIndex(zoneIndex).silent) return;
  // v0.4.4 (audit P1 #4): delayed relative to the skyline crossfade (which
  // starts immediately at the boundary, unchanged) so the title only
  // appears once the new zone's skyline is recognisably present, instead
  // of announcing "KLCC" the instant the boundary is crossed while Dataran
  // Merdeka's building is still the dominant thing on screen.
  const bannerDelayMs = CONFIG.ZONE_FADE_DUR * 1000 * 0.55;
  const elapsed = performance.now() - bannerStartMs - bannerDelayMs;
  const durMs = CONFIG.ZONE_BANNER_DUR * 1000;
  if (elapsed < 0 || elapsed > durMs) return;
  const fadeIn = 150, fadeOut = 400;
  let alpha = 1;
  if (elapsed < fadeIn) alpha = elapsed / fadeIn;
  else if (elapsed > durMs - fadeOut) alpha = Math.max(0, (durMs - elapsed) / fadeOut);

  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.fillStyle = PALETTE.mark;
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillText('ZONE ' + announcedZoneOrdinal(zoneIndex) + ' - ' + bannerZoneName.toUpperCase(), 180, 82);
  ctx.globalAlpha = 1;
}

function drawHUD() {
  if (state !== 'PLAYING' && state !== 'DEAD') return;
  const score = state === 'DEAD' ? finalScore : Math.floor(distance) + bonusTotal;
  ctx.textAlign = 'center';
  ctx.fillStyle = PALETTE.text;
  ctx.font = 'bold 32px system-ui, sans-serif';
  ctx.fillText(String(score), 180, 46);

  ctx.textAlign = 'left';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText('BEST ' + bestScore, 10, 24);

  if (combo > 1 && state === 'PLAYING') {
    ctx.textAlign = 'center';
    ctx.fillStyle = PALETTE.bonus;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('x' + combo, 180, 66);
  }
  drawMuteButton();
}

function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' ');
  let line = '';
  const lines = [];
  for (let i = 0; i < words.length; i++) {
    const test = line ? (line + ' ' + words[i]) : words[i];
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
    else line = test;
  }
  if (line) lines.push(line);
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, y + i * lh);
}

function drawScreens() {
  if (state === 'READY') {
    // v0.4.4 (audit P2 #12): bounded panel behind the READY text instead of
    // relying only on a uniform screen tint - shop signage and road detail
    // were still cutting through the instructional hierarchy underneath it.
    ctx.fillStyle = 'rgba(11,13,18,0.45)';
    ctx.fillRect(0, 0, 360, VIEW_H);
    const panelY = VIEW_H * 0.30, panelH = VIEW_H * 0.38;
    ctx.fillStyle = 'rgba(8,10,14,0.82)';
    drawRoundedRect(ctx, 24, panelY, 312, panelH, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = PALETTE.text;
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText('LANES', 180, panelY + panelH * 0.28);

    const elapsed = performance.now() - readyStartMs;
    const fadeStart = 3000, fadeDur = 300;
    const alpha = elapsed < fadeStart ? 1 : Math.max(0, 1 - (elapsed - fadeStart) / fadeDur);
    if (alpha > 0) {
      ctx.globalAlpha = alpha;
      ctx.font = '14px system-ui, sans-serif';
      wrapText('TAP left / right to change lane. Dodge LATE for bonus.', 180, panelY + panelH * 0.28 + 40, 270, 18);
      ctx.globalAlpha = 1;
    }
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillText('TAP TO START', 180, panelY + panelH * 0.82);
    drawMuteButton();
  } else if (state === 'PAUSED') {
    ctx.fillStyle = 'rgba(11,13,18,0.75)';
    ctx.fillRect(0, 0, 360, VIEW_H);
    ctx.textAlign = 'center';
    ctx.fillStyle = PALETTE.text;
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillText('TAP TO RESUME', 180, VIEW_H / 2);
  } else if (state === 'DEAD') {
    const elapsed = performance.now() - lastDeathMs;
    if (elapsed < 100) return; // hit-stop: world stays visible, frozen, no panel yet
    const panelAlpha = Math.min(1, (elapsed - 100) / 150);
    ctx.globalAlpha = panelAlpha;
    ctx.fillStyle = 'rgba(11,13,18,0.82)';
    ctx.fillRect(0, 0, 360, VIEW_H);
    ctx.textAlign = 'center';
    ctx.fillStyle = PALETTE.text;
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(String(finalScore), 180, VIEW_H * 0.34);
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillText('BEST ' + bestScore, 180, VIEW_H * 0.34 + 26);
    ctx.fillStyle = isNewBest ? PALETTE.bonus : PALETTE.mark;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText(isNewBest ? 'NEW BEST' : (Math.max(0, bestScore - finalScore) + ' FROM BEST'), 180, VIEW_H * 0.34 + 50);
    // v0.3 (G2): furthest zone reached - zoneIndex only ever increases within
    // a run, so its value at death is exactly that. This is the screenshot
    // line the doc called out; the run number below it is secondary.
    if (lastAnnouncedZoneIndex >= 0) {
      ctx.fillStyle = PALETTE.text;
      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.fillText('REACHED ' + zoneAtIndex(lastAnnouncedZoneIndex).name.toUpperCase(), 180, VIEW_H * 0.34 + 72);
    }
    ctx.fillStyle = PALETTE.mark;
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillText('run #' + runCount, 180, VIEW_H * 0.34 + 92);
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillText('TAP TO RETRY', 180, VIEW_H * 0.6);
    ctx.globalAlpha = 1;
    drawMuteButton();
  }
}

/* ============================================================
   AUDIO
   ============================================================ */
let audioStarted = false;
let audioCtx = null;
function ensureAudio() {
  if (audioStarted) { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); return; }
  audioStarted = true;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
}
function playTone(freq, dur, type, glideTo) {
  if (muted || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, audioCtx.currentTime + dur);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur + 0.02);
  } catch (e) {}
}
function playBonusBlip(comboVal) {
  const freq = 440 * Math.pow(2, Math.min(comboVal, 12) / 12);
  playTone(freq, 0.06, 'square');
}
function playDeathSound() { playTone(300, 0.25, 'sawtooth', 80); }
function playZoneChime() {
  if (muted || !audioCtx) return;
  playTone(660, 0.09, 'square');
  setTimeout(function () { playTone(880, 0.12, 'square'); }, 90);
}
function playNewBestSound() {
  if (muted || !audioCtx) return;
  const notes = [523.25, 659.25, 783.99];
  for (let i = 0; i < notes.length; i++) {
    setTimeout((function (f) { return function () { playTone(f, 0.12, 'square'); }; })(notes[i]), i * 90);
  }
}

/* ============================================================
   METRICS / DEBUG
   ============================================================ */
let fps = 60, fpsFrames = 0, fpsTimer = 0;
function updateFPS(dt) {
  fpsFrames++; fpsTimer += dt;
  if (fpsTimer >= 1) { fps = fpsFrames / fpsTimer; fpsFrames = 0; fpsTimer = 0; }
}

const runDurations = [];
const retryLatencies = [];
let cachedAvgDur = 0, cachedMedDur = 0, cachedAvgLatency = 0;
function recomputeDebugStats() {
  cachedAvgDur = avg(runDurations);
  cachedMedDur = median(runDurations);
  cachedAvgLatency = avg(retryLatencies);
}

function drawDebug() {
  const lines = [
    'FPS ' + fps.toFixed(0),
    'speed ' + curSpeed.toFixed(1) + '  rowGapT ' + curRowGapT.toFixed(2),
    'distance ' + distance.toFixed(0) + '  combo ' + combo,
    'seed ' + currentSeed,
    'zone ' + debugZoneLabel(zoneKeyFor(zoneIndex)) + ' from ' + debugZoneLabel(prevZoneKey),
    'skyScale ' + klSkyScale.toFixed(2) + '  bake ' + klBakeFactor + 'x  roadside ' + roadsideBlitCount + '/frame',
    'street quads ' + streetStats.quads + '  buildings ' + streetStats.buildings + '  blits ' + streetStats.blits,
    'overrides ' + overridesStr,
    'runs ' + session.runs.length + '  retries ' + Math.max(0, session.runs.length - 1),
    'avg dur ' + cachedAvgDur.toFixed(1) + 's  med ' + cachedMedDur.toFixed(1) + 's',
    'avg retry latency ' + cachedAvgLatency.toFixed(0) + 'ms',
    'best ' + bestScore,
    'deaths static ' + (deathCauseCounts.static || 0) + '  cutter ' + (deathCauseCounts.cutter || 0)
  ];
  ctx.textAlign = 'left';
  ctx.font = '11px monospace';
  const boxH = 14 * lines.length + 34;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(4, VIEW_H - boxH - 4, 226, boxH);
  ctx.fillStyle = '#8f8';
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 10, VIEW_H - boxH + 12 + i * 14);

  const btnX = 10, btnY = VIEW_H - 24, btnW = 96, btnH = 20;
  ctx.fillStyle = '#333'; ctx.fillRect(btnX, btnY, btnW, btnH);
  ctx.fillStyle = '#fff'; ctx.font = '11px system-ui, sans-serif';
  ctx.fillText('COPY STATS', btnX + 6, btnY + 14);
  debugCopyBtn = { x: btnX, y: btnY, w: btnW, h: btnH };
}

function copyStats() {
  const json = JSON.stringify(session, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).catch(function () { showStatsFallback(json); });
  } else {
    showStatsFallback(json);
  }
}
function showStatsFallback(json) {
  document.getElementById('statsText').value = json;
  document.getElementById('statsBox').style.display = 'block';
}
document.getElementById('statsClose').addEventListener('click', function () {
  document.getElementById('statsBox').style.display = 'none';
});

/* ============================================================
   BOOT
   ============================================================ */
loadPersisted();
buildSprites();
buildSkylineSprites();
// v0.4: street furniture (blade signs) baked once at boot; palm/tree came
// from the landmark pack's own bake and are attached right after, then
// kept in sync by maybeRebuildKLSkyline whenever that rebakes.
streetAssets = buildKLStreetAssets(makeCanvas, 2);
if (klBaked) { streetAssets.palm = klBaked.palm; streetAssets.tree = klBaked.tree; }
// v0.4 (2.2 budget note): measured peaks over a full run exceeded the
// 650-quad/frame target (Bukit Bintang ~714, Jalan Petaling ~718, Batu
// Caves ~655) at the pack's default LOD thresholds. Per the spec's own
// guidance, tuning these down is the first fix, not removing roofs/
// pavement - and this is a runtime override from the game side, not an
// edit to the pasted kl-street.js content itself.
KL_STREET.LOD_NEAR = 42; KL_STREET.LOD_MID = 75; KL_STREET.LOD_FAR = 120;
if (params.has('selftest')) runSelfTest();

let lastFrameTs = null, accumulator = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  if (lastFrameTs === null) lastFrameTs = ts;
  let delta = (ts - lastFrameTs) / 1000;
  lastFrameTs = ts;
  delta = Math.min(delta, 0.1);

  cosmeticUpdate(delta);
  updateFPS(delta);

  if (state === 'PLAYING') {
    accumulator += delta;
    let steps = 0;
    while (accumulator >= FIXED_DT && steps < 5) {
      fixedUpdate(FIXED_DT);
      accumulator -= FIXED_DT;
      steps++;
      if (state !== 'PLAYING') break;
    }
  } else {
    accumulator = 0;
  }

  render();
}

readyStartMs = performance.now();
requestAnimationFrame(frame);

window.addEventListener('pagehide', function () {
  persistSession();
  sendRemoteLog();
});

})();
</script>
