function beginRun(isFirst) {
  runCount += 1;
  const nowMs = performance.now();
  const retryLatencyMs = isFirst ? null : Math.round(nowMs - lastDeathMs);
  currentSeed = pickSeedForRun();
  rng = mulberry32(currentSeed);
  distance = 0; nextRowDist = 90; runTime = 0; bonusTotal = 0; combo = 0; timeSinceLastNearMiss = 0;
  zoneIndex = -1; lastAnnouncedZoneIndex = -1; prevZoneKey = 'neutral';
  bannerZoneName = ''; bannerStartMs = -1e9; zoneTransitionStartMs = -1e9;
  prevOpenLanes = [-1, 0, 1];
  player.x = 0; player.targetLane = 0; player.tweenFrom = 0; player.tweenTo = 0; player.tweenStart = 0;
  deactivateWorld();
  // v0.3 (KL rework, section 4): zone 0's boundary is at distance 0, already
  // "past" before any lookahead spawn could fire, so its gate is placed
  // directly here instead of through the normal boundary check below.
  // v0.4 (fix #6): z=60 put the station roof across the screen for the
  // opening ~2s of every run; z=120 lets the skyline read first, station
  // still clearly approaching.
  spawnGate(0, 120);
  nextGateZoneIndex = 1;
  nextViaductDist = CONFIG.ZONE_DIST * 0.5;
  klsResetRoadworksSigns();
  lastRoadworksReqDist = -1e9;
  currentRun = { n: runCount, seed: currentSeed, retryLatencyMs: retryLatencyMs };
  isNewBest = false;
  state = 'PLAYING';
  accumulator = 0;
  lastFrameTs = null;
}

function spawnPopup(x, y, text, color) {
  let slot = null;
  for (let i = 0; i < popups.length; i++) { if (!popups[i].active) { slot = popups[i]; break; } }
  if (!slot) { slot = popups[popupCursor]; popupCursor = (popupCursor + 1) % popups.length; }
  slot.active = true; slot.x = x; slot.y = y; slot.text = text; slot.color = color; slot.t = 0; slot.life = 0.6;
}

function awardNearMiss(minTTI) {
  const insane = minTTI <= CONFIG.NEAR_TTI_INSANE;
  const base = insane ? CONFIG.NEAR_BONUS * 2 : CONFIG.NEAR_BONUS;
  combo += 1;
  timeSinceLastNearMiss = 0;
  const awarded = base * combo;
  bonusTotal += awarded;
  const label = insane ? 'CLOSE!!' : 'CLOSE';
  const text = combo > 1 ? (label + ' x' + combo + ' +' + awarded) : (label + ' +' + awarded);
  spawnPopup(screenX(player.x, 0), screenY(0) - 30, text, '#3dff8b');
  flashAmp = 1; flashStartMs = performance.now();
  playBonusBlip(combo);
  if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
}
function collectPickup(p) {
  p.active = false;
  bonusTotal += CONFIG.PICKUP_VALUE;
  spawnPopup(screenX(player.x, 0), screenY(0) - 30, '+' + CONFIG.PICKUP_VALUE, '#3dff8b');
  flashAmp = 1; flashStartMs = performance.now();
  playBonusBlip(combo);
  if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
}

function triggerDeath(cause) {
  state = 'DEAD';
  lastDeathMs = performance.now();
  deathCause = cause;
  finalScore = Math.floor(distance) + bonusTotal;
  deathCauseCounts[cause] = (deathCauseCounts[cause] || 0) + 1;
  currentRun.durationS = Math.round(runTime * 100) / 100;
  currentRun.score = finalScore;
  currentRun.deathCause = cause;
  session.runs.push(Object.assign({}, currentRun));
  if (session.runs.length > 200) session.runs.shift();
  session.lastActivityAt = Date.now();
  runDurations.push(currentRun.durationS);
  if (currentRun.retryLatencyMs != null) retryLatencies.push(currentRun.retryLatencyMs);
  recomputeDebugStats();
  isNewBest = finalScore > bestScore;
  if (isNewBest) { bestScore = finalScore; saveBest(); }
  shakeAmp = 8; shakeStartMs = performance.now();
  playDeathSound();
  if (isNewBest) setTimeout(playNewBestSound, 260);
  if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
  persistSession();
  sendRemoteLog();
}

function updatePlayerTween() {
  if (player.x !== player.tweenTo) {
    const t = clamp((runTime - player.tweenStart) / CONFIG.LANE_CHANGE_T, 0, 1);
    const eased = 1 - (1 - t) * (1 - t);
    player.x = player.tweenFrom + (player.tweenTo - player.tweenFrom) * eased;
    if (t >= 1) player.x = player.tweenTo;
  }
}

function updateObstacles(dt) {
  let killedThisStep = false;
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (!o.active) continue;
    o.z -= curSpeed * dt;

    if (o.kind === 'cutter') {
      if (o.phase === 'idle') {
        // v0.3 (R9): time-to-impact trigger instead of a fixed distance, so
        // warning time stays constant as speed ramps up (previously it
        // halved from 1.9s to 0.97s right when rows also got densest).
        const triggerZ = curSpeed > 0 ? Math.min(curSpeed * CONFIG.CUTTER_TRIGGER_TTI, CONFIG.Z_SPAWN - 10) : CONFIG.Z_SPAWN - 10;
        if (o.z < triggerZ) {
          // Always consume the same two RNG draws regardless of player state,
          // so the rest of the level sequence stays deterministic for a given
          // seed even though this cutter's own target reacts to the player.
          const aimRoll = rng() < CONFIG.CUTTER_AIM;
          const adj = adjacentLanes(o.lane);
          const fallbackPick = adj[Math.floor(rng() * adj.length)];
          const target = (aimRoll && adj.indexOf(player.targetLane) !== -1) ? player.targetLane : fallbackPick;
          o.targetLane = target;
          o.phase = 'telegraph';
          o.telegraphElapsed = 0;
        }
      } else if (o.phase === 'telegraph') {
        o.telegraphElapsed += dt;
        if (o.telegraphElapsed >= CONFIG.CUTTER_TELEGRAPH) {
          o.phase = 'moving'; o.moveElapsed = 0; o.fromX = o.lane; o.toX = o.targetLane;
        }
      } else if (o.phase === 'moving') {
        o.moveElapsed += dt;
        const frac = Math.min(1, o.moveElapsed / CONFIG.CUTTER_MOVE_T);
        o.x = o.fromX + (o.toX - o.fromX) * frac;
        if (frac >= 1) { o.phase = 'done'; o.lane = o.targetLane; o.x = o.toX; }
      }
    }

    let hit = false;
    if (!killedThisStep) {
      const dx = Math.abs(player.x - o.x);
      hit = dx < 2 * CONFIG.HITBOX_X && o.z < CONFIG.CAR_LEN && (o.z + o.len) > 0;
      if (hit) {
        killedThisStep = true;
        triggerDeath(o.kind === 'cutter' ? 'cutter' : 'static');
      } else if (curSpeed > 0) {
        const tti = o.z / curSpeed;
        if (tti > 0 && tti <= CONFIG.NEAR_TTI && dx < 2 * CONFIG.HITBOX_X) {
          o.threat = true;
          if (tti < o.minTTI) o.minTTI = tti;
        }
      }
    }

    if (!hit && o.threat && !o.nearMissCounted && (o.z + o.len) < 0) {
      awardNearMiss(o.minTTI);
      o.nearMissCounted = true;
    }
    // v0.3 (R3): recycle on the derived near plane, then also check whether
    // the billboard's own top edge has scrolled below the screen - a tall
    // billboard can still have part of itself on screen even once its base
    // (o.z) has passed Z_NEAR, so the fixed -8 was recycling objects that
    // were, in the old flat-decal render, already invisible anyway, but
    // would pop under the new upright billboards without this check.
    if (o.z < Z_NEAR) {
      o.active = false;
    } else {
      const vk = o.kind === 'cutter' ? 'hatchback' : o.visual;
      if (billboardTopY(o.z, vk) > VIEW_H) o.active = false;
    }
    if (killedThisStep) break;
  }
  return killedThisStep;
}

function updatePickups(dt) {
  for (let i = 0; i < pickups.length; i++) {
    const p = pickups[i];
    if (!p.active) continue;
    p.z -= curSpeed * dt;
    if (Math.abs(player.x - p.x) < 0.5 && p.z > 0 && p.z < CONFIG.CAR_LEN) { collectPickup(p); continue; }
    if (p.z < Z_NEAR) p.active = false;
  }
}

function fixedUpdate(dt) {
  runTime += dt;
  curSpeed = Math.min(CONFIG.SPEED_MAX, CONFIG.SPEED_START + CONFIG.SPEED_RAMP * runTime);
  curK = clamp(runTime / CONFIG.RAMP_TIME, 0, 1);
  curRowGapT = lerp(CONFIG.ROW_GAP_T_START, CONFIG.ROW_GAP_T_MIN, curK);
  distance += curSpeed * dt;

  // v0.3 (G1): dropped the "- 1" offset, so zone 0 (Bukit Bintang) begins at
  // distance 0 instead of at ZONE_DIST. zoneIndex starts at -1 (see beginRun),
  // so the very first fixedUpdate tick still fires the normal zone-enter path
  // (crossfade + chime + banner) straight into Bukit Bintang instead of a
  // silent generic skyline for the first ~15s of every run.
  const newZoneIndex = Math.floor(distance / CONFIG.ZONE_DIST);
  if (newZoneIndex > zoneIndex) {
    prevZoneKey = zoneKeyFor(zoneIndex);
    zoneIndex = newZoneIndex;
    const enteredZone = zoneAtIndex(zoneIndex);
    zoneTransitionStartMs = performance.now();
    if (!enteredZone.silent) {
      lastAnnouncedZoneIndex = zoneIndex;
      bannerZoneName = enteredZone.name;
      bannerStartMs = zoneTransitionStartMs;
      playZoneChime();
    } else {
      bannerZoneName = '';
      bannerStartMs = -1e9;
    }
  }

  // v0.3 (KL rework, section 4): gate spawns by distance lookahead, not by
  // the gameplay RNG, so it scrolls in like any other billboard well before
  // the player actually crosses the boundary.
  while (distance + CONFIG.Z_SPAWN >= nextGateZoneIndex * CONFIG.ZONE_DIST) {
    spawnGate(nextGateZoneIndex, CONFIG.Z_SPAWN);
    nextGateZoneIndex++;
  }
  // v0.3 (5A): plain viaduct, once per Bukit Bintang occurrence. Jumps a
  // full loop (all 5 zones) ahead after spawning, since Bukit Bintang only
  // recurs every KL_ZONES.length * ZONE_DIST.
  if (distance + CONFIG.Z_SPAWN >= nextViaductDist) {
    spawnViaduct(CONFIG.Z_SPAWN, 1, 7);
    nextViaductDist += KL_ZONES.length * CONFIG.ZONE_DIST;
  }

  let guard = 0;
  while (distance + CONFIG.Z_SPAWN >= nextRowDist && guard < 10) {
    spawnRow();
    nextRowDist += curSpeed * curRowGapT;
    guard++;
  }

  updatePlayerTween();
  const died = updateObstacles(dt);
  if (died) return;
  updatePickups(dt);
  updateGates(dt);
  updateViaducts(dt);

  if (combo > 0) {
    timeSinceLastNearMiss += dt;
    if (timeSinceLastNearMiss >= CONFIG.COMBO_WINDOW) combo = 0;
  }
}

function cosmeticUpdate(dt) {
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    if (!p.active) continue;
    p.t += dt;
    if (p.t >= p.life) p.active = false;
  }
  if (shakeAmp > 0) {
    const el = performance.now() - shakeStartMs;
    shakeAmp = Math.max(0, 8 * (1 - el / 250));
  }
  if (flashAmp > 0) {
    const el = performance.now() - flashStartMs;
    flashAmp = Math.max(0, 1 - el / 120);
  }
}

/* ============================================================
   RENDER
   ============================================================ */
const PALETTE = {
  bg: '#0b0d12', road: '#262b36', mark: '#8a93a6', player: '#e8f1ff',
  danger: '#ff4d4d', cutter: '#ff8a4d', pickup: '#6ff2e6', bonus: '#3dff8b', text: '#ffffff'
};

// v0.3 (R1): per-visual billboard size, in lane units (w/h), replacing the
// single shared OBST_VISUAL_HALF_W. Distinct silhouettes (wide-low vs
// narrow-tall vs striped board) are the point - they're what has to read at
// 16px, not surface detail. `color` is now the far-distance LOD fallback
// fill (drawBillboard drops to it under ~12px, where the real sprite would
// just be blurred mush) rather than the placeholder art itself - R2 shipped
// the real rear-view sprites, drawn via drawImage above that threshold.
const VISUAL_SIZE = {
  playerCar: { w: 0.80, h: 0.62, color: '#dfe7f2' },
  hatchback: { w: 0.74, h: 0.70, color: PALETTE.cutter },
  kapcai:    { w: 0.42, h: 0.86, color: '#2e6cff' },
  barrier:   { w: 0.86, h: 0.52, color: '#d97a35' },
  coneRow:   { w: 0.80, h: 0.42, color: '#ff8a3d' }
};

// top edge (screen y) of a billboard at world depth z, used to recycle
// objects once they've fully scrolled past the bottom of the screen (R3) -
// checking the top edge rather than a fixed z, since a tall billboard can
// still show part of itself on screen after its base (o.z) passes Z_NEAR.
function billboardTopY(z, visualKey) {
  const sz = VISUAL_SIZE[visualKey] || VISUAL_SIZE.hatchback;
  return screenY(z) - sz.h * CONFIG.LANE_W * sOf(z);
}

function drawSpanRect(xCenter, halfW, z0, len, color) {
  const zFar = z0 + len, zNear = z0;
  const yTop = screenY(zFar), yBot = screenY(zNear);
  if (yBot <= yTop) return;
  const wPx = widthPx(halfW * 2, zNear);
  const cx = screenX(xCenter, zNear);
  ctx.fillStyle = color;
  ctx.fillRect(cx - wPx / 2, yTop, Math.max(1, wPx), yBot - yTop);
}

// v0.4 (fix #2): a TRUE perspective quad - width computed independently at
// the near and far edge, not a single width stretched over the whole span.
// drawSpanRect drew every dash/strip as an axis-aligned rectangle sized
// from the near edge alone, which is why the danger strip read as a flat
// carpet and dashes stair-stepped close to the camera.
function drawSpanQuad(xCenter, halfW, z0, len, color) {
  const zFar = z0 + len, zNear = z0;
  const yTop = screenY(zFar), yBot = screenY(zNear);
  if (yBot <= yTop) return;
  const wTop = widthPx(halfW * 2, zFar), wBot = widthPx(halfW * 2, zNear);
  const cxTop = screenX(xCenter, zFar), cxBot = screenX(xCenter, zNear);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cxBot - wBot / 2, yBot);
  ctx.lineTo(cxBot + wBot / 2, yBot);
  ctx.lineTo(cxTop + wTop / 2, yTop);
  ctx.lineTo(cxTop - wTop / 2, yTop);
  ctx.closePath();
  ctx.fill();
}

function drawScrollMarks(xUnit, spacing, len, halfW, color) {
  const phase = ((distance % spacing) + spacing) % spacing;
  const iStart = Math.floor((Z_NEAR + phase) / spacing) - 1;
  const iEnd = Math.ceil((CONFIG.Z_FAR + phase) / spacing) + 1;
  for (let i = iStart; i <= iEnd; i++) {
    const z0 = i * spacing - phase;
    if (z0 + len < Z_NEAR || z0 > CONFIG.Z_FAR) continue;
    drawSpanQuad(xUnit, halfW, z0, len, color);
  }
}

function drawRoad() {
  ctx.fillStyle = PALETTE.road;
  ctx.beginPath();
  ctx.moveTo(screenX(-1.5, CONFIG.Z_FAR), screenY(CONFIG.Z_FAR));
  ctx.lineTo(screenX(1.5, CONFIG.Z_FAR), screenY(CONFIG.Z_FAR));
  ctx.lineTo(screenX(1.5, Z_NEAR), screenY(Z_NEAR));
  ctx.lineTo(screenX(-1.5, Z_NEAR), screenY(Z_NEAR));
  ctx.closePath();
  ctx.fill();
}

// v0.4 (2.2/section 3): kerb, lamp posts and shop-block cards are gone -
// the street pack (kl-street.js, drawKLStreetBase/drawKLStreetSides) now
// owns the kerb, pavement, lamps and buildings, per district. Drawing
// camera-facing building cards in depth was the root cause of the
// "staircase" artifact fixed last pass; the real fix was always going to
// be replacing the geometry, not re-skinning the cards - see v0.4 spec
// section 1.

// v0.3 (7.6): parody ad text - generic words only, no real business names
// (hard content rule #5). One board in ten is left as the plain
// "advertise here" placeholder. `propHash` is a stable, non-gameplay
// pseudo-random pick keyed to the sign's fixed world position (not the
// seeded RNG, and not per-frame - the same physical sign keeps the same
// text as it scrolls from the horizon to the player).
function propHash(n) { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
const AD_WORDS = ['SALE 50%', 'NOW OPEN', 'GRAND OPENING', 'BEST DEALS', 'PROMOSI HEBAT', 'DISKAUN BESAR', 'MENU BARU', 'JOM MAKAN'];
function adTextFor(worldSlot) {
  const h = propHash(worldSlot);
  if (h < 0.1) return 'IKLAN DI SINI';
  return AD_WORDS[Math.floor(h * 733) % AD_WORDS.length];
}

function drawSignBillboard(xLane, z) {
  const s = sOf(z);
  const baseX = screenX(xLane, z), baseY = screenY(z);
  const poleH = 1.05 * CONFIG.LANE_W * s, poleW = Math.max(1, 0.05 * CONFIG.LANE_W * s);
  ctx.fillStyle = '#20242c';
  ctx.fillRect(baseX - poleW / 2, baseY - poleH, poleW, poleH);
  const panelW = 1.5 * CONFIG.LANE_W * s, panelH = 0.55 * CONFIG.LANE_W * s;
  const panelCY = baseY - poleH - panelH * 0.52;
  const glow = zoneDataFor(zoneKeyFor(zoneIndex)).glow;
  ctx.fillStyle = '#12141a';
  drawRoundedRect(ctx, baseX - panelW / 2, panelCY - panelH / 2, panelW, panelH, Math.min(3, panelW * 0.05));
  ctx.fill();
  ctx.strokeStyle = rgba(glow, 0.55);
  ctx.lineWidth = Math.max(1, panelW * 0.025);
  ctx.stroke();
  if (panelH > 6) {
    const text = adTextFor(Math.round((distance + z) / 168));
    ctx.fillStyle = rgba(glow, 0.9);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (panelH * 0.26).toFixed(1) + 'px system-ui, sans-serif';
    wrapText(text, baseX, panelCY, panelW * 0.86, panelH * 0.30);
  }
}

let roadsideBlitCount = 0; // v0.3 (KL rework, debug overlay): roadside blits this frame
// v0.3 (KL rework, section 4): zone gates. All three types are billboards
// centred on x = 0, faded in like any other billboard (CONFIG.Z_SPAWN
// lookahead), drawn as part of the normal far-to-near z-sort - see
// drawGate() / collectAndSort. No collision, no danger strip.
// v0.4.4 (audit P1 #2): size no longer tracks z past s=1 (the player's own
// depth) - previously the panel/arch kept scaling up as the player passed
// underneath (z<0 briefly pushes s above 1), so for a few frames it filled
// most of the screen and read as a wall rather than an overhead sign. Size
// now clamps at the player's own scale; position still tracks the real z
// so the gate keeps moving correctly. A fast fade once z<0 additionally
// dissolves it out instead of leaving a large flat shape hanging overhead.
function gateCloseFade(z) { return z < 0 ? clamp(1 + z / 15, 0.12, 1) : 1; }

function drawPetalingGate(z, name, alpha) {
  const s = sOf(z), sSize = Math.min(s, 1.05), cx = screenX(0, z), baseY = screenY(z);
  const a = alpha * gateCloseFade(z);
  const sl = KL_LANDMARKS.petalingGate;
  const wPx = CONFIG.GATE_W_LANES * CONFIG.LANE_W * sSize;
  const hPx = wPx * sl.h / sl.w;
  drawBakedScaled(ctx, klBaked.gate, cx, baseY, hPx, a);
  const tb = sl.textBox, k = hPx / sl.h;
  if (tb && tb.h * k > 5) {
    ctx.globalAlpha = a; ctx.fillStyle = '#e8c56a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (tb.h * k * 0.55).toFixed(1) + 'px system-ui, sans-serif';
    ctx.fillText(name.toUpperCase(), cx + (tb.x + tb.w / 2 - sl.w / 2) * k, baseY - (sl.h - tb.y - tb.h / 2) * k);
    ctx.globalAlpha = 1;
  }
}

// Pack-defined drive-through landmarks (Kasturi Walk and Little India).
// Their authored gateWLanes value controls road clearance and preserves the
// proportions of each supplied illustration at every perspective depth.
function drawPackGate(gateType, z, alpha) {
  const sprite = klBaked.gates && klBaked.gates[gateType];
  const lm = KL_LANDMARKS[gateType];
  if (!sprite || !lm) return 3.0;
  const sSize = Math.min(sOf(z), 1.05), cx = screenX(0, z), baseY = screenY(z);
  const a = alpha * gateCloseFade(z);
  const widthLanes = lm.gateWLanes || CONFIG.GATE_W_LANES;
  const wPx = widthLanes * CONFIG.LANE_W * sSize;
  const hPx = wPx * lm.h / lm.w;
  drawBakedScaled(ctx, sprite, cx, baseY, hPx, a);
  return hPx / (CONFIG.LANE_W * sSize) + 0.35;
}

// generic overhead road-sign gantry, used by every zone that isn't Bukit
// Bintang (monorail station) or Jalan Petaling (its own arch). Panel colour
// is a placeholder (CONFIG.GANTRY_COLOR) - project owner to confirm the
// correct local signage colour, per the spec's own note not to invent one.
// v0.4.2 (2.3): panel colour follows the Malaysian road-sign convention -
// blue for ordinary roads, maroon for tourist places (green would read as
// an expressway, which none of these zones are). Bukit Bintang and Jalan
// Petaling never reach here - they use their own station/arch gates.
const GANTRY_COLOR_BY_ZONE = { klcc: '#1b3d8f', dataranMerdeka: '#7a2a16', batuCaves: '#7a2a16' };
function drawGantryGate(z, name, alpha, zoneKey) {
  const s = sOf(z), sSize = Math.min(s, 1.05), cx = screenX(0, z), baseY = screenY(z);
  const a = alpha * gateCloseFade(z);
  // v0.4.4 (audit P1 #2): postH raised 2.6 -> 3.1 lane units for a clearer
  // gap between the panel and the road, and every size below now uses the
  // clamped sSize instead of the raw (unbounded past z=0) s.
  const wPx = CONFIG.GATE_W_LANES * CONFIG.LANE_W * sSize;
  const postW = Math.max(1, 0.06 * CONFIG.LANE_W * sSize);
  const postH = 3.1 * CONFIG.LANE_W * sSize;
  const trussH = Math.max(1, 0.14 * CONFIG.LANE_W * sSize);
  const panelH = 0.55 * CONFIG.LANE_W * sSize;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#6b7280';
  ctx.fillRect(cx - wPx / 2 - postW, baseY - postH, postW, postH);
  ctx.fillRect(cx + wPx / 2, baseY - postH, postW, postH);
  ctx.fillRect(cx - wPx / 2 - postW, baseY - postH - trussH, wPx + 2 * postW, trussH);
  const panelY = baseY - postH - trussH - panelH * 0.5;
  ctx.fillStyle = GANTRY_COLOR_BY_ZONE[zoneKey] || CONFIG.GANTRY_COLOR;
  drawRoundedRect(ctx, cx - wPx / 2, panelY - panelH / 2, wPx, panelH, Math.min(3, wPx * 0.02));
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1, wPx * 0.01);
  ctx.stroke();
  if (panelH > 5) {
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (panelH * 0.5).toFixed(1) + 'px system-ui, sans-serif';
    ctx.fillText(name.toUpperCase(), cx, panelY);
  }
  ctx.globalAlpha = 1;
}

// v0.4.4 (audit P1 #3): a small "NEXT" tag above every approaching gate -
// the gate itself already shows the destination's name, which previously
// looked identical to a current-location label and could contradict the
// HUD (e.g. HUD says "JALAN PETALING" while the biggest object on screen
// says "DATARAN MERDEKA"). Disappears just before the player reaches the
// gate, since at that point it stops being "next" and becomes "here".
function drawNextBadge(z, alpha, topOffset) {
  if (z <= 2) return;
  const s = Math.min(sOf(z), 1.05);
  const cx = screenX(0, z), baseY = screenY(z);
  const topY = baseY - topOffset * CONFIG.LANE_W * s;
  const w = Math.max(16, 0.85 * CONFIG.LANE_W * s), h = Math.max(7, 0.26 * CONFIG.LANE_W * s);
  if (h < 5) return;
  const a = alpha * clamp((z - 2) / 20, 0, 1);
  if (a <= 0) return;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#e0b21c';
  drawRoundedRect(ctx, cx - w / 2, topY - h / 2, w, h, Math.min(3, h * 0.22));
  ctx.fill();
  ctx.strokeStyle = '#15120c'; ctx.lineWidth = Math.max(1, h * 0.08); ctx.stroke();
  ctx.fillStyle = '#15120c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + (h * 0.58).toFixed(1) + 'px system-ui, sans-serif';
  ctx.fillText('NEXT \u25B8', cx, topY + h * 0.05);
  ctx.globalAlpha = 1;
}

function drawGate(g) {
  const alpha = clamp((CONFIG.Z_SPAWN - g.z) / 30, 0, 1);
  if (alpha <= 0) return;
  let topOffset;
  if (g.gateType === 'monorailStation') {
    const cx = screenX(0, g.z), baseY = screenY(g.z), lanePx = CONFIG.LANE_W * sOf(g.z);
    drawMonorailViaduct(ctx, klBaked, cx, baseY, lanePx, runTime, { station: true, name: g.name, alpha: alpha, dir: 1, phase: 0 });
    topOffset = 4.7;
  } else if (g.gateType === 'petalingGate') {
    drawPetalingGate(g.z, g.name, alpha);
    topOffset = 2.3;
  } else if (klBaked.gates && klBaked.gates[g.gateType]) {
    topOffset = drawPackGate(g.gateType, g.z, alpha);
  } else {
    drawGantryGate(g.z, g.name, alpha, KL_ZONES[g.zoneIdx % KL_ZONES.length].key);
    topOffset = 3.9;
  }
  drawNextBadge(g.z, alpha, topOffset);
}

// v0.3 (5A): the plain viaduct - same fade-in as any billboard while it's
// still approaching (z > 0); once the player is under/past it (z <= 0) it
// stays fully opaque until updateViaducts recycles it on the "beam has
// left the top of the screen" rule instead.
function drawViaduct(v) {
  const alpha = v.z > 0 ? clamp((CONFIG.Z_SPAWN - v.z) / 30, 0, 1) : 1;
  if (alpha <= 0) return;
  const cx = screenX(0, v.z), baseY = screenY(v.z), lanePx = CONFIG.LANE_W * sOf(v.z);
  drawMonorailViaduct(ctx, klBaked, cx, baseY, lanePx, runTime, { station: false, dir: v.dir, phase: v.phase, alpha: alpha });
}

// v0.3 (KLCC dressing): esplanade pools - flat decal spanning the full
// depth, not a discrete per-metre prop, so it doesn't compete for the
// roadside blit budget (same treatment as the kerb/ground verge).
// v0.4 (2.2): moved to x=2.08..2.74 so the pool sits between the street
// pack's hedge (1.74-1.98) and its palms (2.95) instead of overlapping them.
function drawEsplanadePools() {
  const curZone = zoneDataFor(zoneKeyFor(zoneIndex));
  if (curZone.key !== 'klcc') return;
  ctx.fillStyle = '#1e5fa8';
  [-1, 1].forEach(function (sgn) {
    ctx.beginPath();
    ctx.moveTo(screenX(sgn * 2.08, CONFIG.Z_FAR), screenY(CONFIG.Z_FAR));
    ctx.lineTo(screenX(sgn * 2.74, CONFIG.Z_FAR), screenY(CONFIG.Z_FAR));
    ctx.lineTo(screenX(sgn * 2.74, Z_NEAR), screenY(Z_NEAR));
    ctx.lineTo(screenX(sgn * 2.08, Z_NEAR), screenY(Z_NEAR));
    ctx.closePath();
    ctx.fill();
  });
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  const gridSpacing = 10;
  const phase = ((distance % gridSpacing) + gridSpacing) % gridSpacing;
  const gStart = Math.floor((Z_NEAR + phase) / gridSpacing) - 1;
  const gEnd = Math.ceil((CONFIG.Z_FAR + phase) / gridSpacing) + 1;
  for (let i = gStart; i <= gEnd; i++) {
    const z = i * gridSpacing - phase;
    if (z < Z_NEAR || z > CONFIG.Z_FAR) continue;
    [-1, 1].forEach(function (sgn) {
      ctx.beginPath();
      ctx.moveTo(screenX(sgn * 2.08, z), screenY(z));
      ctx.lineTo(screenX(sgn * 2.74, z), screenY(z));
      ctx.stroke();
    });
  }
}

function drawFountainJet(xLane, z) {
  const s = sOf(z);
  const baseX = screenX(xLane, z), baseY = screenY(z);
  const hgt = (0.5 + 0.35 * Math.sin(runTime * 2 + xLane * 3)) * CONFIG.LANE_W * s;
  if (hgt < 3) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(180,220,255,0.5)';
  ctx.fillRect(baseX - Math.max(1, 0.03 * CONFIG.LANE_W * s), baseY - hgt, Math.max(2, 0.06 * CONFIG.LANE_W * s), hgt);
  ctx.fillStyle = 'rgba(120,200,255,0.35)';
  ctx.beginPath(); ctx.ellipse(baseX, baseY, Math.max(2, 0.12 * CONFIG.LANE_W * s), Math.max(1, 0.05 * CONFIG.LANE_W * s), 0, 0, TAU); ctx.fill();
  ctx.restore();
}

// v0.3 (Jalan Petaling dressing): red lantern string across the road every
// 40m. Counted as one blit total (not per-lantern) - it's one prop, same
// spirit as the budget note for buildings/palms.
// v0.4 (2.2): anchored to the facade plane (x = +-KL_STREET.WALL_X) instead
// of hanging in mid-air over the kerb - now reads as strung between the
// shophouses. Height dropped from 2.3 to 2.0 lanes per the spec.
function drawLanternString(z) {
  const s = sOf(z);
  const y = screenY(z) - 2.0 * CONFIG.LANE_W * s;
  const xL = screenX(-KL_STREET.WALL_X, z), xR = screenX(KL_STREET.WALL_X, z);
  const sag = 0.30 * CONFIG.LANE_W * s;
  ctx.strokeStyle = 'rgba(120,20,20,0.5)';
  ctx.lineWidth = Math.max(1, 0.02 * CONFIG.LANE_W * s);
  ctx.beginPath(); ctx.moveTo(xL, y); ctx.quadraticCurveTo((xL + xR) / 2, y + sag, xR, y); ctx.stroke();
  const n = 5;
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const lx = xL + (xR - xL) * t, ly = y + sag * 4 * t * (1 - t);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,80,40,0.85)';
    ctx.beginPath(); ctx.ellipse(lx, ly, Math.max(1.5, 0.05 * CONFIG.LANE_W * s), Math.max(2, 0.07 * CONFIG.LANE_W * s), 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

// v0.4: buildings, palms/trees and lamps are gone from here - the street
// pack (drawKLStreetBase/drawKLStreetSides, called from render()) draws
// all of those per district now. What's left is what the game still owns:
// the esplanade pools (drawn separately in render(), before the street
// pack per the spec's frame order), fountain jets, and lantern strings.
function drawRoadsideDressing() {
  const jetSpacing = 10; // matches the esplanade pool's own grid spacing
  const phaseJ = ((distance % jetSpacing) + jetSpacing) % jetSpacing;
  const jStart = Math.floor((Z_NEAR + phaseJ) / jetSpacing) - 1;
  const jEnd = Math.ceil((CONFIG.Z_FAR + phaseJ) / jetSpacing) + 1;
  for (let i = jEnd; i >= jStart; i--) {
    const z = i * jetSpacing - phaseJ;
    if (z < Z_NEAR || z > CONFIG.Z_FAR) continue;
    if (districtAt(distance + z) === 'klcc') { drawFountainJet(-2.4, z); drawFountainJet(2.4, z); }
  }
  const lanternSpacing = 40;
  const phaseL = ((distance % lanternSpacing) + lanternSpacing) % lanternSpacing;
  const lStart = Math.floor((Z_NEAR + phaseL) / lanternSpacing) - 1;
  const lEnd = Math.ceil((CONFIG.Z_FAR + phaseL) / lanternSpacing) + 1;
  for (let i = lEnd; i >= lStart; i--) {
    const z = i * lanternSpacing - phaseL;
    if (z < Z_NEAR || z > CONFIG.Z_FAR) continue;
    if (districtAt(distance + z) === 'petalingStreet') { drawLanternString(z); roadsideBlitCount++; }
  }
}

// v0.4: lamp posts are gone from here (the street pack draws them per
// district, see klsLamp). All that's left is the ad sign boards.
function drawRoadsideProps() {
  roadsideBlitCount = 0;
  const signSpacing = 168; // ~150m per the doc, kept a multiple of 24 from the old post spacing
  const phaseS = ((distance % signSpacing) + signSpacing) % signSpacing;
  const jStart = Math.floor((Z_NEAR + phaseS) / signSpacing) - 1;
  const jEnd = Math.ceil((CONFIG.Z_FAR + phaseS) / signSpacing) + 1;
  for (let j = jEnd; j >= jStart; j--) {
    const z = j * signSpacing - phaseS;
    if (z < Z_NEAR || z > CONFIG.Z_FAR) continue;
    // v0.3 (hard content rule #1): sponsor/ad boards only in zones with
    // ads:true - never klcc, dataranMerdeka or batuCaves. Checked by the
    // zone the sign's actual world position falls in, not the zone the
    // player is currently standing in, so the set changes exactly at the
    // gate as distance crosses each boundary.
    const zoneAtSign = zoneDataFor(districtAt(distance + z));
    if (!zoneAtSign.ads) continue;
    const side = (((j % 2) + 2) % 2) === 0 ? -1 : 1;
    // v0.4 (section 2.3, rule 4): keep ad boards away from Banner Malaysia
    if (klsFlagPostNearWorld(side, distance + z, 20)) continue;
    drawSignBillboard(side * 2.35, z);
    roadsideBlitCount++;
  }
}

/* ---- sky + parallax skyline, per zone -------------------------------- */
/* v0.3 (KL rework): the near/landmark tiers are gone - real KL landmarks
   (a persistent trio plus one hero per zone) now come from the pasted
   kl-landmarks.js pack via buildKLSkyline/drawKLSkylineBlend. What's left
   here is just the sky gradient, the star layer, and a low generic filler
   band that sits behind the trio (hidden entirely for whichever side of a
   transition has trio 0, i.e. Batu Caves - section 3.2). */
const SKY_STAR_W = 240, SKY_FAR_W = 300, SKY_H = 200;
const skylineSprites = { stars: null, far: {} };

function makeSkyCanvas(width, drawFn) {
  const c = document.createElement('canvas');
  c.width = width; c.height = SKY_H;
  drawFn(c.getContext('2d'), width, SKY_H);
  return c;
}

function drawStars(g, w, h) {
  let s = 918273645;
  function r() { s = (s * 1103515245 + 12345) >>> 0; return (s >>> 8) / 16777216; }
  for (let i = 0; i < 26; i++) {
    const x = r() * w, y = r() * h * 0.72, rad = 0.6 + r() * 1.1;
    g.fillStyle = 'rgba(255,255,255,' + (0.25 + r() * 0.5).toFixed(2) + ')';
    g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
  }
  // no moon here - a one-of-a-kind object doesn't belong on a repeating
  // tile, or it visibly duplicates. Drawn once, separately, in
  // drawSkyAndSkyline() - moved to the left third (v0.3, KL rework 3.1:
  // at top right it sat beside the mute button and read as a control).
}

// v0.3 (KL rework, 3.2): generic filler band - low, dark, a handful of lit
// windows, tinted by the zone's glow. Sits BEHIND the real trio/hero
// landmarks and must stay lower than all of them so it never competes;
// heights are tuned to roughly 10-45 logical px (was up to 70% of the full
// canvas height - tall enough to read as its own skyline and fight the
// real one this spec exists to add).
function drawFarSkyline(g, w, h, glow, seed) {
  let s = seed >>> 0;
  function r() { s = (s * 1103515245 + 12345) >>> 0; return (s >>> 8) / 16777216; }
  g.fillStyle = mixHex('#11141c', glow, 0.16);
  let x = 0;
  while (x < w) {
    const bw = 14 + r() * 20, bh = 10 + r() * 35;
    g.fillRect(x, h - bh, bw, bh);
    x += bw + 2 + r() * 4;
  }
}

function buildSkylineSprites() {
  skylineSprites.stars = makeSkyCanvas(SKY_STAR_W, drawStars);
  skylineSprites.far.neutral = makeSkyCanvas(SKY_FAR_W, function (g, w, h) { drawFarSkyline(g, w, h, ZONE_NEUTRAL.glow, 1); });
  KL_ZONES.forEach(function (z, i) {
    skylineSprites.far[z.key] = makeSkyCanvas(SKY_FAR_W, function (g, w, h) { drawFarSkyline(g, w, h, z.glow, 1000 + i * 97); });
  });
}

function drawSkyTiled(canvas, scrollPx, tileW, destH, alpha) {
  if (!canvas || alpha <= 0) return;
  // v0.3 (V3): scale width by the same factor as height instead of keeping
  // it fixed, so this tiled layer's own proportions stay correct regardless
  // of where the horizon actually falls on a given viewport.
  const scale = destH / SKY_H;
  const destW = tileW * scale;
  const offset = ((scrollPx % destW) + destW) % destW;
  ctx.globalAlpha = alpha;
  let x = -offset;
  while (x < 360) {
    ctx.drawImage(canvas, x, 0, destW, destH);
    x += destW;
  }
  ctx.globalAlpha = 1;
}

// v0.3 (7.3): cached sky gradient. During steady state (no zone transition
// running) curKey/prevKey/blend/horizonY are all identical frame to frame,
// so the same gradient object is reused instead of calling
// createLinearGradient every frame; a transition (blend moving 0->1 over
// ZONE_FADE_DUR) or a resize (horizonY changes) naturally busts the cache
// since one of the four key values changes.
let cachedSkyGrad = null, cachedSkyGradKey = '';
function skyGradientFor(prevZone, curZone, blend, horizonY) {
  const key = prevZone.key + '|' + curZone.key + '|' + blend.toFixed(3) + '|' + horizonY.toFixed(1);
  if (cachedSkyGrad && key === cachedSkyGradKey) return cachedSkyGrad;
  const grad = ctx.createLinearGradient(0, 0, 0, horizonY);
  const stops = [0, 0.55, 1];
  for (let i = 0; i < 3; i++) grad.addColorStop(stops[i], mixHex(prevZone.sky[i], curZone.sky[i], blend));
  cachedSkyGrad = grad; cachedSkyGradKey = key;
  return grad;
}

function drawSkyAndSkyline() {
  const horizonY = screenY(CONFIG.Z_FAR);
  const curKey = zoneKeyFor(zoneIndex);
  const curZone = zoneDataFor(curKey);
  const prevZone = zoneDataFor(prevZoneKey);
  const blend = clamp((performance.now() - zoneTransitionStartMs) / (CONFIG.ZONE_FADE_DUR * 1000), 0, 1);
  // v0.3 (3.3): the trio is drawn once, never tiled - lateral life comes
  // from this small sway only, replacing the old near-layer scroll-tiling.
  const drift = Math.sin(distance * 0.0006) * 10;

  // 1. sky gradient (cached)
  ctx.fillStyle = skyGradientFor(prevZone, curZone, blend, horizonY);
  ctx.fillRect(0, 0, 360, horizonY);

  // 2. stars (moon removed - fix #5: it sat under the BEST label at top right
  // when it stayed put, and behind the HUD when moved to the left third)
  drawSkyTiled(skylineSprites.stars, distance * CONFIG.SKY_STAR_RATE, SKY_STAR_W, horizonY, 1);

  // 3. generic filler band - hidden for whichever side of a transition has
  // trio 0 (Batu Caves); keeps its own existing two-layer crossfade
  // (spec 3.2 - only the trio/hero layer switched to drawKLSkylineBlend).
  if (blend >= 1) {
    if (curZone.trio > 0) drawSkyTiled(skylineSprites.far[curKey], distance * CONFIG.SKY_FAR_RATE, SKY_FAR_W, horizonY, 1);
  } else {
    if (prevZone.trio > 0) drawSkyTiled(skylineSprites.far[prevZoneKey], distance * CONFIG.SKY_FAR_RATE, SKY_FAR_W, horizonY, 1 - blend);
    if (curZone.trio > 0) drawSkyTiled(skylineSprites.far[curKey], distance * CONFIG.SKY_FAR_RATE, SKY_FAR_W, horizonY, blend);
  }

  // 4. trio + hero: the real KL landmarks, from the pack. Never tiled.
  maybeRebuildKLSkyline();
  drawKLSkylineBlend(ctx, klBaked, prevZone, curZone, blend, horizonY, drift, runTime);

  // v0.3 (5A): far monorail line - only in zones with skyRail:true, alpha
  // following the same zone blend as everything else. Drawn after the
  // trio/hero and before the horizon haze per the spec.
  const railA = (curZone.skyRail ? blend : 0) + (prevZone.skyRail ? 1 - blend : 0);
  if (railA > 0.01) drawSkyRail(ctx, klBaked, horizonY, klSkyScale, runTime, distance * 0.9, railA);

  // v0.3 (V1): ground verge, filling the space beside the road out to the
  // screen edges instead of leaving it pure black void - drawRoad() paints
  // over the middle of this next, leaving just the two side wedges visible.
  ctx.fillStyle = mixShade(prevZone.sky[1], curZone.sky[1], blend, 0.55);
  ctx.fillRect(0, horizonY, 360, VIEW_H - horizonY);
}

/* ---- vector sprites, drawn once into offscreen canvases and blitted from
   then on (no per-frame path drawing, no asset files, crisp at any DPI) ---- */
const LIGHT_FRONT = '#fff6c8', LIGHT_REAR = '#ff5b5b';


/* Player livery accent. Kept off the real grids: white + violet is
   not a current team pairing (the old mint green sat too close to
   a silver/teal car). */
const ACCENT_PLAYER = '#9b5cff';     // variant A stripe
const PLAYER_ACCENT_RED = '#ff2e63';  // variant B chevron - the shipped car
// v0.3 (7.2): tinted orange rather than pure red, so the barrier's stripes
// keep contrast against the kerb even now that the kerb itself is dimmed -
// two adjacent reds at different brightness read as one blob at a glance.
const HAZARD_RED = '#e0731f', HAZARD_WHITE = '#f2f5fa';

/* new palette extensions - night-KL ambience, used for rim light and puddles */
const NEON_COOL = '#4de2ff';   // shopfront / signage bounce
const SODIUM    = '#ffb347';   // streetlight bounce
const TAU = Math.PI * 2;

/* ------------------------------ helpers ------------------------------- */

function drawRoundedRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function _rgb(hex) {
  let s = hex.replace('#', '');
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  const n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/** hex -> 'rgba(r,g,b,a)' */
function rgba(hex, a) {
  const c = _rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}

/** blend two hex colours, t=0 -> a, t=1 -> b */
function mixHex(a, b, t) {
  const A = _rgb(a), B = _rgb(b);
  const c = [0, 1, 2].map(function (i) { return Math.round(A[i] + (B[i] - A[i]) * t); });
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}
function shade(hex, t) { return mixHex(hex, '#000000', t); }
function tint(hex, t) { return mixHex(hex, '#ffffff', t); }
// blend two hex colours then darken toward black in one pass. mixHex/shade
// can't be chained for this - mixHex returns an 'rgb(...)' string, not hex,
// so feeding that back into a second mixHex/shade call would fail to parse.
// This works directly off the two real hex inputs instead.
function mixShade(a, b, t, darken) {
  const A = _rgb(a), B = _rgb(b);
  const k = 1 - darken;
  const c = [0, 1, 2].map(function (i) { return Math.round((A[i] + (B[i] - A[i]) * t) * k); });
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}

/** soft radial blob - used for shadows, glows and reflections */
function softEllipse(g, cx, cy, rx, ry, color, a, comp) {
  g.save();
  if (comp) g.globalCompositeOperation = comp;
  g.translate(cx, cy);
  g.scale(1, ry / rx);
  const grd = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  grd.addColorStop(0.00, rgba(color, a));
  grd.addColorStop(0.55, rgba(color, a * 0.42));
  grd.addColorStop(1.00, rgba(color, 0));
  g.fillStyle = grd;
  g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill();
  g.restore();
}

/** additive lamp bloom */
function addGlow(g, cx, cy, r, color, a) {
  softEllipse(g, cx, cy, r, r, color, a, 'lighter');
}

/** headlight haze fanning toward the far end (-y) */
function drawBeam(g, cx, y, halfW, len, color, a) {
  if (len <= 0) return;
  g.save();
  g.globalCompositeOperation = 'lighter';
  const grd = g.createLinearGradient(0, y, 0, y - len);
  grd.addColorStop(0, rgba(color, a));
  grd.addColorStop(1, rgba(color, 0));
  g.fillStyle = grd;
  g.beginPath();
  g.moveTo(cx - halfW * 0.34, y);
  g.lineTo(cx + halfW * 0.34, y);
  g.lineTo(cx + halfW, y - len);
  g.lineTo(cx - halfW, y - len);
  g.closePath(); g.fill();
  g.restore();
}

/** wet-asphalt smear of a lamp, running toward the viewer (+y) */
function wetSmear(g, cx, y, halfW, len, color, a) {
  if (len <= 0) return;
  g.save();
  g.globalCompositeOperation = 'lighter';
  const grd = g.createLinearGradient(0, y, 0, y + len);
  grd.addColorStop(0.0, rgba(color, a));
  grd.addColorStop(0.4, rgba(color, a * 0.35));
  grd.addColorStop(1.0, rgba(color, 0));
  g.fillStyle = grd;
  g.beginPath();
  g.moveTo(cx - halfW, y);
  g.lineTo(cx + halfW, y);
  g.lineTo(cx + halfW * 1.35, y + len);
  g.lineTo(cx - halfW * 1.35, y + len);
  g.closePath(); g.fill();
  g.restore();
}

/* ------------------------- small helpers ---------------------------- */

function linGrad(g, x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  for (let i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]);
  return gr;
}

/** lit-from-upper-left shading across a rear face */
function faceGrad(g, x0, x1, c) {
  return linGrad(g, x0, 0, x1, 0, [
    [0.00, shade(c, 0.64)], [0.13, shade(c, 0.30)], [0.40, tint(c, 0.12)],
    [0.68, shade(c, 0.18)], [1.00, shade(c, 0.66)]
  ]);
}

/** a top surface seen from above - flatter, cooler, sky-ish */
function topGrad(g, x0, x1, c) {
  return linGrad(g, x0, 0, x1, 0, [
    [0.00, shade(c, 0.70)], [0.30, shade(c, 0.38)], [0.55, shade(c, 0.24)],
    [1.00, shade(c, 0.72)]
  ]);
}

/** diagonal hazard stripes clipped to a rect. dir +1 / -1 flips the lean. */
function hazardStripes(g, x, y, ww, hh, base, stripe, sw, dir) {
  g.save();
  g.beginPath(); g.rect(x, y, ww, hh); g.clip();
  g.fillStyle = base; g.fillRect(x, y, ww, hh);
  g.fillStyle = stripe;
  const step = sw * 2;
  for (let i = -hh * 2; i < ww + hh * 2; i += step) {
    g.beginPath();
    g.moveTo(x + i, y + hh);
    g.lineTo(x + i + sw, y + hh);
    g.lineTo(x + i + sw + dir * hh, y);
    g.lineTo(x + i + dir * hh, y);
    g.closePath(); g.fill();
  }
  g.restore();
}

/** rear-view tyre, contact patch flattened onto the ground line */
function drawRearTyre(g, cx, groundY, tw, th) {
  const x = cx - tw / 2, y = groundY - th;
  g.fillStyle = '#05070b';
  drawRoundedRect(g, x, y, tw, th, tw * 0.24); g.fill();
  g.fillStyle = linGrad(g, x, 0, x + tw, 0, [
    [0.00, rgba('#000000', 0.45)], [0.30, rgba('#aab8ce', 0.14)],
    [0.58, rgba('#ffffff', 0.06)], [1.00, rgba('#000000', 0.45)]
  ]);
  drawRoundedRect(g, x, y, tw, th, tw * 0.24); g.fill();
  /* sidewall crease + contact darkening */
  g.fillStyle = rgba('#8a93a6', 0.10);
  g.fillRect(x + tw * 0.14, y + th * 0.18, tw * 0.72, Math.max(1, th * 0.03));
  /* crown catching the streetlight - without this the tyre is a hole */
  g.save();
  g.beginPath(); drawRoundedRect(g, x, y, tw, th, tw * 0.24); g.clip();
  g.fillStyle = linGrad(g, 0, y, 0, y + th * 0.30, [
    [0.00, rgba('#b8c4d8', 0.34)], [1.00, rgba('#b8c4d8', 0)]
  ]);
  g.fillRect(x, y, tw, th * 0.30);
  g.restore();
  g.strokeStyle = rgba('#c3cfe2', 0.22);
  g.lineWidth = Math.max(1, tw * 0.05);
  g.beginPath();
  g.moveTo(x + tw * 0.06, y + th * 0.22);
  g.quadraticCurveTo(x + tw * 0.5, y - th * 0.03, x + tw * 0.94, y + th * 0.22);
  g.stroke();
  g.fillStyle = rgba('#000000', 0.60);
  g.fillRect(x, groundY - th * 0.09, tw, th * 0.09);
}

/** rim light: sodium down one flank, neon signage down the other */
function rimLight(g, x0, x1, y0, y1, a) {
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.lineWidth = Math.max(1, (x1 - x0) * 0.012);
  g.strokeStyle = rgba(SODIUM, a);
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0, y1); g.stroke();
  g.strokeStyle = rgba(NEON_COOL, a * 0.8);
  g.beginPath(); g.moveTo(x1, y0); g.lineTo(x1, y1); g.stroke();
  g.restore();
}

/* ------------------------- hatchback (cutter) ------------------------ */
/* VISUAL_SIZE.hatchback 0.74 x 0.70 - boxy.
   Reads at 16px as: orange box, dark band across the top third, two
   wide red blocks at the outer edges, dark bumper, two tyre bottoms. */
function drawCarSprite(g, w, h, bodyColor, glassColor, opts) {
  opts = opts || {};
  const lens = opts.rearLight || '#ff7043';
  const cx = w * 0.5;
  const BH = w * 0.44;              // body half width
  const RH = w * 0.30;              // roof half width at the far edge

  /* tyres first - the body overlaps all but the bottom of them */
  const tyreW = w * 0.145, tyreH = h * 0.30;
  drawRearTyre(g, cx - w * 0.325, h, tyreW, tyreH);
  drawRearTyre(g, cx + w * 0.325, h, tyreW, tyreH);

  /* foreshortened roof, narrowing with distance */
  g.beginPath();
  g.moveTo(cx - RH, h * 0.055);
  g.lineTo(cx + RH, h * 0.055);
  g.lineTo(cx + BH * 0.88, h * 0.285);
  g.lineTo(cx - BH * 0.88, h * 0.285);
  g.closePath();
  g.fillStyle = topGrad(g, cx - BH, cx + BH, bodyColor); g.fill();
  g.fillStyle = rgba('#ffffff', 0.05);
  g.fillRect(cx - RH * 0.8, h * 0.075, RH * 1.6, h * 0.02);

  /* roof spoiler lip over the glass */
  g.fillStyle = shade(bodyColor, 0.52);
  drawRoundedRect(g, cx - BH * 0.86, h * 0.265, BH * 1.72, h * 0.055, w * 0.012);
  g.fill();
  g.fillStyle = rgba('#000000', 0.40);
  g.fillRect(cx - BH * 0.86, h * 0.315, BH * 1.72, Math.max(1, h * 0.012));

  /* rear face */
  g.beginPath();
  g.moveTo(cx - BH * 0.90, h * 0.300);
  g.lineTo(cx + BH * 0.90, h * 0.300);
  g.lineTo(cx + BH, h * 0.560);
  g.lineTo(cx + BH * 0.975, h * 0.800);
  g.lineTo(cx - BH * 0.975, h * 0.800);
  g.lineTo(cx - BH, h * 0.560);
  g.closePath();
  g.fillStyle = faceGrad(g, cx - BH, cx + BH, bodyColor); g.fill();

  /* rear window */
  const gy0 = h * 0.330, gy1 = h * 0.505;
  g.beginPath();
  g.moveTo(cx - BH * 0.80, gy0);
  g.lineTo(cx + BH * 0.80, gy0);
  g.lineTo(cx + BH * 0.845, gy1);
  g.lineTo(cx - BH * 0.845, gy1);
  g.closePath();
  g.fillStyle = linGrad(g, 0, gy0, 0, gy1, [
    [0.00, shade(glassColor, 0.10)], [0.45, glassColor], [1.00, shade(glassColor, 0.45)]
  ]);
  g.fill();
  /* glass reflections - streetlight smear across the top, wiper arc */
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = rgba('#8fb3d9', 0.16);
  g.beginPath();
  g.moveTo(cx - BH * 0.76, gy0 + h * 0.012);
  g.lineTo(cx - BH * 0.18, gy0 + h * 0.012);
  g.lineTo(cx - BH * 0.30, gy1 - h * 0.030);
  g.lineTo(cx - BH * 0.78, gy1 - h * 0.030);
  g.closePath(); g.fill();
  g.restore();
  g.strokeStyle = rgba('#1a212c', 0.85);
  g.lineWidth = Math.max(1, w * 0.010);
  g.beginPath();
  g.moveTo(cx - BH * 0.60, gy1 - h * 0.012);
  g.quadraticCurveTo(cx + BH * 0.10, gy0 + h * 0.050, cx + BH * 0.62, gy1 - h * 0.020);
  g.stroke();
  /* third brake light strip above the glass */
  g.fillStyle = shade(lens, 0.55);
  g.fillRect(cx - BH * 0.30, gy0 - h * 0.018, BH * 0.60, h * 0.016);

  /* tail light housings - wide, hard against the outer edges */
  [-1, 1].forEach(function (s) {
    const x0 = cx + s * BH * 0.995, x1 = cx + s * BH * 0.46;
    const lo = Math.min(x0, x1), wid = Math.abs(x1 - x0);
    const y0 = h * 0.545, hh = h * 0.150;
    g.fillStyle = '#1b212c';
    drawRoundedRect(g, lo - w * 0.006, y0 - h * 0.010, wid + w * 0.012, hh + h * 0.020, w * 0.018);
    g.fill();
    /* lens: red main block, amber indicator outboard, clear reverse inboard */
    g.fillStyle = linGrad(g, 0, y0, 0, y0 + hh, [
      [0.00, tint(lens, 0.30)], [0.55, lens], [1.00, shade(lens, 0.45)]
    ]);
    drawRoundedRect(g, lo, y0, wid, hh, w * 0.014); g.fill();
    g.fillStyle = rgba('#ffb347', 0.85);
    drawRoundedRect(g, cx + s * BH * 0.965 - (s > 0 ? wid * 0.30 : 0), y0 + hh * 0.08,
                    wid * 0.30, hh * 0.40, w * 0.010);
    g.fill();
    g.fillStyle = rgba('#dfe7f5', 0.60);
    drawRoundedRect(g, cx + s * BH * 0.49 - (s > 0 ? wid * 0.24 : 0), y0 + hh * 0.56,
                    wid * 0.24, hh * 0.34, w * 0.008);
    g.fill();
    /* housing gloss */
    g.fillStyle = rgba('#ffffff', 0.12);
    g.fillRect(lo + wid * 0.08, y0 + hh * 0.10, wid * 0.84, Math.max(1, hh * 0.08));
  });

  /* hatch shut line, handle recess, blank plate */
  g.strokeStyle = rgba('#000000', 0.45);
  g.lineWidth = Math.max(1, w * 0.008);
  g.beginPath();
  g.moveTo(cx - BH * 0.94, h * 0.725); g.lineTo(cx + BH * 0.94, h * 0.725);
  g.stroke();
  g.fillStyle = rgba('#000000', 0.40);
  drawRoundedRect(g, cx - BH * 0.20, h * 0.560, BH * 0.40, h * 0.030, w * 0.010); g.fill();
  g.fillStyle = '#b6c1d4';
  drawRoundedRect(g, cx - BH * 0.24, h * 0.628, BH * 0.48, h * 0.062, w * 0.008); g.fill();
  g.fillStyle = rgba('#000000', 0.26);
  g.fillRect(cx - BH * 0.19, h * 0.650, BH * 0.38, h * 0.018);

  /* bumper + valance */
  g.fillStyle = linGrad(g, cx - BH, 0, cx + BH, 0, [
    [0.00, shade(bodyColor, 0.72)], [0.35, shade(bodyColor, 0.42)],
    [0.70, shade(bodyColor, 0.48)], [1.00, shade(bodyColor, 0.74)]
  ]);
  drawRoundedRect(g, cx - BH, h * 0.745, BH * 2, h * 0.145, w * 0.022); g.fill();
  g.fillStyle = '#12171f';
  drawRoundedRect(g, cx - BH * 0.94, h * 0.855, BH * 1.88, h * 0.085, w * 0.018); g.fill();
  /* reflectors + a dented corner for daily-traffic wear */
  [-1, 1].forEach(function (s) {
    g.fillStyle = rgba('#c0392b', 0.85);
    drawRoundedRect(g, cx + s * BH * 0.78 - w * 0.022, h * 0.790, w * 0.044, h * 0.030, w * 0.008);
    g.fill();
  });
  g.fillStyle = rgba('#000000', 0.30);
  drawRoundedRect(g, cx - BH * 0.97, h * 0.760, BH * 0.34, h * 0.060, w * 0.015); g.fill();
  /* exhaust tip */
  g.fillStyle = '#2b323f';
  drawRoundedRect(g, cx + BH * 0.52, h * 0.895, w * 0.048, h * 0.032, w * 0.010); g.fill();

  rimLight(g, cx - BH * 0.995, cx + BH * 0.995, h * 0.320, h * 0.780, 0.22);
}

/* ---------------------- kapcai liveries ------------------------------
   Street-livery presets for the delivery rider. No marks, no wordmarks,
   no logos anywhere - and the hues are deliberately nudged off the real
   services' exact brand values while still reading as that kind of rider
   on a KL street. Pass any hex you like via opts.colors to override.   */
// v0.4.1: the earlier "read as real delivery brands" note (v0.4 fix #7)
// is withdrawn - it was advice, not a change request, and the owner has
// decided these four liveries stay exactly as originally designed. Not
// re-colouring this again for any reason, brand-safety included.
const KAPCAI_LIVERY = {
  slate:   { box: '#3d4a5f', trim: '#e8f1ff', vest: null,      helmet: '#e8f1ff', bike: '#2e6cff' },  // generic
  jade:    { box: '#0f9e5c', trim: '#eafff4', vest: '#0f9e5c', helmet: '#f2fff8', bike: '#1d2530' },  // green delivery rider
  magenta: { box: '#c9256e', trim: '#ffe9f3', vest: '#c9256e', helmet: '#f7eaf2', bike: '#1d2530' },  // pink delivery rider
  melon:   { box: '#e8722c', trim: '#fff2e6', vest: '#e8722c', helmet: '#eef2f8', bike: '#1d2530' }   // orange delivery rider
};

/* ------------------------------ kapcai ------------------------------- */
/* VISUAL_SIZE.kapcai 0.42 x 0.86 - narrow and tall.
   Reads at 16px as: round helmet, one wide bar crossing the stack
   (bars + mirrors), a big coloured block (the box), a thin dark wheel.
   opts: livery ('slate'|'jade'|'melon'|'magenta'), colors (override
   object), box (false to drop it), helmet (hex)                        */
function drawKapcaiSprite(g, w, h, bodyColor, riderColor, opts) {
  opts = opts || {};
  const L = Object.assign({}, KAPCAI_LIVERY[opts.livery] || KAPCAI_LIVERY.slate, opts.colors || {});
  const box = opts.box !== false;
  const bike = L.bike || bodyColor;
  const jacket0 = riderColor || '#242a36';
  const helmetColor = opts.helmet || L.helmet || '#e8f1ff';
  const cx = w * 0.5;

  /* ---- bike: wheel, mudguard, plate, tail cowl ---- */
  drawRearTyre(g, cx, h, w * 0.215, h * 0.310);
  g.fillStyle = '#12171f';
  drawRoundedRect(g, cx - w * 0.152, h * 0.742, w * 0.304, h * 0.118, w * 0.050); g.fill();
  g.fillStyle = rgba('#8a93a6', 0.14);
  g.fillRect(cx - w * 0.130, h * 0.756, w * 0.260, Math.max(1, h * 0.012));
  /* blank rear plate hanging off the guard */
  g.fillStyle = '#b6c1d4';
  drawRoundedRect(g, cx - w * 0.070, h * 0.786, w * 0.140, h * 0.052, w * 0.012); g.fill();
  g.fillStyle = rgba('#000000', 0.25);
  g.fillRect(cx - w * 0.054, h * 0.804, w * 0.108, h * 0.016);
  /* tail cowl in the bike colour */
  g.fillStyle = linGrad(g, cx - w * 0.175, 0, cx + w * 0.175, 0, [
    [0.00, shade(bike, 0.62)], [0.32, tint(bike, 0.14)],
    [0.62, shade(bike, 0.18)], [1.00, shade(bike, 0.66)]
  ]);
  g.beginPath();
  g.moveTo(cx - w * 0.142, h * 0.618);
  g.lineTo(cx + w * 0.142, h * 0.618);
  g.lineTo(cx + w * 0.175, h * 0.762);
  g.lineTo(cx - w * 0.175, h * 0.762);
  g.closePath(); g.fill();
  g.fillStyle = rgba('#000000', 0.32);
  g.fillRect(cx - w * 0.173, h * 0.748, w * 0.346, Math.max(1, h * 0.014));

  /* exhaust on the right, boots on the pegs */
  g.fillStyle = '#39404d';
  drawRoundedRect(g, cx + w * 0.120, h * 0.700, w * 0.105, h * 0.150, w * 0.030); g.fill();
  g.fillStyle = rgba('#8a93a6', 0.55);
  g.beginPath(); g.ellipse(cx + w * 0.172, h * 0.842, w * 0.036, h * 0.011, 0, 0, TAU); g.fill();
  [-1, 1].forEach(function (s) {
    g.fillStyle = '#171c26';
    drawRoundedRect(g, cx + s * w * 0.290 - w * 0.078, h * 0.598, w * 0.156, h * 0.122, w * 0.036);
    g.fill();
    g.fillStyle = rgba('#e8f1ff', 0.10);
    g.fillRect(cx + s * w * 0.290 - w * 0.056, h * 0.624, w * 0.112, Math.max(1, h * 0.012));
  });

  /* tail lamp cluster */
  g.fillStyle = '#12161d';
  drawRoundedRect(g, cx - w * 0.128, h * 0.660, w * 0.256, h * 0.082, w * 0.024); g.fill();
  g.fillStyle = linGrad(g, 0, h * 0.670, 0, h * 0.734, [
    [0.00, tint(LIGHT_REAR, 0.40)], [1.00, shade(LIGHT_REAR, 0.28)]
  ]);
  drawRoundedRect(g, cx - w * 0.102, h * 0.670, w * 0.204, h * 0.062, w * 0.018); g.fill();
  [-1, 1].forEach(function (s) {          // indicator stalks
    g.fillStyle = '#1b2230';
    drawRoundedRect(g, cx + s * w * 0.190 - w * 0.024, h * 0.664, w * 0.048, h * 0.040, w * 0.014);
    g.fill();
    g.fillStyle = rgba(SODIUM, 0.55);
    drawRoundedRect(g, cx + s * w * 0.190 - w * 0.016, h * 0.670, w * 0.032, h * 0.026, w * 0.010);
    g.fill();
  });

  /* ---- handlebars and mirrors: drawn BEFORE the rider, because they
     are at the far end of the bike. Only the sections outboard of his
     shoulders should be visible - the rider's back covers the rest. */
  g.save();
  g.lineCap = 'round';
  g.strokeStyle = '#0d1219';
  g.lineWidth = Math.max(2, w * 0.072);
  g.beginPath();
  g.moveTo(cx - w * 0.480, h * 0.356);
  g.quadraticCurveTo(cx, h * 0.314, cx + w * 0.480, h * 0.356);
  g.stroke();
  g.strokeStyle = rgba('#b9c6da', 0.55);
  g.lineWidth = Math.max(1, w * 0.028);
  g.beginPath();
  g.moveTo(cx - w * 0.452, h * 0.345);
  g.quadraticCurveTo(cx, h * 0.306, cx + w * 0.452, h * 0.345);
  g.stroke();
  g.restore();
  [-1, 1].forEach(function (s) {
    g.strokeStyle = '#39414f';
    g.lineWidth = Math.max(1, w * 0.034);
    g.beginPath();
    g.moveTo(cx + s * w * 0.430, h * 0.338);
    g.lineTo(cx + s * w * 0.478, h * 0.258);
    g.stroke();
    g.fillStyle = '#0f141c';
    g.beginPath();
    g.ellipse(cx + s * w * 0.480, h * 0.242, w * 0.084, h * 0.034, s * 0.30, 0, TAU);
    g.fill();
    g.fillStyle = rgba('#b9c6da', 0.55);
    g.beginPath();
    g.ellipse(cx + s * w * 0.480, h * 0.240, w * 0.060, h * 0.022, s * 0.30, 0, TAU);
    g.fill();
  });

  /* ---- rider: torso, high-vis vest, arms ---- */
  const jacket = linGrad(g, cx - w * 0.34, 0, cx + w * 0.34, 0, [
    [0.00, shade(jacket0, 0.55)], [0.32, tint(jacket0, 0.18)],
    [0.62, shade(jacket0, 0.10)], [1.00, shade(jacket0, 0.60)]
  ]);
  g.fillStyle = jacket;
  g.beginPath();
  g.moveTo(cx - w * 0.292, h * 0.216);
  g.quadraticCurveTo(cx - w * 0.348, h * 0.312, cx - w * 0.318, h * 0.470);
  g.lineTo(cx + w * 0.318, h * 0.470);
  g.quadraticCurveTo(cx + w * 0.348, h * 0.312, cx + w * 0.292, h * 0.216);
  g.closePath(); g.fill();
  if (L.vest) {                            // coloured vest over the jacket
    g.fillStyle = linGrad(g, cx - w * 0.30, 0, cx + w * 0.30, 0, [
      [0.00, shade(L.vest, 0.50)], [0.32, tint(L.vest, 0.20)],
      [0.66, shade(L.vest, 0.12)], [1.00, shade(L.vest, 0.55)]
    ]);
    g.beginPath();
    g.moveTo(cx - w * 0.232, h * 0.238);
    g.quadraticCurveTo(cx - w * 0.286, h * 0.330, cx - w * 0.268, h * 0.470);
    g.lineTo(cx + w * 0.268, h * 0.470);
    g.quadraticCurveTo(cx + w * 0.286, h * 0.330, cx + w * 0.232, h * 0.238);
    g.closePath(); g.fill();
    g.fillStyle = rgba('#000000', 0.30);
    g.fillRect(cx - w * 0.016, h * 0.250, w * 0.032, h * 0.215);
  }
  g.fillStyle = rgba('#e8f1ff', 0.46);
  g.fillRect(cx - w * 0.308, h * 0.288, w * 0.616, Math.max(1, h * 0.024));
  g.fillStyle = rgba('#000000', 0.22);
  g.fillRect(cx - w * 0.308, h * 0.312, w * 0.616, Math.max(1, h * 0.010));

  /* arms sweeping out to the grips */
  g.fillStyle = shade(jacket0, 0.34);
  [-1, 1].forEach(function (s) {
    g.beginPath();
    g.moveTo(cx + s * w * 0.282, h * 0.256);
    g.quadraticCurveTo(cx + s * w * 0.392, h * 0.304, cx + s * w * 0.410, h * 0.362);
    g.lineTo(cx + s * w * 0.342, h * 0.370);
    g.quadraticCurveTo(cx + s * w * 0.312, h * 0.324, cx + s * w * 0.232, h * 0.294);
    g.closePath(); g.fill();
  });

  /* grips and gloved hands, on top of the arms that reach them */
  [-1, 1].forEach(function (s) {
    g.fillStyle = '#05070b';
    drawRoundedRect(g, cx + s * w * 0.480 - (s > 0 ? w * 0.118 : 0), h * 0.334,
                    w * 0.118, h * 0.048, w * 0.022);
    g.fill();
    g.fillStyle = rgba('#8a93a6', 0.16);
    g.fillRect(cx + s * w * 0.480 - (s > 0 ? w * 0.100 : -w * 0.018), h * 0.342,
               w * 0.082, Math.max(1, h * 0.010));
  });

  /* hips on the saddle - normally hidden by the box, but this is what
     shows on the no-box rider, so it always gets drawn */
  g.fillStyle = linGrad(g, cx - w * 0.27, 0, cx + w * 0.27, 0, [
    [0.00, '#0d1119'], [0.34, '#262f3e'], [0.66, '#1a222e'], [1.00, '#0b0f16']
  ]);
  g.beginPath();
  g.moveTo(cx - w * 0.272, h * 0.444);
  g.lineTo(cx + w * 0.272, h * 0.444);
  g.lineTo(cx + w * 0.238, h * 0.560);
  g.lineTo(cx + w * 0.212, h * 0.616);
  g.lineTo(cx - w * 0.212, h * 0.616);
  g.lineTo(cx - w * 0.238, h * 0.560);
  g.closePath(); g.fill();
  g.fillStyle = rgba('#000000', 0.30);
  g.fillRect(cx - w * 0.268, h * 0.446, w * 0.536, Math.max(1, h * 0.012));
  g.fillStyle = rgba('#000000', 0.34);
  g.fillRect(cx - w * 0.014, h * 0.452, w * 0.028, h * 0.150);
  /* saddle showing either side of the rider */
  g.fillStyle = '#161b24';
  g.beginPath();
  g.moveTo(cx - w * 0.212, h * 0.548);
  g.lineTo(cx + w * 0.212, h * 0.548);
  g.lineTo(cx + w * 0.178, h * 0.632);
  g.lineTo(cx - w * 0.178, h * 0.632);
  g.closePath(); g.fill();
  g.fillStyle = rgba('#8a93a6', 0.12);
  g.fillRect(cx - w * 0.206, h * 0.556, w * 0.412, Math.max(1, h * 0.012));

  /* ---- pillion kid, sitting nearer the camera than the rider ----
     The kid is BEHIND the rider in the world, which from a chase cam
     means NEARER us: the small helmet overlaps the rider's back at
     shoulder-blade height and the kid's body covers his lower back.
     Leaning out to one side, because they always are. */
  if (opts.pillion) {
    const P = opts.pillionColors || {};
    const kJacket = P.jacket || '#4f7bb5';
    const kHelm = P.helmet || '#e4ebf6';
    const kBand = P.band || '#3a5c93';
    const kx = cx - w * 0.048;
    const kHW = w * 0.146;

    /* occlusion shadow cast onto the rider - sells the depth gap */
    softEllipse(g, kx, h * 0.480, w * 0.300, h * 0.140, '#000000', 0.55);

    /* knees and dangling feet, outboard of the torso, over his boots */
    [-1, 1].forEach(function (s) {
      const lx = kx + s * w * 0.214;
      g.fillStyle = linGrad(g, lx - w * 0.052, 0, lx + w * 0.052, 0, [
        [0.00, '#2a3850'], [0.42, '#4f6c92'], [1.00, '#1f2a3c']
      ]);
      drawRoundedRect(g, lx - w * 0.052, h * 0.514, w * 0.104, h * 0.100, w * 0.034); g.fill();
      g.fillStyle = rgba('#000000', 0.30);
      g.fillRect(lx - w * 0.052, h * 0.574, w * 0.104, Math.max(1, h * 0.010));
      g.fillStyle = '#12171f';
      drawRoundedRect(g, lx - w * 0.054, h * 0.600, w * 0.108, h * 0.048, w * 0.018); g.fill();
      g.fillStyle = rgba('#e8f1ff', 0.42);
      g.fillRect(lx - w * 0.050, h * 0.634, w * 0.100, Math.max(1, h * 0.012));
    });

    /* upper arms reaching forward round the rider's waist. Thin, angled
       down, and cut off at his flank - the forearms are out of sight. */
    [-1, 1].forEach(function (s) {
      g.fillStyle = shade(kJacket, 0.40);
      g.beginPath();
      g.moveTo(kx + s * w * 0.118, h * 0.470);
      g.quadraticCurveTo(kx + s * w * 0.210, h * 0.484, kx + s * w * 0.248, h * 0.520);
      g.lineTo(kx + s * w * 0.224, h * 0.546);
      g.quadraticCurveTo(kx + s * w * 0.172, h * 0.512, kx + s * w * 0.104, h * 0.506);
      g.closePath(); g.fill();
      g.fillStyle = rgba('#000000', 0.25);
      g.beginPath();
      g.moveTo(kx + s * w * 0.208, h * 0.486);
      g.quadraticCurveTo(kx + s * w * 0.232, h * 0.504, kx + s * w * 0.230, h * 0.540);
      g.lineTo(kx + s * w * 0.212, h * 0.532);
      g.closePath(); g.fill();
    });

    /* torso: sloped shoulders, soft taper, no hard box edges */
    g.fillStyle = linGrad(g, kx - kHW, 0, kx + kHW, 0, [
      [0.00, shade(kJacket, 0.58)], [0.28, tint(kJacket, 0.18)],
      [0.62, shade(kJacket, 0.16)], [1.00, shade(kJacket, 0.62)]
    ]);
    g.beginPath();
    g.moveTo(kx - kHW * 0.52, h * 0.442);
    g.quadraticCurveTo(kx - kHW * 1.02, h * 0.468, kx - kHW * 1.00, h * 0.552);
    g.quadraticCurveTo(kx - kHW * 0.98, h * 0.600, kx - kHW * 0.86, h * 0.606);
    g.lineTo(kx + kHW * 0.86, h * 0.606);
    g.quadraticCurveTo(kx + kHW * 0.98, h * 0.600, kx + kHW * 1.00, h * 0.552);
    g.quadraticCurveTo(kx + kHW * 1.02, h * 0.468, kx + kHW * 0.52, h * 0.442);
    g.closePath(); g.fill();
    /* collar, zip, hem */
    g.fillStyle = rgba('#000000', 0.40);
    drawRoundedRect(g, kx - kHW * 0.50, h * 0.436, kHW * 1.00, h * 0.026, w * 0.016); g.fill();
    g.strokeStyle = rgba('#000000', 0.32);
    g.lineWidth = Math.max(1, w * 0.008);
    g.beginPath(); g.moveTo(kx, h * 0.462); g.lineTo(kx, h * 0.598); g.stroke();
    g.fillStyle = rgba('#000000', 0.28);
    g.fillRect(kx - kHW * 0.90, h * 0.582, kHW * 1.80, Math.max(1, h * 0.014));
    g.fillStyle = rgba('#e8f1ff', 0.26);
    g.fillRect(kx - kHW * 0.84, h * 0.498, kHW * 1.68, Math.max(1, h * 0.012));
    if (opts.backpack) {
      g.fillStyle = linGrad(g, kx - kHW * 0.62, 0, kx + kHW * 0.62, 0, [
        [0.00, '#1f5a66'], [0.34, '#3f8b99'], [1.00, '#17454f']
      ]);
      drawRoundedRect(g, kx - kHW * 0.62, h * 0.482, kHW * 1.24, h * 0.086, w * 0.030); g.fill();
      g.fillStyle = rgba('#ffffff', 0.18);
      g.fillRect(kx - kHW * 0.52, h * 0.496, kHW * 1.04, Math.max(1, h * 0.010));
    }

    /* helmet: smaller shell, dark rear band, chin strap down both sides */
    const khr = w * 0.140, khy = h * 0.378;
    g.fillStyle = '#0a0e15';
    drawRoundedRect(g, kx - khr * 0.62, khy + khr * 0.70, khr * 1.24, khr * 0.80, khr * 0.30);
    g.fill();
    g.save();
    g.beginPath(); g.ellipse(kx, khy, khr, khr * 1.08, 0, 0, TAU); g.clip();
    const kg = g.createRadialGradient(kx - khr * 0.42, khy - khr * 0.52, khr * 0.08, kx, khy, khr * 1.30);
    kg.addColorStop(0.00, tint(kHelm, 0.55));
    kg.addColorStop(0.50, kHelm);
    kg.addColorStop(1.00, shade(kHelm, 0.62));
    g.fillStyle = kg; g.fillRect(kx - khr, khy - khr * 1.2, khr * 2, khr * 2.4);
    g.fillStyle = rgba(kBand, 0.95);
    g.fillRect(kx - khr, khy - khr * 0.14, khr * 2, khr * 0.20);
    g.fillStyle = rgba('#000000', 0.50);
    g.fillRect(kx - khr, khy + khr * 0.84, khr * 2, khr * 0.5);
    g.restore();
    /* rim light round the crown so the shell reads as a sphere */
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = rgba('#ffffff', 0.35);
    g.lineWidth = Math.max(1, w * 0.012);
    g.beginPath();
    g.ellipse(kx, khy, khr * 0.86, khr * 0.94, 0, Math.PI * 1.05, Math.PI * 1.85);
    g.stroke();
    g.restore();
    g.strokeStyle = rgba('#05070b', 0.85);
    g.lineWidth = Math.max(1.2, w * 0.018);
    g.beginPath(); g.ellipse(kx, khy, khr * 1.02, khr * 1.10, 0, 0, TAU); g.stroke();
    [-1, 1].forEach(function (s) {          // chin strap
      g.strokeStyle = rgba('#dfe9fb', 0.30);
      g.lineWidth = Math.max(1, w * 0.009);
      g.beginPath();
      g.moveTo(kx + s * khr * 0.80, khy + khr * 0.42);
      g.lineTo(kx + s * khr * 0.52, khy + khr * 1.12);
      g.stroke();
    });
  }

  /* ---- delivery box, drawn over the rider's lower back ---- */
  if (box) {
    const bhw = w * 0.256, by = h * 0.412, bh2 = h * 0.228;
    /* top face, receding */
    g.fillStyle = tint(L.box, 0.24);
    g.beginPath();
    g.moveTo(cx - bhw * 0.80, h * 0.374);
    g.lineTo(cx + bhw * 0.80, h * 0.374);
    g.lineTo(cx + bhw, by);
    g.lineTo(cx - bhw, by);
    g.closePath(); g.fill();
    g.fillStyle = rgba('#000000', 0.22);
    g.fillRect(cx - bhw, by - h * 0.008, bhw * 2, Math.max(1, h * 0.010));
    /* front face */
    g.fillStyle = linGrad(g, cx - bhw, 0, cx + bhw, 0, [
      [0.00, shade(L.box, 0.58)], [0.20, shade(L.box, 0.24)], [0.46, tint(L.box, 0.16)],
      [0.74, shade(L.box, 0.16)], [1.00, shade(L.box, 0.62)]
    ]);
    drawRoundedRect(g, cx - bhw, by, bhw * 2, bh2, w * 0.030); g.fill();
    /* hard edges, zip seam, latch, reflective tape */
    g.strokeStyle = rgba('#000000', 0.45);
    g.lineWidth = Math.max(1, w * 0.010);
    drawRoundedRect(g, cx - bhw, by, bhw * 2, bh2, w * 0.030); g.stroke();
    g.fillStyle = rgba(L.trim, 0.85);
    g.fillRect(cx - bhw * 0.90, by + bh2 * 0.30, bhw * 1.80, Math.max(1, bh2 * 0.055));
    g.fillStyle = rgba('#e8f1ff', 0.55);
    g.fillRect(cx - bhw * 0.90, by + bh2 * 0.70, bhw * 1.80, Math.max(1, bh2 * 0.085));
    g.strokeStyle = rgba('#000000', 0.35);
    g.lineWidth = Math.max(1, w * 0.008);
    g.beginPath();
    g.moveTo(cx, by + bh2 * 0.10); g.lineTo(cx, by + bh2 * 0.92);
    g.stroke();
    g.fillStyle = '#1b2230';
    drawRoundedRect(g, cx - w * 0.026, by + bh2 * 0.42, w * 0.052, bh2 * 0.16, w * 0.010); g.fill();
    /* strap over the top face */
    g.fillStyle = rgba('#0d1219', 0.75);
    g.fillRect(cx - bhw * 0.14, h * 0.374, bhw * 0.28, by - h * 0.374);
    /* corner light catch */
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = rgba('#dfe9fb', 0.18);
    g.fillRect(cx - bhw + w * 0.006, by + bh2 * 0.06, Math.max(1, w * 0.012), bh2 * 0.86);
    g.restore();
  }

  /* ---- helmet ---- */
  const hr = w * 0.184, hy = h * 0.134;
  g.save();
  g.beginPath(); g.ellipse(cx, hy, hr, hr * 1.10, 0, 0, TAU); g.clip();
  const helm = g.createRadialGradient(cx - hr * 0.40, hy - hr * 0.50, hr * 0.10, cx, hy, hr * 1.35);
  helm.addColorStop(0.00, tint(helmetColor, 0.55));
  helm.addColorStop(0.50, helmetColor);
  helm.addColorStop(1.00, shade(helmetColor, 0.62));
  g.fillStyle = helm; g.fillRect(cx - hr, hy - hr * 1.2, hr * 2, hr * 2.4);
  /* rear vent, shell seam, neck roll */
  g.fillStyle = rgba('#000000', 0.40);
  g.fillRect(cx - hr * 0.46, hy + hr * 0.06, hr * 0.92, hr * 0.22);
  g.fillStyle = rgba('#000000', 0.18);
  g.fillRect(cx - hr, hy - hr * 0.30, hr * 2, Math.max(1, hr * 0.10));
  if (L.vest) {                              // livery band round the shell
    g.fillStyle = rgba(L.vest, 0.75);
    g.fillRect(cx - hr, hy - hr * 0.62, hr * 2, hr * 0.26);
  }
  g.fillStyle = rgba('#000000', 0.62);
  g.fillRect(cx - hr, hy + hr * 0.70, hr * 2, hr * 0.6);
  g.restore();
  g.strokeStyle = rgba('#000000', 0.50);
  g.lineWidth = Math.max(1, w * 0.014);
  g.beginPath(); g.ellipse(cx, hy, hr * 0.98, hr * 1.08, 0, 0, TAU); g.stroke();

}

/* ------------------------------ coneRow ------------------------------ */
/* VISUAL_SIZE.coneRow 0.80 x 0.42 - low and wide.
   Three cones joined by a striped plank, so the whole thing reads as a
   blocked lane rather than one small object. */
function drawConeRowSprite(g, w, h) {
  const cones = [
    { x: 0.165, tilt: -0.06, tall: 0.955 },
    { x: 0.500, tilt: 0.02, tall: 1.000 },
    { x: 0.835, tilt: 0.05, tall: 0.930 }
  ];

  cones.forEach(function (c) {
    const cxp = w * c.x;
    const baseY = h * 0.985, tipY = h * (1 - 0.86 * c.tall);
    const halfB = w * 0.088;
    g.save();
    g.translate(cxp, baseY); g.rotate(c.tilt); g.translate(-cxp, -baseY);

    /* base slab */
    g.fillStyle = linGrad(g, cxp - halfB * 1.25, 0, cxp + halfB * 1.25, 0, [
      [0.00, '#7a3409'], [0.40, '#c85a0f'], [1.00, '#6e2f08']
    ]);
    drawRoundedRect(g, cxp - halfB * 1.25, baseY - h * 0.085, halfB * 2.5, h * 0.085, w * 0.010);
    g.fill();

    /* cone body */
    g.beginPath();
    g.moveTo(cxp - halfB, baseY - h * 0.060);
    g.quadraticCurveTo(cxp - halfB * 0.62, (baseY + tipY) * 0.5, cxp - halfB * 0.20, tipY + h * 0.030);
    g.quadraticCurveTo(cxp, tipY - h * 0.010, cxp + halfB * 0.20, tipY + h * 0.030);
    g.quadraticCurveTo(cxp + halfB * 0.62, (baseY + tipY) * 0.5, cxp + halfB, baseY - h * 0.060);
    g.closePath();
    g.fillStyle = linGrad(g, cxp - halfB, 0, cxp + halfB, 0, [
      [0.00, '#8f3a08'], [0.22, '#ff7a1a'], [0.50, '#ffa24d'], [0.78, '#e0620f'], [1.00, '#7d3207']
    ]);
    g.fill();

    g.save(); g.clip();
    /* reflective band - middle cone's band sits where the render layer
       drops its white glint (0.55 of the height above the base) */
    g.fillStyle = linGrad(g, cxp - halfB, 0, cxp + halfB, 0, [
      [0.00, '#98a2b4'], [0.30, '#ffffff'], [0.70, '#e6ecf7'], [1.00, '#8d95a6']
    ]);
    g.beginPath();
    g.moveTo(cxp - halfB * 1.4, h * 0.380);
    g.quadraticCurveTo(cxp, h * 0.408, cxp + halfB * 1.4, h * 0.380);
    g.lineTo(cxp + halfB * 1.4, h * 0.500);
    g.quadraticCurveTo(cxp, h * 0.528, cxp - halfB * 1.4, h * 0.500);
    g.closePath(); g.fill();
    /* grime at the base, scuff on the body */
    softEllipse(g, cxp, baseY, halfB * 1.3, h * 0.16, '#000000', 0.45);
    g.fillStyle = rgba('#5a2a08', 0.50);
    g.beginPath(); g.ellipse(cxp - halfB * 0.35, h * 0.30, halfB * 0.30, h * 0.05, 0.3, 0, TAU); g.fill();
    g.restore();
    g.restore();
  });

  /* striped plank spanning the blocked lane, resting on the cones */
  const py = h * 0.590, ph = h * 0.190;
  g.fillStyle = '#10151d';
  drawRoundedRect(g, w * 0.035, py - h * 0.016, w * 0.930, ph + h * 0.032, w * 0.012); g.fill();
  hazardStripes(g, w * 0.048, py, w * 0.904, ph, HAZARD_RED, HAZARD_WHITE, w * 0.062, 1);
  g.fillStyle = rgba('#ffffff', 0.12);
  g.fillRect(w * 0.048, py + ph * 0.06, w * 0.904, Math.max(1, ph * 0.12));
  g.fillStyle = rgba('#000000', 0.30);
  g.fillRect(w * 0.048, py + ph * 0.80, w * 0.904, ph * 0.20);
  g.strokeStyle = rgba('#000000', 0.45);
  g.lineWidth = Math.max(1, w * 0.006);
  drawRoundedRect(g, w * 0.048, py, w * 0.904, ph, w * 0.008); g.stroke();
}

/* ------------------------------ barrier ------------------------------ */
/* VISUAL_SIZE.barrier 0.86 x 0.52 - a wide striped board on two legs.
   Beacon housings sit at the top corners, where drawBillboardLights
   flashes its amber dots. */
function drawBarrierSprite(g, w, h) {
  const cx = w * 0.5;

  /* legs first - A-frames splayed outward, board covers their tops */
  [-1, 1].forEach(function (s) {
    g.fillStyle = '#39414f';
    g.beginPath();
    g.moveTo(cx + s * w * 0.230 - w * 0.022, h * 0.480);
    g.lineTo(cx + s * w * 0.230 + w * 0.022, h * 0.480);
    g.lineTo(cx + s * w * 0.300 + w * 0.026, h * 0.975);
    g.lineTo(cx + s * w * 0.300 - w * 0.026, h * 0.975);
    g.closePath(); g.fill();
    g.fillStyle = rgba('#ffffff', 0.10);
    g.beginPath();
    g.moveTo(cx + s * w * 0.230 - w * 0.022, h * 0.480);
    g.lineTo(cx + s * w * 0.230 - w * 0.006, h * 0.480);
    g.lineTo(cx + s * w * 0.300 + w * 0.006, h * 0.975);
    g.lineTo(cx + s * w * 0.300 - w * 0.026, h * 0.975);
    g.closePath(); g.fill();
    /* foot pad */
    g.fillStyle = '#1b212c';
    drawRoundedRect(g, cx + s * w * 0.300 - w * 0.070, h * 0.940, w * 0.140, h * 0.058, w * 0.012);
    g.fill();
  });
  /* cross brace */
  g.fillStyle = '#2b323f';
  g.fillRect(cx - w * 0.290, h * 0.760, w * 0.580, h * 0.040);

  /* board */
  const bx = w * 0.040, by = h * 0.140, bw = w * 0.920, bh = h * 0.360;
  g.fillStyle = '#10151d';
  drawRoundedRect(g, bx - w * 0.014, by - h * 0.026, bw + w * 0.028, bh + h * 0.052, w * 0.014);
  g.fill();
  hazardStripes(g, bx, by, bw, bh, HAZARD_RED, HAZARD_WHITE, w * 0.058, -1);
  /* retroreflective sheen across the upper half, grime along the bottom */
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = linGrad(g, 0, by, 0, by + bh, [
    [0.00, rgba('#ffffff', 0.14)], [0.55, rgba('#ffffff', 0.02)], [1.00, rgba('#ffffff', 0)]
  ]);
  g.fillRect(bx, by, bw, bh);
  g.restore();
  g.fillStyle = rgba('#000000', 0.32);
  g.fillRect(bx, by + bh * 0.82, bw, bh * 0.18);
  g.strokeStyle = rgba('#000000', 0.55);
  g.lineWidth = Math.max(1, w * 0.006);
  drawRoundedRect(g, bx, by, bw, bh, w * 0.008); g.stroke();
  /* white reflective edge strip under the board */
  g.fillStyle = rgba('#f2f5fa', 0.70);
  g.fillRect(bx + bw * 0.03, by + bh + h * 0.008, bw * 0.94, Math.max(1, h * 0.026));

  /* beacon housings at the top corners */
  [-1, 1].forEach(function (s) {
    const x = cx + s * w * 0.350;
    g.fillStyle = '#2b323f';
    g.fillRect(x - w * 0.012, h * 0.090, w * 0.024, h * 0.070);
    g.fillStyle = '#141922';
    drawRoundedRect(g, x - w * 0.042, h * 0.030, w * 0.084, h * 0.070, w * 0.020); g.fill();
    g.fillStyle = shade(SODIUM, 0.30);
    drawRoundedRect(g, x - w * 0.032, h * 0.040, w * 0.064, h * 0.048, w * 0.016); g.fill();
    g.fillStyle = rgba('#ffffff', 0.22);
    g.fillRect(x - w * 0.024, h * 0.046, w * 0.048, Math.max(1, h * 0.012));
  });
}

/* ----------------------------- player car ---------------------------- */
/* VISUAL_SIZE.playerCar 0.80 x 0.62 - wide and low.
   Reads at 16px as: a wide dark bar (rear wing) over two fat tyres with
   a bright gap between them, one red dot low centre. */
function drawF1Sprite(g, w, h, bodyColor, accentColor, opts) {
  opts = opts || {};
  const accent = accentColor || ACCENT_PLAYER;
  const carbon = opts.carbon || '#131923';
  const rain = opts.rainLight || '#ff2d2d';
  const cx = w * 0.5;
  const RW = w * 0.305;             // rear wing half span
  const TX = w * 0.375;             // rear tyre centre offset
  const TW = w * 0.200;             // rear tyre width

  /* rear tyres - outboard, taller than the bodywork */
  drawRearTyre(g, cx - TX, h, TW, h * 0.660);
  drawRearTyre(g, cx + TX, h, TW, h * 0.660);
  /* hot rotor showing in the gap between tyre and bodywork */
  [-1, 1].forEach(function (s) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = rgba('#ff8a2b', 0.22);
    drawRoundedRect(g, cx + s * (TX - TW * 0.5) - (s > 0 ? w * 0.013 : 0), h * 0.640,
                    w * 0.013, h * 0.150, w * 0.005);
    g.fill();
    g.restore();
  });

  /* foreshortened top: engine cover, then halo + helmet beyond it.
     The wing is drawn after this and buries everything below y=0.25, so
     only a short stub of cover shows - it must not read as a mast. */
  g.beginPath();
  g.moveTo(cx - w * 0.105, h * 0.126);
  g.lineTo(cx + w * 0.105, h * 0.126);
  g.lineTo(cx + w * 0.163, h * 0.330);
  g.lineTo(cx - w * 0.163, h * 0.330);
  g.closePath();
  g.fillStyle = topGrad(g, cx - w * 0.163, cx + w * 0.163, bodyColor); g.fill();
  g.fillStyle = rgba(accent, 0.45);
  g.fillRect(cx - w * 0.011, h * 0.132, w * 0.022, h * 0.115);
  /* halo hoop over the cockpit, seen almost edge-on */
  g.strokeStyle = '#3b4557';
  g.lineWidth = Math.max(1.5, w * 0.022);
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(cx - w * 0.098, h * 0.148);
  g.quadraticCurveTo(cx, h * 0.052, cx + w * 0.098, h * 0.148);
  g.stroke();
  g.strokeStyle = rgba('#e8f1ff', 0.35);
  g.lineWidth = Math.max(1, w * 0.008);
  g.beginPath();
  g.moveTo(cx - w * 0.098, h * 0.145);
  g.quadraticCurveTo(cx, h * 0.049, cx + w * 0.098, h * 0.145);
  g.stroke();
  /* helmet inside the hoop */
  g.fillStyle = '#0a0e15';
  drawRoundedRect(g, cx - w * 0.052, h * 0.062, w * 0.104, h * 0.078, w * 0.026); g.fill();
  const hm = g.createRadialGradient(cx - w * 0.018, h * 0.074, w * 0.006, cx, h * 0.096, w * 0.066);
  hm.addColorStop(0.00, '#ffffff');
  hm.addColorStop(0.60, '#b9c6da');
  hm.addColorStop(1.00, '#5d6a80');
  g.fillStyle = hm;
  drawRoundedRect(g, cx - w * 0.043, h * 0.066, w * 0.086, h * 0.062, w * 0.022); g.fill();
  g.fillStyle = rgba(accent, 0.55);
  g.fillRect(cx - w * 0.043, h * 0.088, w * 0.086, h * 0.013);

  /* gearbox + crash structure: dark, narrow, drawn before the wing so the
     wing buries its top. From directly behind this is nearly all you see
     of the car's centreline - the engine cover is hidden above. */
  g.beginPath();
  g.moveTo(cx - w * 0.078, h * 0.360);
  g.lineTo(cx + w * 0.078, h * 0.360);
  g.lineTo(cx + w * 0.052, h * 0.660);
  g.lineTo(cx - w * 0.052, h * 0.660);
  g.closePath();
  g.fillStyle = linGrad(g, cx - w * 0.078, 0, cx + w * 0.078, 0, [
    [0.00, '#10151d'], [0.35, '#2d3646'], [0.62, '#232b38'], [1.00, '#0d1219']
  ]);
  g.fill();

  /* rear wing: top surface, flap rear face, slot gap, main plane */
  [-1, 1].forEach(function (s) {          // endplates
    g.fillStyle = carbon;
    drawRoundedRect(g, cx + s * RW - (s > 0 ? 0 : w * 0.038), h * 0.230,
                    w * 0.038, h * 0.300, w * 0.008);
    g.fill();
    g.fillStyle = rgba(accent, 0.70);

  /* top surface of the flap, receding */

  [-1, 1].forEach(function (s) {
